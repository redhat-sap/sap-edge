# Prerequisites:
# 1. Ensure the ObjectBucketClaim (OBC) 'sap-eic-restricted-cluster-config-resources'
#    is created and bound in the pipeline namespace. The pipeline creates the
#    folders under 'restricted-resources/pr<N>/' (one set per PR) and pauses
#    (approval-upload-restricted-resources) until the bundles are uploaded.
#
# 2. Ensure the Service Mesh 3.x operator is installed on the target cluster
#    (via OperatorHub or CLI before running this pipeline)
#
# 3. Ensure a Squid proxy is running on the jumphost and accessible from the
#    hosted cluster worker nodes. Create a Secret named '{hubClusterName}-proxy-config'
#    with keys: PROXY_HOST, PROXY_PORT, PROXY_IP.
#
# 4. The httpbinipfilter iFlow has an IP filter (X-Forwarded-For based).
#    Whitelist both the hub cluster and managed/hosted cluster pod CIDRs
#    in the iFlow's IP filter policy (e.g. 10.128.0.0/14, 10.132.0.0/14,
#    100.64.0.0/24). Check each cluster's CIDR with:
#      oc get network.config cluster -o jsonpath='{.spec.clusterNetwork[*].cidr}'
#
# Scenario: Dedicated SAP service mesh with corporate proxy,
#   single Edge Integration Cell (multi-EIC topology A with cellCount: "1")
#   - Deploys an independent Istio control plane 'sap-mesh-istio'
#   - Enables DNS capture (ISTIO_META_DNS_CAPTURE / ISTIO_META_DNS_AUTO_ALLOCATE)
#   - Creates a ServiceEntry in edgelm namespace to permit proxy connections
#   - ELM registration should have "Enable HTTP Proxy" checked
#   - All SAP namespaces follow the -N naming scheme (edge-icell-1, istio-gateways-1, etc.)
#   - restrictedResourcesComponents must exclude edge-icell-2 when cellCount: "1"
#     (apply-rbac fails on an empty folder)
#   - The upload gate pauses every run (ApprovalTasks cannot be skipped conditionally)

---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: hcp-ossm3-proxy-pr{{ pull_request_number }}-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"   # only PRs
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/task: "[./.tekton/tasks/git-clone.yaml]"
    pipelinesascode.tekton.dev/max-keep-runs: "1"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
spec:
  pipelineRef:
    name: hcp-ossm3-dedicated-validation-pipeline
  timeouts:
    pipeline: "336h"      # Total pipeline timeout (14 days)
    tasks: "335h"         # Individual task timeout (tasks + finally must be <= pipeline)
    finally: "60m"        # Finally tasks timeout
  params:
    # --- Git parameters ---
    - name: repoUrl
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: pullRequestNumber
      value: "{{ pull_request_number }}"

    # --- HCP cluster parameters ---
    # hostedClusterName: include hubClusterName to avoid collisions across hubs
    # Pattern: {prefix}-{hubClusterName}-pr{number}
    - name: hostedClusterName
      value: "hcp-proxy-eic-pr{{ pull_request_number }}"
    # hostedClusterName: include hubClusterName to avoid collisions across hubs
    # Pattern: {prefix}-{hubClusterName}-pr{number}
    - name: hostedClusterNamespace
      value: "clusters"
    - name: releaseImage
      value: "quay.io/openshift-release-dev/ocp-release:4.21.7-x86_64"
    - name: nodePoolReplicas
      value: "3"
    - name: nodePoolCpuCores
      value: "16"
    - name: nodePoolMemoryGB
      value: "32"
    - name: rootDiskSizeGB
      value: "120"
    - name: pullSecretName
      value: "mj-pull-secret"
    - name: etcdStorageClass
      value: ""
    # hubClusterName: name of the target hub cluster
    # The pipeline derives the kubeconfig secret as: {hubClusterName}-kubeconfig
    # Ensure a Secret named "{hubClusterName}-kubeconfig" exists with the hub's kubeconfig
    - name: hubClusterName
      value: "eic"

    # --- OSSM3 parameters ---
    - name: ossm3Channel
      value: "stable-3.2"
    - name: obcName
      value: "sap-eic-restricted-cluster-config-resources"
    - name: s3Prefix
      value: "restricted-resources/pr{{ pull_request_number }}/"
    - name: restrictedResourcesComponents
      value: "elm edge-icell-1"
    - name: cellCount
      value: "1"

    # --- EIC services parameters ---
    - name: postgresVersion
      value: "v15"
    - name: postgresHA
      value: "false"
    - name: datastoreType
      value: "redis"
    - name: redisClusterType
      value: "standard"

    # --- Endpoint test parameters ---
    - name: eicAuthSecretName
      value: "eic-auth-secret"
    - name: publicDNS
      value: "false"

    # --- Jira parameters ---
    - name: jiraSecretName
      value: "jira-secret-mj"
    - name: jiraIssueKey
      value: "SAPOCP-1978"

    # --- Pipeline control ---
    - name: skipTeardown
      value: "false"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteMany]
          storageClassName: ocs-storagecluster-cephfs
          resources:
            requests:
              storage: 2Gi
