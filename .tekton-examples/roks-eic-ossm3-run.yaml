# Example PipelineRun for roks-eic-full-test-pipeline: EIC with restricted
# access on ROKS (Red Hat OpenShift on IBM Cloud, VPC). Terraform creates the
# cluster, an IBM Cloud Container Registry namespace and IBM Cloud Databases
# for PostgreSQL/Redis in the resource group redhat-sap-edge-roks-ci (see
# roks/terraform/README.md), and destroys them at the end.
#
# One-time setup in the pipeline namespace. The Secret and bucket names below
# marked PLACEHOLDER are examples: create them under these names or change the
# values to the names you used.
#
# 1. An IBM Cloud Object Storage bucket for the Terraform state
#    (terraformStateBucket; one state per cluster under
#    roks/<clusterName>/terraform.tfstate) with HMAC credentials. Keep the
#    bucket private: the state holds the cluster admin certificate, the
#    registry API key and the database passwords.
# 2. One credentials Secret (roksCredentialsSecretName) with the keys
#    - IBMCLOUD_API_KEY: preferably the API key of a service ID (e.g.
#      redhat-sap-edge-roks-ci) with access to VPC Infrastructure Services,
#      Kubernetes Service, Cloud Object Storage and Databases in the resource
#      group, Container Registry (Manager, Administrator) in eu-de and IAM
#      Identity Service (Operator);
#    - AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY: the HMAC credentials of the
#      state bucket from step 1;
#    - POSTGRES_ADMIN_PASSWORD: read only when deployPostgres is "true" (leave
#      it out otherwise). The IBM provider rule: 15-72 characters of letters,
#      digits, - and _, with at least one lower case letter, one upper case
#      letter and one digit, not starting with - or _, and no trailing newline.
#      oc create secret generic roks-ci-credentials \
#        --from-literal=IBMCLOUD_API_KEY=<API key> \
#        --from-literal=AWS_ACCESS_KEY_ID=<HMAC access key ID> \
#        --from-literal=AWS_SECRET_ACCESS_KEY=<HMAC secret access key> \
#        --from-literal=POSTGRES_ADMIN_PASSWORD=<password>
# 3. As for the other EIC runs: the ObjectBucketClaim
#    sap-eic-restricted-cluster-config-resources, the EIC auth Secret and the
#    Jira Secret. The zips are not uploaded in advance: the run creates
#    restricted-resources/<clusterName>/elm/ and .../edge-icell/ in the OBC
#    bucket (archiving earlier zips) and waits for the zips in two steps
#    (wait-elm-zip, wait-eic-zip). Upload the ELM zip to elm/ first; once
#    applied, register the Edge Node and deploy EIC, then upload the EIC zip
#    to edge-icell/. Each run needs fresh uploads.
#    No hub cluster is needed: the Secrets eic-credentials-roks-<cluster>
#    and eic-registry-roks-<cluster> go to the pipeline namespace unless
#    hubKubeconfigSecretName is set (see below).
# 4. Add 172.17.0.0/18 (ROKS pod network) and 10.0.0.0/16 (VPC) to the IP
#    filter allowlist of the httpbinipfilter iFlow (otherwise
#    test-httpbinipfilter fails).
# 5. Only for the optional browser automation (sapBrowserMode below): build
#    and push the runner image (hack/sap-browser/PIPELINE.md), apply
#    hack/sap-browser/roks-runner-rbac.yaml and upload the Linux elm CLI to
#    tools/elm/ in the OBC bucket (.tekton/README.md, Browser automation).
#
# A failed or rejected run leaves the cluster and its IBM Cloud resources in
# place for debugging (they are billable): destroy them from the Terraform
# state with  make roks-destroy CLUSTER=<clusterName>  (roks.makefile).
#
# Pipelines-as-Code fills in {{ pull_request_number }}, {{ repo_url }} and
# {{ revision }}: to run it, copy this file into .tekton/ on a pull request
# (or replace the placeholders before oc create -f). Do not push to the pull
# request while deploy-roks or teardown-roks runs (see cancel-in-progress).

---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: roks-eic-full-test-pr{{ pull_request_number }}-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"   # only PRs
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/task: "[./.tekton/tasks/git-clone.yaml, ./.tekton/tasks/roks-deploy-task.yaml, ./.tekton/tasks/roks-validate-and-get-access-task.yaml, ./.tekton/tasks/roks-registry-access-task.yaml, ./.tekton/tasks/roks-validate-and-create-configmap-task.yaml, ./.tekton/tasks/roks-teardown-task.yaml, ./.tekton/tasks/ossm3-preflight-check-task.yaml, ./.tekton/tasks/ossm3-verify-operators-task.yaml, ./.tekton/tasks/ossm3-download-and-apply-rbac-task.yaml, ./.tekton/tasks/ossm3-prepare-namespaces-task.yaml, ./.tekton/tasks/ossm3-configure-mesh-task.yaml, ./.tekton/tasks/ossm3-generate-sa-based-kubeconfig-task.yaml]"
    pipelinesascode.tekton.dev/max-keep-runs: "1"
    # "false": a push must never cancel this run. Cancelling kills the pod in
    # the middle of terraform apply (deploy-roks, 60-90 minutes) or destroy
    # (teardown-roks, up to 2 hours): IBM Cloud may have created a billable
    # cluster that the state does not record, and the state lock stays. A
    # second run for the same PR fails on the state lock instead. Do not push
    # while deploy-roks or teardown-roks runs (roks/terraform/README.md).
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
spec:
  pipelineRef:
    name: roks-eic-full-test-pipeline
  # When enabling sapBrowserMode, uncomment (the browser tasks run as the
  # ServiceAccount from hack/sap-browser/roks-runner-rbac.yaml):
  # taskRunSpecs:
  #   - pipelineTaskName: sap-browser-deploy
  #     serviceAccountName: roks-sap-browser-runner
  #   - pipelineTaskName: sap-browser-teardown
  #     serviceAccountName: roks-sap-browser-runner
  timeouts:
    pipeline: "336h"      # Total pipeline timeout (14 days)
    tasks: "335h"         # Individual task timeout (tasks + finally must be <= pipeline); well above Terraform's 3h create / 2h delete
    finally: "60m"        # Finally tasks timeout
  params:
    - name: repoUrl
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: pullRequestNumber
      value: "{{ pull_request_number }}"
    # --- ROKS cluster (IBM Cloud) ---
    # Starts with redhat-, at most 30 characters (also the ICR namespace)
    - name: clusterName
      value: "redhat-roks-eic-pr{{ pull_request_number }}"
    - name: ibmcloudRegion
      value: "eu-de"
    - name: ibmcloudResourceGroup
      value: "redhat-sap-edge-roks-ci"
    - name: openshiftVersion
      value: "4.21_openshift"
    - name: workerFlavor
      value: "bx2.16x64"
    - name: workersPerZone
      value: "1"
    - name: roksCredentialsSecretName
      value: "roks-ci-credentials"              # PLACEHOLDER: Secret from setup step 2
    - name: terraformStateBucket
      value: "redhat-sap-edge-roks-ci-tfstate"  # PLACEHOLDER: COS bucket from setup step 1
    - name: terraformStateEndpoint
      value: "https://s3.eu-de.cloud-object-storage.appdomain.cloud"  # S3 endpoint of the bucket's region
    # --- IBM Cloud Databases ---
    - name: deployPostgres
      value: "true"
    - name: deployRedis
      value: "true"
    # --- Tests and reporting ---
    - name: eicAuthSecretName
      value: "eic-auth-secret"
    - name: publicDNS
      value: "false"
    - name: skipAutomatedTests
      value: "false"
    - name: jiraSecretName
      value: "jira-secret-mj"
    - name: jiraIssueKey
      value: ""                                 # Jira issue to comment on; empty skips update-jira-ticket
    # --- Hub cluster (optional; none by default) ---
    # To store eic-credentials-roks-<cluster> and eic-registry-roks-<cluster>
    # on a hub cluster instead of the pipeline cluster, set this param to the
    # name of a Secret in the pipeline namespace with the hub kubeconfig (key
    # kubeconfig, config or value), e.g.:
    # - name: hubKubeconfigSecretName
    #   value: "eic-kubeconfig"
    # --- OSSM3 parameters ---
    - name: ossm3Channel
      value: "stable-3.3"
    - name: obcName
      value: "sap-eic-restricted-cluster-config-resources"
    # --- SAP browser automation (optional; setup step 5) ---
    # "disabled": everything by hand. To enable it, set "inspect" (log in, then
    # record the ELM screens with Playwright Inspector) or "auto", and
    # uncomment the image and the ELM URL (next lines) and taskRunSpecs (top
    # of spec). Until the ELM screens are mapped, "auto" hands over to you
    # right after the login.
    # - name: sapBrowserImage
    #   value: "YOUR_REGISTRY/YOUR_PROJECT/sap-browser:dev-1"
    # - name: sapElmUrl
    #   value: "https://YOUR-TENANT/comsapclmedgelm.comsapclmedgelm/index.html"
    - name: sapBrowserMode
      value: "disabled"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteMany]
          storageClassName: ocs-storagecluster-cephfs
          resources:
            requests:
              storage: 2Gi
