# Apply with oc -n YOUR_PIPELINE_NAMESPACE apply -f ...
# Select this service account only for the sap-browser PipelineTask via taskRunSpecs.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: roks-sap-browser-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: roks-sap-browser-runner
rules:
  - apiGroups: [tekton.dev]
    resources: [pipelineruns, taskruns]
    verbs: [get]
  - apiGroups: ['']
    resources: [services]
    verbs: [create, get, delete]
  - apiGroups: [route.openshift.io]
    resources: [routes]
    verbs: [create, get, delete]
  - apiGroups: ['']
    resources: [serviceaccounts]
    verbs: [get, patch]
    resourceNames: [roks-sap-browser-runner]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: roks-sap-browser-runner
subjects:
  - kind: ServiceAccount
    name: roks-sap-browser-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: roks-sap-browser-runner
---
# The pipeline ServiceAccount needs to create per-run Roles and RoleBindings
# that grant the browser runner access to this run's Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: roks-sap-browser-access-manager
rules:
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: roks-sap-browser-access-manager
subjects:
  - kind: ServiceAccount
    name: pipeline
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: roks-sap-browser-access-manager
---
# If the browser task's OAuth proxy logs 403 on subjectaccessreviews (when
# validating tokens), a cluster admin must bind system:auth-delegator to the
# runner ServiceAccount:
#   oc adm policy add-cluster-role-to-user system:auth-delegator \
#     -z roks-sap-browser-runner -n YOUR_PIPELINE_NAMESPACE
