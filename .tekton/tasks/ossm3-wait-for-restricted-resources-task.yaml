apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ossm3-wait-for-restricted-resources
spec:
  description: >-
    Wait for restricted-resources bundle zips to appear in S3 folders.
    Polls each component folder under the prefix until all have at least one
    .zip file; an empty folder keeps it waiting and a failed listing is
    retried. Used to gate pipeline steps that depend on manual or automated
    uploads. Non-destructive: does not modify S3 content.
  params:
    - name: obcName
      type: string
      description: "Name of the ObjectBucketClaim (OBC) — used to look up the S3 credentials Secret and endpoint ConfigMap"
      default: "sap-eic-restricted-cluster-config-resources"
    - name: s3Prefix
      type: string
      description: "S3 key prefix of the deployment (e.g. restricted-resources/multi-eic/)"
    - name: components
      type: string
      description: "Space-separated component folders to check under the prefix (e.g. 'elm edge-icell'). Must be non-empty."
    - name: instructions
      type: string
      description: "Optional instructions to print once before waiting (printed verbatim: shell syntax in them is not run)"
      default: ""
    - name: pollSeconds
      type: string
      description: "Seconds to wait between polls"
      default: "30"
  steps:
    - name: wait-for-zips
      image: registry.access.redhat.com/ubi9/ubi
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: $(params.obcName)
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.obcName)
              key: AWS_SECRET_ACCESS_KEY
        - name: BUCKET_HOST
          valueFrom:
            configMapKeyRef:
              name: $(params.obcName)
              key: BUCKET_HOST
        - name: BUCKET_PORT
          valueFrom:
            configMapKeyRef:
              name: $(params.obcName)
              key: BUCKET_PORT
        - name: BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: $(params.obcName)
              key: BUCKET_NAME
        # From the env, not pasted into the script: the instructions can hold
        # shell syntax (e.g. the upload plan's $(oc get secret ...) lines)
        # that must be printed, never run
        - name: INSTRUCTIONS
          value: $(params.instructions)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        S3_PREFIX="$(params.s3Prefix)"
        COMPONENTS="$(params.components)"
        POLL_SECONDS="$(params.pollSeconds)"
        PREFIX="${S3_PREFIX%/}/"

        echo "=========================================="
        echo "OSSM3 Wait for Restricted-Resources Zips"
        echo "=========================================="
        echo "S3 Bucket: ${BUCKET_NAME}"
        echo "S3 Prefix: ${PREFIX}"
        echo "Components: ${COMPONENTS}"
        echo "=========================================="

        # Validate components is non-empty
        if [[ -z "${COMPONENTS}" ]]; then
          echo "❌ Error: components parameter must be non-empty"
          exit 1
        fi

        # Install required tools
        echo "📦 Installing required packages..."
        dnf install -y unzip > /dev/null 2>&1

        echo "📦 Installing AWS CLI..."
        curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        unzip -q /tmp/awscliv2.zip -d /tmp
        /tmp/aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli
        rm -rf /tmp/awscliv2.zip /tmp/aws
        aws --version

        S3_ENDPOINT="https://${BUCKET_HOST}:${BUCKET_PORT}"
        s3() { aws "$@" --endpoint-url "${S3_ENDPOINT}" --no-verify-ssl; }

        # aws stderr goes to this file only: it could hold credentials
        LIST_ERR=$(mktemp)
        trap 'rm -f "${LIST_ERR}"' EXIT

        # list_zips FOLDER: sets ZIP_KEYS to the .zip keys under the folder,
        # one per line (keys may contain spaces: whole-line .zip match, the
        # key is everything after the date, time and size fields), and
        # LIST_FAILED=true when aws failed. aws s3 ls exits 1 with no output
        # and no error for an empty folder: that is not a failure.
        list_zips() {
          local LISTING LIST_RC=0
          LISTING=$(s3 s3 ls "s3://${BUCKET_NAME}/${PREFIX}$1/" --recursive 2>"${LIST_ERR}") || LIST_RC=$?
          LIST_FAILED=false
          if [[ "${LIST_RC}" -ne 0 ]] && { [[ "${LIST_RC}" -ne 1 ]] || [[ -n "${LISTING}" ]] || [[ -s "${LIST_ERR}" ]]; }; then
            LIST_FAILED=true
          fi
          ZIP_KEYS=$(printf '%s\n' "${LISTING}" | awk '/\.zip$/ { sub(/^[^ ]+ +[^ ]+ +[^ ]+ +/, ""); print }')
        }

        # Print instructions once (verbatim, from the env)
        if [[ -n "${INSTRUCTIONS:-}" ]]; then
          echo ""
          printf '%s\n' "${INSTRUCTIONS}"
        fi

        # Print target folders
        echo ""
        echo "Target folders:"
        for C in ${COMPONENTS}; do
          echo "  s3://${BUCKET_NAME}/${PREFIX}${C}/"
        done

        # Convert components to array
        read -r -a COMPONENT_LIST <<< "${COMPONENTS}"

        # Poll until all components have at least one .zip. A failed listing
        # (network, credentials, endpoint) counts as "no zip yet" and is
        # retried; it is reported for the 1st failure and then every 10th.
        POLL_COUNT=0
        FAILED_LISTINGS=0
        while true; do
          POLL_COUNT=$((POLL_COUNT + 1))
          MISSING=()

          for C in "${COMPONENT_LIST[@]}"; do
            list_zips "${C}"
            if [[ "${LIST_FAILED}" == "true" ]]; then
              FAILED_LISTINGS=$((FAILED_LISTINGS + 1))
              if [[ $((FAILED_LISTINGS % 10)) -eq 1 ]]; then
                echo "⚠️  listing ${C} failed (attempt ${POLL_COUNT}); retrying"
              fi
            fi
            if [[ -z "${ZIP_KEYS}" ]]; then
              MISSING+=("${C}")
            fi
          done

          if [[ ${#MISSING[@]} -eq 0 ]]; then
            # All components have zips — success!
            break
          fi

          # Print waiting message every 10 polls
          if [[ $((POLL_COUNT % 10)) -eq 0 ]]; then
            echo "⏳ still waiting for: ${MISSING[*]}"
          fi

          sleep "${POLL_SECONDS}"
        done

        # Print found keys
        echo ""
        echo "✅ All components have zips:"
        for C in "${COMPONENT_LIST[@]}"; do
          list_zips "${C}"
          if [[ -n "${ZIP_KEYS}" ]]; then
            printf '%s\n' "${ZIP_KEYS}" | sed 's/^/  /'
          fi
          if [[ "${LIST_FAILED}" == "true" ]]; then
            echo "  ⚠️  listing ${C} failed; its zips were found while polling"
          fi
        done

        echo ""
        echo "=========================================="
        echo "✅ All restricted-resources zips found"
        echo "=========================================="
