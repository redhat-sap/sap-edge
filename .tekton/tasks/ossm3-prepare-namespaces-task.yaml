apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ossm3-prepare-namespaces
spec:
  description: >-
    Configure the namespaces of SAP Edge Lifecycle Management and Edge
    Integration Cell for the restricted-access model: Service Mesh injection
    labels and SCC security annotations. The namespaces themselves are created
    by the SAP restricted-resources bundles (with their ownership labels), so
    this task never creates one: it configures the ones that exist and skips
    the others until a later bundle creates them (e.g. the EIC namespaces
    while only the ELM bundle is applied).
  params:
    - name: hostedClusterName
      type: string
      description: "Name of the hosted cluster"
    - name: hostedClusterNamespace
      type: string
      description: "Namespace for HostedCluster resources"
      default: "clusters"
    - name: hubKubeconfigSecretName
      type: string
      description: "Name of the Secret containing kubeconfig for hub cluster (optional, uses in-cluster config if empty)"
      default: ""
    - name: useWorkspaceKubeconfig
      type: string
      description: "Use kubeconfig from workspace instead of HCP extraction (for ARO/ROSA direct cluster access)"
      default: "false"
  workspaces:
    - name: source
  steps:
    - name: prepare-namespaces
      image: registry.access.redhat.com/ubi9/ubi
      timeout: "336h"
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        CLUSTER_NAME="$(params.hostedClusterName)"
        CLUSTER_NS="$(params.hostedClusterNamespace)"
        HUB_KUBECONFIG_SECRET="$(params.hubKubeconfigSecretName)"
        USE_WORKSPACE_KC="$(params.useWorkspaceKubeconfig)"

        echo "=========================================="
        echo "OSSM3 Prepare Namespaces Task"
        echo "=========================================="
        echo "Cluster: ${CLUSTER_NAME}"
        echo "=========================================="

        # Install required tools
        echo "📦 Installing OpenShift CLI..."
        curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz -o /tmp/oc.tar.gz
        tar xzf /tmp/oc.tar.gz -C /tmp
        mv /tmp/oc /usr/local/bin/
        cp /usr/local/bin/oc /usr/local/bin/kubectl
        rm -f /tmp/oc.tar.gz
        oc version --client

        if [[ "${USE_WORKSPACE_KC}" == "true" ]]; then
          # Direct cluster access mode (ARO/ROSA)
          echo "📋 Using kubeconfig from workspace (direct cluster access mode)"
          if [[ ! -f "$(workspaces.source.path)/kubeconfig" ]]; then
            echo "❌ useWorkspaceKubeconfig=true but no kubeconfig found in workspace"
            exit 1
          fi
          export KUBECONFIG="$(workspaces.source.path)/kubeconfig"
          echo "🔍 Verifying access to cluster..."
          oc get nodes
          echo "✅ Successfully connected to cluster"
        else
          # HCP mode: extract kubeconfig from hosted cluster Secret via hub
          # Configure hub cluster kubeconfig if provided
          if [[ -n "${HUB_KUBECONFIG_SECRET}" ]]; then
            echo "🔐 Extracting hub cluster kubeconfig from secret: ${HUB_KUBECONFIG_SECRET}..."
            HUB_KUBECONFIG="/tmp/hub-kubeconfig"
            if kubectl get secret "${HUB_KUBECONFIG_SECRET}" -o jsonpath='{.data.kubeconfig}' 2>/dev/null | base64 -d > "${HUB_KUBECONFIG}" 2>/dev/null && [[ -s "${HUB_KUBECONFIG}" ]]; then
              echo "✅ Kubeconfig extracted (key: kubeconfig)"
            elif kubectl get secret "${HUB_KUBECONFIG_SECRET}" -o jsonpath='{.data.config}' 2>/dev/null | base64 -d > "${HUB_KUBECONFIG}" 2>/dev/null && [[ -s "${HUB_KUBECONFIG}" ]]; then
              echo "✅ Kubeconfig extracted (key: config)"
            elif kubectl get secret "${HUB_KUBECONFIG_SECRET}" -o jsonpath='{.data.value}' 2>/dev/null | base64 -d > "${HUB_KUBECONFIG}" 2>/dev/null && [[ -s "${HUB_KUBECONFIG}" ]]; then
              echo "✅ Kubeconfig extracted (key: value)"
            else
              echo "❌ Failed to extract kubeconfig from secret '${HUB_KUBECONFIG_SECRET}'"
              echo "   Secret should have kubeconfig data under key 'kubeconfig', 'config', or 'value'"
              exit 1
            fi
            chmod 600 "${HUB_KUBECONFIG}"
            export KUBECONFIG="${HUB_KUBECONFIG}"
            echo "✅ Using hub kubeconfig for cluster operations"
            oc whoami
          else
            echo "ℹ️  No hub kubeconfig secret provided, using in-cluster service account"
          fi

          # Extract kubeconfig for hosted cluster
          echo "🔐 Extracting kubeconfig for hosted cluster..."
          KUBECONFIG_SECRET="${CLUSTER_NAME}-admin-kubeconfig"

          if ! oc get secret "${KUBECONFIG_SECRET}" -n "${CLUSTER_NS}" > /dev/null 2>&1; then
            echo "❌ Kubeconfig secret '${KUBECONFIG_SECRET}' not found in namespace '${CLUSTER_NS}'"
            exit 1
          fi

          HOSTED_KUBECONFIG="/tmp/hosted-kubeconfig"
          oc get secret "${KUBECONFIG_SECRET}" -n "${CLUSTER_NS}" \
            -o jsonpath='{.data.kubeconfig}' | base64 -d > "${HOSTED_KUBECONFIG}"
          chmod 600 "${HOSTED_KUBECONFIG}"

          export KUBECONFIG="${HOSTED_KUBECONFIG}"
          [[ -f "$(workspaces.source.path)/.kubeconfig-rewrite.sh" ]] && source "$(workspaces.source.path)/.kubeconfig-rewrite.sh" "${HOSTED_KUBECONFIG}"

          echo "🔍 Verifying access to hosted cluster..."
          oc get nodes
          echo "✅ Successfully connected to hosted cluster"
        fi

        # --- Overlay labels and annotations on the namespaces the SAP bundles created ---
        # The restricted-resources bundles create these namespaces with their
        # edgelm.sap.com/edge-node-id ownership labels; creating them here
        # ahead of a bundle would leave namespaces that the bundle must claim.
        NAMESPACES=(edgelm istio-gateways edge-icell edge-icell-secrets edge-icell-ela edge-icell-services)

        echo ""
        echo "🔍 Checking which namespaces exist..."
        PRESENT=" "
        SKIPPED=0
        for NS in "${NAMESPACES[@]}"; do
          # --ignore-not-found: empty output means absent; a failing oc is a real error
          FOUND=$(oc get namespace "${NS}" --ignore-not-found -o name)
          if [[ -n "${FOUND}" ]]; then
            PRESENT="${PRESENT}${NS} "
            echo "   ✅ ${NS}"
          else
            SKIPPED=$((SKIPPED + 1))
            echo "   ⏭️  ${NS}: not created yet, skipped (a later SAP bundle creates it)"
          fi
        done
        if [[ "${PRESENT}" == " " ]]; then
          echo "❌ None of the SAP namespaces exist: apply the SAP restricted-resources bundles first (apply-rbac)"
          exit 1
        fi
        present() { [[ "${PRESENT}" == *" $1 "* ]]; }

        # --- Label namespaces for Service Mesh auto-injection ---
        echo ""
        echo "🏷️ Labeling namespaces for Service Mesh injection..."

        # Namespaces with both istio-injection and edgelm product label
        MESH_NAMESPACES=(edgelm edge-icell edge-icell-ela edge-icell-services istio-gateways)
        for NS in "${MESH_NAMESPACES[@]}"; do
          present "${NS}" || continue
          echo "   Labeling ${NS} with istio-injection=enabled and edgelm.sap.com/product=edgelm"
          oc label namespace "${NS}" istio-injection=enabled edgelm.sap.com/product=edgelm --overwrite
        done

        # edge-icell-secrets gets only the product label (no istio injection)
        if present edge-icell-secrets; then
          echo "   Labeling edge-icell-secrets with edgelm.sap.com/product=edgelm (no istio injection)"
          oc label namespace edge-icell-secrets edgelm.sap.com/product=edgelm --overwrite
        fi

        echo "✅ Namespace labels applied"

        # --- Apply the necessary security annotations for SCCs ---
        echo ""
        echo "🔐 Applying SCC security annotations..."

        if present edgelm; then
          echo "   edgelm: supplemental-groups=67000/1000"
          oc annotate namespace edgelm openshift.io/sa.scc.supplemental-groups="67000/1000" --overwrite
        fi

        if present edge-icell; then
          echo "   edge-icell: uid-range=10000/100, supplemental-groups=1000/100"
          oc annotate namespace edge-icell openshift.io/sa.scc.uid-range="10000/100" --overwrite
          oc annotate namespace edge-icell openshift.io/sa.scc.supplemental-groups="1000/100" --overwrite
        fi

        if present edge-icell-ela; then
          echo "   edge-icell-ela: uid-range=100000/1000, supplemental-groups=100002/1000"
          oc annotate namespace edge-icell-ela openshift.io/sa.scc.uid-range="100000/1000" --overwrite
          oc annotate namespace edge-icell-ela openshift.io/sa.scc.supplemental-groups="100002/1000" --overwrite
        fi

        if present edge-icell-services; then
          echo "   edge-icell-services: uid-range=1000000/1000, supplemental-groups=1000002/1000"
          oc annotate namespace edge-icell-services openshift.io/sa.scc.uid-range="1000000/1000" --overwrite
          oc annotate namespace edge-icell-services openshift.io/sa.scc.supplemental-groups="1000002/1000" --overwrite
        fi

        echo "✅ SCC annotations applied"

        # --- Verify the configured namespaces are Active ---
        echo ""
        echo "🔍 Verifying namespace status..."
        ALL_ACTIVE=true
        CONFIGURED=0
        for NS in "${NAMESPACES[@]}"; do
          present "${NS}" || continue
          CONFIGURED=$((CONFIGURED + 1))
          STATUS=$(oc get namespace "${NS}" -o jsonpath='{.status.phase}')
          if [[ "${STATUS}" == "Active" ]]; then
            echo "   ✅ ${NS}: ${STATUS}"
          else
            echo "   ❌ ${NS}: ${STATUS}"
            ALL_ACTIVE=false
          fi
        done

        if [[ "${ALL_ACTIVE}" != "true" ]]; then
          echo "❌ Not all namespaces are in Active state"
          exit 1
        fi

        echo ""
        echo "=========================================="
        echo "✅ Namespace preparation completed"
        echo "   Configured ${CONFIGURED} namespaces; skipped ${SKIPPED} not created yet"
        echo "=========================================="
