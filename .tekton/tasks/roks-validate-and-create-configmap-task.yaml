apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: roks-validate-and-create-configmap
spec:
  description: >-
    Creates the ConfigMap cluster-info-roks-<clusterName> for the endpoint
    tests on the pipeline cluster: host = eic.<ingress subdomain> (Terraform
    output ingress_hostname from roks-deploy) and ingressIP = the
    istio-ingressgateway LoadBalancer IP or, if it has none (ROKS VPC load
    balancers usually expose only a hostname), its hostname, which
    endpoint-tests uses with curl --connect-to. Reads the ROKS cluster
    through the workspace kubeconfig. Must run AFTER EIC is deployed.
  params:
    - name: clusterName
      type: string
      description: "ROKS cluster name"
  workspaces:
    - name: source
      description: "Workspace with kubeconfig (token kubeconfig from roks-validate-and-get-access) and roks-terraform-outputs.json"
  results:
    - name: cluster-summary
      description: "Brief cluster and ingress summary"
  steps:
    - name: validate-and-create-configmap
      image: registry.access.redhat.com/ubi9/ubi
      workingDir: $(workspaces.source.path)
      env:
        - name: CLUSTER_NAME
          value: "$(params.clusterName)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        WORKSPACE_DIR="$(workspaces.source.path)"
        WORKSPACE_KUBECONFIG="${WORKSPACE_DIR}/kubeconfig"
        OUTPUTS_FILE="${WORKSPACE_DIR}/roks-terraform-outputs.json"
        CONFIGMAP_NAME="cluster-info-roks-${CLUSTER_NAME}"
        LB_WAIT_ATTEMPTS="${LB_WAIT_ATTEMPTS:-20}"
        LB_WAIT_DELAY="${LB_WAIT_DELAY:-30}"

        # ConfigMap calls use the in-cluster ServiceAccount (pipeline cluster)
        unset KUBECONFIG
        TMP_DIR=$(mktemp -d)
        trap 'rm -rf "${TMP_DIR}"' EXIT

        fail() {
          echo "❌ $*" >&2
          exit 1
        }

        echo "✅ Creating endpoint test ConfigMap for ROKS cluster ${CLUSTER_NAME}"
        echo "=============================================="

        [[ "${CLUSTER_NAME}" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || fail "Invalid clusterName '${CLUSTER_NAME}': lowercase letters, digits and hyphens only"
        [[ -s "${WORKSPACE_KUBECONFIG}" ]] || fail "${WORKSPACE_KUBECONFIG} not found or empty; roks-validate-and-get-access writes it"

        # Install tools (jq, oc)
        echo "📦 Installing required packages..."
        dnf install -y jq tar gzip
        echo "📦 Installing OpenShift CLI..."
        curl -fsSL -o "${TMP_DIR}/oc.tar.gz" https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
        tar xzf "${TMP_DIR}/oc.tar.gz" -C "${TMP_DIR}" oc
        mv "${TMP_DIR}/oc" /usr/local/bin/oc
        rm -f "${TMP_DIR}/oc.tar.gz"
        oc version --client
        echo "✅ Tools installed"

        CLUSTER_OC=(oc --kubeconfig "${WORKSPACE_KUBECONFIG}")

        # --- Ingress subdomain: Terraform output, else the default IngressController ---
        INGRESS_DOMAIN=""
        if [[ -f "${OUTPUTS_FILE}" ]]; then
          INGRESS_DOMAIN=$(jq -r '(.ingress_hostname | objects | .value) // empty' "${OUTPUTS_FILE}" 2>/dev/null || true)
        fi
        if [[ -n "${INGRESS_DOMAIN}" ]]; then
          echo "Ingress subdomain (Terraform output ingress_hostname): ${INGRESS_DOMAIN}"
        else
          echo "⚠️  No ingress_hostname in ${OUTPUTS_FILE}; asking the default IngressController"
          INGRESS_DOMAIN=$("${CLUSTER_OC[@]}" get ingresscontroller default -n openshift-ingress-operator -o jsonpath='{.status.domain}' 2>/dev/null || true)
          [[ -n "${INGRESS_DOMAIN}" ]] || fail "Could not determine the ingress subdomain of ${CLUSTER_NAME}"
          echo "Ingress subdomain (IngressController default): ${INGRESS_DOMAIN}"
        fi
        EIC_HOST="eic.${INGRESS_DOMAIN}"

        # --- istio-ingressgateway LoadBalancer address ---
        # Same search as ROSA's task: istio-system, istio-gateways, then any
        # namespace; the IP if there is one, else the hostname.
        find_ingress() {
          "${CLUSTER_OC[@]}" get svc --all-namespaces -o json | jq -r '
            [.items[]
              | select(.metadata.name == "istio-ingressgateway")
              | {ns: .metadata.namespace,
                 addr: (((.status.loadBalancer.ingress // [])[0] // {}) | (.ip // .hostname // ""))}
              | select(.addr != "")]
            | sort_by(if .ns == "istio-system" then 0 elif .ns == "istio-gateways" then 1 else 2 end)
            | first // empty
            | "\(.ns) \(.addr)"'
        }

        echo ""
        echo "📋 Looking for the istio-ingressgateway LoadBalancer address..."
        INGRESS_NS=""
        INGRESS_IP=""
        for ATTEMPT in $(seq 1 "${LB_WAIT_ATTEMPTS}"); do
          FOUND=$(find_ingress 2>/dev/null || true)
          if [[ -n "${FOUND}" ]]; then
            INGRESS_NS="${FOUND%% *}"
            INGRESS_IP="${FOUND#* }"
            break
          fi
          echo "   No istio-ingressgateway LoadBalancer address yet (attempt ${ATTEMPT}/${LB_WAIT_ATTEMPTS})"
          if [[ "${ATTEMPT}" -lt "${LB_WAIT_ATTEMPTS}" ]]; then
            sleep "${LB_WAIT_DELAY}"
          fi
        done
        if [[ -z "${INGRESS_IP}" ]]; then
          echo "Services named like istio on ${CLUSTER_NAME}:"
          "${CLUSTER_OC[@]}" get svc --all-namespaces 2>/dev/null | grep -i istio || echo "   none"
          fail "No LoadBalancer IP or hostname on any istio-ingressgateway Service; make sure EIC is deployed and its load balancer is provisioned"
        fi
        echo "✅ istio-ingressgateway in ${INGRESS_NS}: ${INGRESS_IP}"

        # --- ConfigMap on the pipeline cluster (where the test pods run) ---
        echo ""
        echo "📝 Creating ConfigMap '${CONFIGMAP_NAME}' on the pipeline cluster..."
        oc delete configmap "${CONFIGMAP_NAME}" --ignore-not-found=true
        oc create configmap "${CONFIGMAP_NAME}" \
          --from-literal=host="${EIC_HOST}" \
          --from-literal=ingressIP="${INGRESS_IP}"
        echo "✅ ConfigMap created"

        SUMMARY="ROKS Cluster: ${CLUSTER_NAME} | Host: ${EIC_HOST} | Ingress: ${INGRESS_IP}"
        echo -n "${SUMMARY}" > "$(results.cluster-summary.path)"

        echo ""
        echo "=============================================="
        echo "✅ ROKS ConfigMap creation completed"
        echo "  Cluster:   ${CLUSTER_NAME}"
        echo "  ConfigMap: ${CONFIGMAP_NAME}"
        echo "  EIC host:  ${EIC_HOST}"
        echo "  Ingress:   ${INGRESS_IP} (istio-ingressgateway in ${INGRESS_NS})"
        echo "=============================================="
