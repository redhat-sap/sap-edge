apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ossm3-download-and-apply-rbac
spec:
  description: >-
    Download restricted-access resource zip files from an ODF S3 bucket (via OBC).
    Each subfolder of the prefix holding zips is one component (elm,
    edge-icell-1, edge-icell-2, …; a flat prefix is a single component). The
    latest version of each bundle per component is applied ELM first, then EIC
    cells by name, by running the bundle's own apply-restricted-resources.sh --yes. That SAP
    script creates the namespaces, validates namespace ownership via the
    edgelm.sap.com/edge-node-id labels, and applies its numbered manifests
    (000001-*.yaml …) in order. Only the new SAP bundle format is supported.
  params:
    - name: hostedClusterName
      type: string
      description: "Name of the hosted cluster"
    - name: hostedClusterNamespace
      type: string
      description: "Namespace for HostedCluster resources"
      default: "clusters"
    - name: hubKubeconfigSecretName
      type: string
      description: "Name of the Secret containing kubeconfig for hub cluster (optional, uses in-cluster config if empty)"
      default: ""
    - name: obcName
      type: string
      description: "Name of the ObjectBucketClaim (OBC) — used to look up the S3 credentials Secret and endpoint ConfigMap"
      default: "sap-eic-restricted-cluster-config-resources"
    - name: s3Prefix
      type: string
      description: "S3 key prefix for the restricted-resources zip files (one subfolder per component, e.g. restricted-resources/<deployment>/)"
      default: "restricted-resources/"
    - name: requiredComponents
      type: string
      description: "Space-separated component folders that must each contain a zip under the prefix (e.g. 'elm edge-icell-1 edge-icell-2'). Empty = no check."
      default: ""
    - name: useWorkspaceKubeconfig
      type: string
      description: "Use kubeconfig from workspace instead of HCP extraction (for ARO/ROSA direct cluster access)"
      default: "false"
  workspaces:
    - name: source
  steps:
    - name: download-and-apply-rbac
      image: registry.access.redhat.com/ubi9/ubi
      timeout: "336h"
      workingDir: $(workspaces.source.path)
      env:
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: $(params.obcName)
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.obcName)
              key: AWS_SECRET_ACCESS_KEY
        - name: BUCKET_HOST
          valueFrom:
            configMapKeyRef:
              name: $(params.obcName)
              key: BUCKET_HOST
        - name: BUCKET_PORT
          valueFrom:
            configMapKeyRef:
              name: $(params.obcName)
              key: BUCKET_PORT
        - name: BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: $(params.obcName)
              key: BUCKET_NAME
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        CLUSTER_NAME="$(params.hostedClusterName)"
        CLUSTER_NS="$(params.hostedClusterNamespace)"
        HUB_KUBECONFIG_SECRET="$(params.hubKubeconfigSecretName)"
        S3_PREFIX="$(params.s3Prefix)"
        REQUIRED_COMPONENTS="$(params.requiredComponents)"
        USE_WORKSPACE_KC="$(params.useWorkspaceKubeconfig)"

        echo "=========================================="
        echo "OSSM3 Download & Apply RBAC Task"
        echo "=========================================="
        echo "Cluster: ${CLUSTER_NAME}"
        echo "S3 Bucket: ${BUCKET_NAME}"
        echo "S3 Prefix: ${S3_PREFIX}"
        echo "=========================================="

        # Install required tools
        echo "📦 Installing required packages..."
        dnf install -y unzip > /dev/null 2>&1

        echo "📦 Installing OpenShift CLI..."
        curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz -o /tmp/oc.tar.gz
        tar xzf /tmp/oc.tar.gz -C /tmp
        mv /tmp/oc /usr/local/bin/
        cp /usr/local/bin/oc /usr/local/bin/kubectl
        rm -f /tmp/oc.tar.gz
        oc version --client

        echo "📦 Installing AWS CLI..."
        curl -sL "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o /tmp/awscliv2.zip
        unzip -q /tmp/awscliv2.zip -d /tmp
        /tmp/aws/install --bin-dir /usr/local/bin --install-dir /usr/local/aws-cli
        rm -rf /tmp/awscliv2.zip /tmp/aws
        aws --version

        # ========================================
        # Step 1: Download zip files from S3
        # ========================================
        echo ""
        echo "📥 Downloading restricted-resources from S3..."

        S3_ENDPOINT="https://${BUCKET_HOST}:${BUCKET_PORT}"
        DOWNLOAD_DIR="/tmp/restricted-resources"
        mkdir -p "${DOWNLOAD_DIR}"

        aws s3 cp "s3://${BUCKET_NAME}/${S3_PREFIX}" "${DOWNLOAD_DIR}/" \
          --endpoint-url "${S3_ENDPOINT}" \
          --no-verify-ssl \
          --recursive

        echo "✅ Downloaded files:"
        ls -la "${DOWNLOAD_DIR}/"

        # Every required component folder must hold at least one bundle zip
        # (guards against approving the upload gate with a folder left empty).
        if [[ -n "${REQUIRED_COMPONENTS}" ]]; then
          read -r -a REQUIRED_LIST <<< "${REQUIRED_COMPONENTS}"
          MISSING=()
          for C in "${REQUIRED_LIST[@]}"; do
            compgen -G "${DOWNLOAD_DIR}/${C}/*.zip" > /dev/null || MISSING+=("${C}")
          done
          if [[ ${#MISSING[@]} -gt 0 ]]; then
            echo "❌ No bundle zip in required component folder(s): ${MISSING[*]}"
            echo "   Upload them to s3://${BUCKET_NAME}/${S3_PREFIX%/}/<folder>/ and re-run."
            exit 1
          fi
        fi

        # ========================================
        # Step 2: Discover components, select latest bundle per type, extract
        # ========================================
        # S3 layout (docs/multi-eic-restricted-resources-convention.md):
        #   <s3Prefix>/elm/           restricted-resources-Edge_Lifecycle_Management-<ver>.zip
        #   <s3Prefix>/edge-icell-1/  restricted-resources-Edge_Integration_Cell-<ver>.zip
        #   <s3Prefix>/edge-icell-2/  restricted-resources-Edge_Integration_Cell-<ver>.zip
        # Every directory holding *.zip files is one component; a flat prefix
        # (zips directly under it) is a single component. Within a component only
        # the latest version of each resource type is used.
        #
        # Bundles are extracted into <priority>_<component>_<type> directories so
        # Step 4 applies ELM (00) → IstioGateways (10) → EIC cells (20) → other
        # (90), cells ordered by name. CRDs and the ELM ClusterRole(Binding) are
        # cluster singletons, so ELM must deterministically go first.

        # Print "<type>\t<zip>" for the latest version of each resource type in a
        # component directory. Naming: restricted-resources-<Type>-<version>.zip,
        # e.g. restricted-resources-Edge_Lifecycle_Management-1.62.0-rc.1.zip
        select_latest_bundles() {
          local zip base type version
          for zip in "$1"/*.zip; do
            [[ -f "${zip}" ]] || continue
            base=$(basename "${zip}" .zip)
            type=$(sed -E 's/^(restricted-resources-[A-Za-z_]+)-[0-9].*$/\1/' <<< "${base}")
            version="${base#"${type}"}"
            version="${version#-}"
            printf '%s\t%s\t%s\n' "${type}" "${version:-0}" "${zip}"
          done | sort -t $'\t' -k1,1 -k2,2V \
            | awk -F '\t' 'NR > 1 && $1 != type { print type "\t" zip } { type = $1; zip = $3 } END { if (NR > 0) print type "\t" zip }'
        }

        bundle_priority() {
          case "$1" in
            *Edge_Lifecycle_Management*) echo "00" ;;
            *IstioGateways*) echo "10" ;;
            *Edge_Integration_Cell*) echo "20" ;;
            *) echo "90" ;;
          esac
        }

        echo ""
        echo "📦 Discovering components and selecting latest bundle versions..."

        RBAC_DIR="/tmp/rbac-resources"
        mkdir -p "${RBAC_DIR}"

        COMPONENT_DIRS=()
        while IFS= read -r DIR; do
          COMPONENT_DIRS+=("${DIR}")
        done < <(find "${DOWNLOAD_DIR}" -type f -name '*.zip' -exec dirname {} \; | sort -u)

        if [[ ${#COMPONENT_DIRS[@]} -eq 0 ]]; then
          echo "❌ No *.zip bundles found under s3://${BUCKET_NAME}/${S3_PREFIX}"
          exit 1
        fi

        for COMPONENT_DIR in "${COMPONENT_DIRS[@]}"; do
          if [[ "${COMPONENT_DIR}" == "${DOWNLOAD_DIR}" ]]; then
            COMPONENT="root"
          else
            COMPONENT="${COMPONENT_DIR#"${DOWNLOAD_DIR}"/}"
            COMPONENT="${COMPONENT//\//__}"
          fi
          echo "   Component: ${COMPONENT}"
          while IFS=$'\t' read -r RESOURCE_TYPE ZIP_FILE; do
            EXTRACT_DIR="${RBAC_DIR}/$(bundle_priority "${RESOURCE_TYPE}")_${COMPONENT}_${RESOURCE_TYPE#restricted-resources-}"
            mkdir -p "${EXTRACT_DIR}"
            echo "     $(basename "${ZIP_FILE}") → $(basename "${EXTRACT_DIR}")/"
            unzip -q -o "${ZIP_FILE}" -d "${EXTRACT_DIR}"
          done < <(select_latest_bundles "${COMPONENT_DIR}")
        done

        echo "✅ Extracted files:"
        find "${RBAC_DIR}" \( -name "*.yaml" -o -name "*.yml" \) -type f | sort

        # ========================================
        # Step 3: Connect to target cluster
        # ========================================

        if [[ "${USE_WORKSPACE_KC}" == "true" ]]; then
          # Direct cluster access mode (ARO/ROSA)
          echo "📋 Using kubeconfig from workspace (direct cluster access mode)"
          if [[ ! -f "$(workspaces.source.path)/kubeconfig" ]]; then
            echo "❌ useWorkspaceKubeconfig=true but no kubeconfig found in workspace"
            exit 1
          fi
          export KUBECONFIG="$(workspaces.source.path)/kubeconfig"
          echo "🔍 Verifying access to cluster..."
          oc get nodes
          echo "✅ Successfully connected to cluster"
        else
          # HCP mode: extract kubeconfig from hosted cluster Secret via hub
          # Configure hub cluster kubeconfig if provided
          if [[ -n "${HUB_KUBECONFIG_SECRET}" ]]; then
            echo "🔐 Extracting hub cluster kubeconfig from secret: ${HUB_KUBECONFIG_SECRET}..."
            HUB_KUBECONFIG="/tmp/hub-kubeconfig"
            if kubectl get secret "${HUB_KUBECONFIG_SECRET}" -o jsonpath='{.data.kubeconfig}' 2>/dev/null | base64 -d > "${HUB_KUBECONFIG}" 2>/dev/null && [[ -s "${HUB_KUBECONFIG}" ]]; then
              echo "✅ Kubeconfig extracted (key: kubeconfig)"
            elif kubectl get secret "${HUB_KUBECONFIG_SECRET}" -o jsonpath='{.data.config}' 2>/dev/null | base64 -d > "${HUB_KUBECONFIG}" 2>/dev/null && [[ -s "${HUB_KUBECONFIG}" ]]; then
              echo "✅ Kubeconfig extracted (key: config)"
            elif kubectl get secret "${HUB_KUBECONFIG_SECRET}" -o jsonpath='{.data.value}' 2>/dev/null | base64 -d > "${HUB_KUBECONFIG}" 2>/dev/null && [[ -s "${HUB_KUBECONFIG}" ]]; then
              echo "✅ Kubeconfig extracted (key: value)"
            else
              echo "❌ Failed to extract kubeconfig from secret '${HUB_KUBECONFIG_SECRET}'"
              exit 1
            fi
            chmod 600 "${HUB_KUBECONFIG}"
            export KUBECONFIG="${HUB_KUBECONFIG}"
            echo "✅ Using hub kubeconfig for cluster operations"
            oc whoami
          else
            echo "ℹ️  No hub kubeconfig secret provided, using in-cluster service account"
          fi

          # Extract kubeconfig for hosted cluster
          echo "🔐 Extracting kubeconfig for hosted cluster..."
          KUBECONFIG_SECRET="${CLUSTER_NAME}-admin-kubeconfig"

          if ! oc get secret "${KUBECONFIG_SECRET}" -n "${CLUSTER_NS}" > /dev/null 2>&1; then
            echo "❌ Kubeconfig secret '${KUBECONFIG_SECRET}' not found in namespace '${CLUSTER_NS}'"
            exit 1
          fi

          HOSTED_KUBECONFIG="/tmp/hosted-kubeconfig"
          oc get secret "${KUBECONFIG_SECRET}" -n "${CLUSTER_NS}" \
            -o jsonpath='{.data.kubeconfig}' | base64 -d > "${HOSTED_KUBECONFIG}"
          chmod 600 "${HOSTED_KUBECONFIG}"

          export KUBECONFIG="${HOSTED_KUBECONFIG}"
          [[ -f "$(workspaces.source.path)/.kubeconfig-rewrite.sh" ]] && source "$(workspaces.source.path)/.kubeconfig-rewrite.sh" "${HOSTED_KUBECONFIG}"

          echo "🔍 Verifying access to hosted cluster..."
          oc get nodes
          echo "✅ Successfully connected to hosted cluster"
        fi

        # ========================================
        # Step 4: Apply each bundle via SAP's apply-restricted-resources.sh
        # ========================================
        # Every new-format SAP bundle ships an apply-restricted-resources.sh that
        # creates the namespaces, validates namespace ownership (via the
        # edgelm.sap.com/edge-node-id labels), and applies its numbered manifests
        # (000001-*.yaml …) in the correct order. We run it non-interactively
        # (--yes) against the target cluster. Only the new bundle format is
        # supported: a bundle without the script is a hard error.

        echo ""
        echo "📦 Applying restricted-resources bundles via SAP apply script..."
        echo ""

        # Iterate the extracted bundle directories in priority order (see Step 2);
        # version sort keeps edge-icell-2 ahead of edge-icell-10.
        BUNDLE_COUNT=0
        while IFS= read -r EXTRACT_DIR; do
          BUNDLE="$(basename "${EXTRACT_DIR}")"

          # Locate the apply script (a zip may nest its manifests in a subfolder).
          APPLY_SCRIPT=""
          while IFS= read -r CANDIDATE; do
            APPLY_SCRIPT="${CANDIDATE}"
            break
          done < <(find "${EXTRACT_DIR}" -type f -name 'apply-restricted-resources.sh' | sort)

          if [[ -z "${APPLY_SCRIPT}" ]]; then
            echo "❌ Bundle '${BUNDLE}' has no apply-restricted-resources.sh"
            echo "   Only new-format SAP bundles are supported. Aborting."
            exit 1
          fi

          echo "📦 Applying bundle: ${BUNDLE}"
          echo "   Using: ${APPLY_SCRIPT}"
          # KUBECONFIG is already exported above; the script resolves its own
          # manifest paths relative to itself, so the working directory does not
          # matter. A conflict or apply failure exits non-zero and fails the task.
          bash "${APPLY_SCRIPT}" --yes
          echo "✅ ${BUNDLE} applied"
          echo ""
          BUNDLE_COUNT=$((BUNDLE_COUNT + 1))
        done < <(find "${RBAC_DIR}" -mindepth 1 -maxdepth 1 -type d | sort -V)

        if [[ "${BUNDLE_COUNT}" -eq 0 ]]; then
          echo "❌ No extracted bundles found under ${RBAC_DIR}"
          exit 1
        fi

        echo ""
        echo "=========================================="
        echo "✅ Applied ${BUNDLE_COUNT} restricted-resources bundle(s) successfully"
        echo "=========================================="
