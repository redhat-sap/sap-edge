apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: hcp-get-all-accesses
spec:
  description: >-
    Retrieves and displays all PostgreSQL and Redis/Valkey credentials from the hosted
    cluster after deployment. Also displays the content of generated certificate files
    and stores everything, with the hosted cluster's ingress domain (key ingress-domain),
    in the Secret eic-credentials-hcp-<cluster> on the pipeline cluster
    (eic-credentials-hcp-<cluster>-<instance> when instance is set, so per-cell
    runs in parallel never overwrite each other's Secret or certificate files).
    When instance is set (eic-N), it also prints the values of the ELM "Deploy Solution"
    form for that cell, tab by tab (namespaces with the -N suffix, virtual host, external
    PostgreSQL and Redis/Valkey, Istio gateways).
  params:
    - name: hostedClusterName
      type: string
      description: "Name of the hosted cluster"
    - name: hostedClusterNamespace
      type: string
      description: "Namespace for HostedCluster resources"
      default: "clusters"
    - name: datastoreType
      type: string
      description: "Datastore type: redis, valkey-standalone, or valkey-cluster"
      default: "redis"
    - name: hubKubeconfigSecretName
      type: string
      description: "Name of the Secret containing kubeconfig for hub cluster (optional)"
      default: ""
    - name: instance
      type: string
      description: "Optional EIC instance suffix for the Redis/Valkey namespace (Postgres remains shared). Also suffixes the credentials Secret (eic-credentials-hcp-<cluster>-<instance>) and the certificate files written to the workspace (e.g. external_redis_tls_certificate_<instance>.pem)."
      default: ""
    - name: elmKubeconfigFile
      type: string
      description: "Workspace file stored under the credentials Secret's kubeconfig key (the restricted ELM kubeconfig of the Edge Node hosting this EIC, written by ossm3-generate-sa-based-kubeconfig as <elmNamespace>-kubeconfig). The key is omitted, with a log line, when the file does not exist."
      default: "edgelm-kubeconfig"
    - name: deploymentNamePrefix
      type: string
      description: "Prefix of the ELM deployment names in the ELM deploy form printed when instance is set (<prefix>-<instance>, <prefix>-<instance>-services, <prefix>-<instance>-gateways). Empty: the hosted cluster name."
      default: ""
  workspaces:
    - name: source
  results:
    - name: postgres-host
      description: "PostgreSQL host"
    - name: postgres-port
      description: "PostgreSQL port"
    - name: redis-host
      description: "Redis host"
    - name: redis-port
      description: "Redis port"
  steps:
    - name: get-all-accesses
      image: registry.access.redhat.com/ubi9/ubi
      workingDir: $(workspaces.source.path)
      timeout: "336h"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Parameters
        HOSTED_CLUSTER_NAME="$(params.hostedClusterName)"
        HOSTED_CLUSTER_NAMESPACE="$(params.hostedClusterNamespace)"
        DATASTORE_TYPE="$(params.datastoreType)"
        HUB_KUBECONFIG_SECRET="$(params.hubKubeconfigSecretName)"
        INSTANCE="$(params.instance)"
        ELM_KUBECONFIG_FILE="$(params.elmKubeconfigFile)"
        DEPLOYMENT_NAME_PREFIX="$(params.deploymentNamePrefix)"

        echo "=============================================="
        echo "📋 Retrieving All Access Credentials"
        echo "=============================================="
        echo ""

        # Compute instance suffix for datastore namespaces (Postgres is always shared)
        if [[ -n "${INSTANCE}" ]]; then
          INSTANCE_SUFFIX="-${INSTANCE}"
        else
          INSTANCE_SUFFIX=""
        fi

        # Per-cell runs of this task execute in parallel on one shared workspace
        # and pipeline namespace: with an instance, the credentials Secret and
        # every file written to the workspace are instance-specific.
        CREDS_SECRET_NAME="eic-credentials-hcp-${HOSTED_CLUSTER_NAME}${INSTANCE_SUFFIX}"
        if [[ -n "${INSTANCE}" ]]; then
          PG_CERT_FILE="external_postgres_db_tls_root_cert_${INSTANCE}.crt"
          REDIS_CERT_FILE="external_redis_tls_certificate_${INSTANCE}.pem"
          VALKEY_CERT_FILE="external_valkey_tls_certificate_${INSTANCE}.pem"
        else
          PG_CERT_FILE="external_postgres_db_tls_root_cert.crt"
          REDIS_CERT_FILE="external_redis_tls_certificate.pem"
          VALKEY_CERT_FILE="external_valkey_tls_certificate.pem"
        fi

        # Install required packages
        echo "📦 Installing required packages..."
        dnf install -y jq wget &>/dev/null

        # Install OpenShift CLI
        echo "📦 Installing OpenShift CLI..."
        curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz -o /tmp/oc.tar.gz
        tar xzf /tmp/oc.tar.gz -C /tmp
        mv /tmp/oc /usr/local/bin/
        cp /usr/local/bin/oc /usr/local/bin/kubectl
        rm -f /tmp/oc.tar.gz
        oc version --client

        # Configure hub cluster kubeconfig if provided
        if [[ -n "${HUB_KUBECONFIG_SECRET}" ]]; then
          echo "🔐 Extracting hub cluster kubeconfig from secret: ${HUB_KUBECONFIG_SECRET}..."
          HUB_KUBECONFIG="/tmp/hub-kubeconfig"
          # Try different common key names for kubeconfig in secrets
          if kubectl get secret "${HUB_KUBECONFIG_SECRET}" -o jsonpath='{.data.kubeconfig}' 2>/dev/null | base64 -d > "${HUB_KUBECONFIG}" 2>/dev/null && [[ -s "${HUB_KUBECONFIG}" ]]; then
            echo "✅ Kubeconfig extracted (key: kubeconfig)"
          elif kubectl get secret "${HUB_KUBECONFIG_SECRET}" -o jsonpath='{.data.config}' 2>/dev/null | base64 -d > "${HUB_KUBECONFIG}" 2>/dev/null && [[ -s "${HUB_KUBECONFIG}" ]]; then
            echo "✅ Kubeconfig extracted (key: config)"
          elif kubectl get secret "${HUB_KUBECONFIG_SECRET}" -o jsonpath='{.data.value}' 2>/dev/null | base64 -d > "${HUB_KUBECONFIG}" 2>/dev/null && [[ -s "${HUB_KUBECONFIG}" ]]; then
            echo "✅ Kubeconfig extracted (key: value)"
          else
            echo "❌ Failed to extract kubeconfig from secret '${HUB_KUBECONFIG_SECRET}'"
            echo "   Secret should have kubeconfig data under key 'kubeconfig', 'config', or 'value'"
            exit 1
          fi
          chmod 600 "${HUB_KUBECONFIG}"
          export KUBECONFIG="${HUB_KUBECONFIG}"
          echo "✅ Using hub kubeconfig for cluster operations"
          oc whoami
        else
          echo "ℹ️  No hub kubeconfig secret provided, using in-cluster service account"
        fi

        # Extract kubeconfig for hosted cluster
        echo "🔐 Extracting kubeconfig for hosted cluster..."
        KUBECONFIG_SECRET="${HOSTED_CLUSTER_NAME}-admin-kubeconfig"

        if ! oc get secret "${KUBECONFIG_SECRET}" -n "${HOSTED_CLUSTER_NAMESPACE}" > /dev/null 2>&1; then
          echo "❌ Kubeconfig secret '${KUBECONFIG_SECRET}' not found in namespace '${HOSTED_CLUSTER_NAMESPACE}'"
          exit 1
        fi

        HOSTED_KUBECONFIG="/tmp/hosted-kubeconfig"
        oc get secret "${KUBECONFIG_SECRET}" -n "${HOSTED_CLUSTER_NAMESPACE}" \
          -o jsonpath='{.data.kubeconfig}' | base64 -d > "${HOSTED_KUBECONFIG}"
        chmod 600 "${HOSTED_KUBECONFIG}"

        # Set KUBECONFIG to hosted cluster
        export KUBECONFIG="${HOSTED_KUBECONFIG}"
        [[ -f "$(workspaces.source.path)/.kubeconfig-rewrite.sh" ]] && source "$(workspaces.source.path)/.kubeconfig-rewrite.sh" "${HOSTED_KUBECONFIG}"

        echo "🔍 Verifying access to hosted cluster..."
        oc get nodes
        echo "✅ Successfully connected to hosted cluster"

        # Ingress domain of the hosted cluster, stored in the credentials Secret
        # (key ingress-domain): the SAP browser builds the EIC virtual host from it
        INGRESS_DOMAIN=$(oc get ingresses.config.openshift.io cluster -o jsonpath='{.spec.domain}' 2>/dev/null || true)
        if [[ -z "${INGRESS_DOMAIN}" ]]; then
          echo "❌ Could not read the ingress domain of hosted cluster ${HOSTED_CLUSTER_NAME} (ingresses.config.openshift.io cluster, .spec.domain)"
          echo "   The credentials Secret needs it (key ingress-domain) for the EIC virtual host"
          exit 1
        fi
        echo "Ingress domain: ${INGRESS_DOMAIN}"
        echo ""

        # ================== PostgreSQL ==================
          echo "=====================================Postgres========================================="

          PG_NAMESPACE="sap-eic-external-postgres"
          PG_SECRET="edgedb-pguser-edgedb"

          if oc get secret "${PG_SECRET}" -n "${PG_NAMESPACE}" &>/dev/null; then
            PG_HOST=$(oc get secret "${PG_SECRET}" -n "${PG_NAMESPACE}" -o jsonpath="{.data.host}" | base64 --decode)
            PG_PORT=$(oc get secret "${PG_SECRET}" -n "${PG_NAMESPACE}" -o jsonpath="{.data.port}" | base64 --decode)
            PG_DBNAME=$(oc get secret "${PG_SECRET}" -n "${PG_NAMESPACE}" -o jsonpath="{.data.dbname}" | base64 --decode)
            PG_USER=$(oc get secret "${PG_SECRET}" -n "${PG_NAMESPACE}" -o jsonpath="{.data.user}" | base64 --decode)
            PG_PASSWORD=$(oc get secret "${PG_SECRET}" -n "${PG_NAMESPACE}" -o jsonpath="{.data.password}" | base64 --decode)

            echo "External DB Hostname: ${PG_HOST}"
            echo "External DB Port: ${PG_PORT}"
            echo "External DB Name: ${PG_DBNAME}"
            echo "External DB Username: ${PG_USER}"
            echo "External DB Password: ${PG_PASSWORD}"

            # Save results
            echo -n "${PG_HOST}" > $(results.postgres-host.path)
            echo -n "${PG_PORT}" > $(results.postgres-port.path)

            # Get TLS certificate
            PGO_SECRET="pgo-root-cacert"
            if oc get secret "${PGO_SECRET}" -n "${PG_NAMESPACE}" &>/dev/null; then
              ROOT_CRT=$(oc get secret "${PGO_SECRET}" -n "${PG_NAMESPACE}" -o json | jq -r '.data["root.crt"]' | base64 -d)
              if [[ -n "${ROOT_CRT}" ]]; then
                echo "${ROOT_CRT}" > "${PG_CERT_FILE}"
                echo "External DB TLS Root Certificate saved to ${PG_CERT_FILE}"
                echo ""
                echo "📜 PostgreSQL TLS Root Certificate content:"
                echo "----------------------------------------------"
                cat "${PG_CERT_FILE}"
                echo "----------------------------------------------"
              fi
            fi
          else
            echo "⚠️ PostgreSQL secret not found in ${PG_NAMESPACE}"
            echo -n "N/A" > $(results.postgres-host.path)
            echo -n "N/A" > $(results.postgres-port.path)
          fi

          echo ""

          # ================== Datastore (Redis/Valkey) ==================
          if [[ "${DATASTORE_TYPE}" == "redis" ]]; then
            echo "======================================Redis==========================================="

            REDIS_NAMESPACE="sap-eic-external-redis${INSTANCE_SUFFIX}"
            REDIS_DB="redb"

            if oc get RedisEnterpriseDatabase "${REDIS_DB}" -n "${REDIS_NAMESPACE}" &>/dev/null; then
              REDIS_SECRET=$(oc get RedisEnterpriseDatabase "${REDIS_DB}" -n "${REDIS_NAMESPACE}" -o json | jq -r '.spec.databaseSecretName')

              if [[ -n "${REDIS_SECRET}" ]] && [[ "${REDIS_SECRET}" != "null" ]]; then
                SECRET_DATA=$(oc get secret "${REDIS_SECRET}" -n "${REDIS_NAMESPACE}" -o json)
                REDIS_PASSWORD=$(echo "${SECRET_DATA}" | jq -r '.data["password"]' | base64 --decode)
                REDIS_PORT=$(echo "${SECRET_DATA}" | jq -r '.data["port"]' | base64 --decode)
                REDIS_SERVICE=$(echo "${SECRET_DATA}" | jq -r '.data["service_name"]' | base64 --decode)

                REDIS_SERVICE_FQDN="${REDIS_SERVICE}.${REDIS_NAMESPACE}.svc"
                REDIS_SERVER_NAME="rec.${REDIS_NAMESPACE}.svc.cluster.local"

                echo "External Redis Addresses: ${REDIS_SERVICE_FQDN}:${REDIS_PORT}"
                echo "External Redis Mode: standalone"
                echo "External Redis Username: [leave me blank]"
                echo "External Redis Password: ${REDIS_PASSWORD}"
                echo "External Redis Sentinel Username: [leave me blank]"
                echo "External Redis Sentinel Password: [leave me blank]"
                echo "External Redis Server Name: ${REDIS_SERVER_NAME}"

                # Save results
                echo -n "${REDIS_SERVICE_FQDN}" > $(results.redis-host.path)
                echo -n "${REDIS_PORT}" > $(results.redis-port.path)

                # Get TLS certificate from Redis pod
                echo ""
                echo "🔐 Extracting Redis TLS certificate..."
                if oc get pod rec-0 -n "${REDIS_NAMESPACE}" &>/dev/null; then
                  oc exec -n "${REDIS_NAMESPACE}" rec-0 -c redis-enterprise-node -- \
                    cat /etc/opt/redislabs/proxy_cert.pem > "${REDIS_CERT_FILE}" 2>/dev/null || true

                  if [[ -f "${REDIS_CERT_FILE}" ]] && [[ -s "${REDIS_CERT_FILE}" ]]; then
                    echo "External Redis TLS Certificate saved to ${REDIS_CERT_FILE}"
                    echo ""
                    echo "📜 Redis TLS Certificate content:"
                    echo "----------------------------------------------"
                    cat "${REDIS_CERT_FILE}"
                    echo "----------------------------------------------"
                  fi
                else
                  echo "⚠️ Redis pod rec-0 not found, skipping TLS certificate extraction"
                fi
              else
                echo "⚠️ Redis database secret not found"
                echo -n "N/A" > $(results.redis-host.path)
                echo -n "N/A" > $(results.redis-port.path)
              fi
            else
              echo "⚠️ RedisEnterpriseDatabase not found in ${REDIS_NAMESPACE}"
              echo -n "N/A" > $(results.redis-host.path)
              echo -n "N/A" > $(results.redis-port.path)
            fi

          elif [[ "${DATASTORE_TYPE}" == "valkey-standalone" ]] || [[ "${DATASTORE_TYPE}" == "valkey-cluster" ]]; then
            echo "======================================Valkey==========================================="

            if [[ "${DATASTORE_TYPE}" == "valkey-standalone" ]]; then
              VALKEY_NAMESPACE="sap-eic-external-valkey${INSTANCE_SUFFIX}"
              VALKEY_MODE="standalone"
            else
              VALKEY_NAMESPACE="sap-eic-external-valkey-cluster${INSTANCE_SUFFIX}"
              VALKEY_MODE="cluster"
            fi

            if oc get secret valkey -n "${VALKEY_NAMESPACE}" &>/dev/null; then
              VALKEY_PASSWORD=$(oc get secret valkey -n "${VALKEY_NAMESPACE}" -o jsonpath='{.data.database-password}' | base64 --decode)
              VALKEY_PORT="6380"

              if [[ "${VALKEY_MODE}" == "standalone" ]]; then
                VALKEY_HOST="valkey.${VALKEY_NAMESPACE}.svc"
                VALKEY_SERVER_NAME="valkey.${VALKEY_NAMESPACE}.svc.cluster.local"
                echo "External Valkey Addresses: ${VALKEY_HOST}:${VALKEY_PORT}"
              else
                # Cluster mode: build comma-separated list of all node addresses
                REPLICA_COUNT=$(oc get pods -l name=valkey -n "${VALKEY_NAMESPACE}" --no-headers 2>/dev/null | wc -l | tr -d ' ')
                if [[ "${REPLICA_COUNT}" -eq 0 ]]; then
                  REPLICA_COUNT=3
                fi
                VALKEY_NODES=""
                for i in $(seq 0 $((REPLICA_COUNT - 1))); do
                  if [[ -n "${VALKEY_NODES}" ]]; then
                    VALKEY_NODES="${VALKEY_NODES},"
                  fi
                  VALKEY_NODES="${VALKEY_NODES}valkey-${i}.valkey-headless.${VALKEY_NAMESPACE}.svc.cluster.local:${VALKEY_PORT}"
                done
                VALKEY_HOST="${VALKEY_NODES}"
                VALKEY_SERVER_NAME="valkey-headless.${VALKEY_NAMESPACE}.svc.cluster.local"
                echo "External Valkey Addresses: ${VALKEY_HOST}"
              fi

              echo "External Valkey Mode: ${VALKEY_MODE}"
              echo "External Valkey Username: [leave me blank]"
              echo "External Valkey Password: ${VALKEY_PASSWORD}"
              echo "External Valkey Sentinel Username: [leave me blank]"
              echo "External Valkey Sentinel Password: [leave me blank]"
              echo "External Valkey Server Name: ${VALKEY_SERVER_NAME}"

              # Save results (use redis-host/redis-port results for compatibility)
              echo -n "${VALKEY_HOST}" > $(results.redis-host.path)
              echo -n "${VALKEY_PORT}" > $(results.redis-port.path)

              # Get TLS certificate from ConfigMap
              echo ""
              echo "🔐 Extracting Valkey TLS certificate..."
              if oc get configmap valkey-service-ca -n "${VALKEY_NAMESPACE}" &>/dev/null; then
                oc get configmap valkey-service-ca -n "${VALKEY_NAMESPACE}" \
                  -o jsonpath='{.data.service-ca\.crt}' > "${VALKEY_CERT_FILE}" 2>/dev/null || true

                if [[ -f "${VALKEY_CERT_FILE}" ]] && [[ -s "${VALKEY_CERT_FILE}" ]]; then
                  echo "External Valkey TLS Certificate saved to ${VALKEY_CERT_FILE}"
                  echo ""
                  echo "📜 Valkey TLS Certificate content:"
                  echo "----------------------------------------------"
                  cat "${VALKEY_CERT_FILE}"
                  echo "----------------------------------------------"
                fi
              else
                echo "⚠️ Valkey service-ca ConfigMap not found, skipping TLS certificate extraction"
              fi
            else
              echo "⚠️ Valkey secret not found in ${VALKEY_NAMESPACE}"
              echo -n "N/A" > $(results.redis-host.path)
              echo -n "N/A" > $(results.redis-port.path)
            fi
          fi

        # ================== Store credentials in Secret ==================
        echo ""
        echo "📦 Storing credentials in Secret '${CREDS_SECRET_NAME}' on management cluster..."

        # Switch to management cluster (pipeline cluster, not the remote hub)
        # Use empty KUBECONFIG to fall back to in-cluster service account
        MGMT_KUBECONFIG=""

        # Build secret arguments
        SECRET_ARGS=()
        SECRET_ARGS+=(--from-literal=postgres-host="${PG_HOST:-N/A}")
        SECRET_ARGS+=(--from-literal=postgres-port="${PG_PORT:-N/A}")
        SECRET_ARGS+=(--from-literal=postgres-dbname="${PG_DBNAME:-N/A}")
        SECRET_ARGS+=(--from-literal=postgres-user="${PG_USER:-N/A}")
        SECRET_ARGS+=(--from-literal=postgres-password="${PG_PASSWORD:-N/A}")
        SECRET_ARGS+=(--from-literal=ingress-domain="${INGRESS_DOMAIN}")

        if [[ -f "${PG_CERT_FILE}" ]]; then
          SECRET_ARGS+=(--from-file=postgres-tls-root-cert="${PG_CERT_FILE}")
        fi

        if [[ "${DATASTORE_TYPE}" == "redis" ]]; then
          SECRET_ARGS+=(--from-literal=redis-address="${REDIS_SERVICE_FQDN:-N/A}:${REDIS_PORT:-N/A}")
          SECRET_ARGS+=(--from-literal=redis-password="${REDIS_PASSWORD:-N/A}")
          SECRET_ARGS+=(--from-literal=redis-server-name="${REDIS_SERVER_NAME:-N/A}")
          if [[ -f "${REDIS_CERT_FILE}" ]]; then
            SECRET_ARGS+=(--from-file=redis-tls-cert="${REDIS_CERT_FILE}")
          fi
        elif [[ "${DATASTORE_TYPE}" == "valkey-standalone" ]] || [[ "${DATASTORE_TYPE}" == "valkey-cluster" ]]; then
          SECRET_ARGS+=(--from-literal=valkey-address="${VALKEY_HOST:-N/A}")
          SECRET_ARGS+=(--from-literal=valkey-password="${VALKEY_PASSWORD:-N/A}")
          SECRET_ARGS+=(--from-literal=valkey-mode="${VALKEY_MODE:-N/A}")
          SECRET_ARGS+=(--from-literal=valkey-server-name="${VALKEY_SERVER_NAME:-N/A}")
          if [[ -f "${VALKEY_CERT_FILE}" ]]; then
            SECRET_ARGS+=(--from-file=valkey-tls-cert="${VALKEY_CERT_FILE}")
          fi
        fi

        # Restricted ELM kubeconfig of the Edge Node hosting this EIC: one shared
        # edgelm-kubeconfig in topology A (both cells), edgelm-N-kubeconfig per
        # Edge Node in topology B (passed in elmKubeconfigFile).
        HAS_KUBECONFIG_KEY="false"
        if [[ -n "${ELM_KUBECONFIG_FILE}" ]] && [[ -f "${ELM_KUBECONFIG_FILE}" ]]; then
          SECRET_ARGS+=(--from-file=kubeconfig="${ELM_KUBECONFIG_FILE}")
          HAS_KUBECONFIG_KEY="true"
          echo "   kubeconfig key: restricted ELM kubeconfig from workspace file ${ELM_KUBECONFIG_FILE}"
        else
          echo "   ℹ️  No workspace file '${ELM_KUBECONFIG_FILE}': Secret '${CREDS_SECRET_NAME}' gets no kubeconfig key"
        fi

        KUBECONFIG="${MGMT_KUBECONFIG}" oc delete secret "${CREDS_SECRET_NAME}" --ignore-not-found=true
        KUBECONFIG="${MGMT_KUBECONFIG}" oc create secret generic "${CREDS_SECRET_NAME}" "${SECRET_ARGS[@]}"
        echo "✅ Secret '${CREDS_SECRET_NAME}' created on management cluster"

        echo ""
        echo "📋 To retrieve credentials${INSTANCE:+ of EIC instance ${INSTANCE}} (Secret ${CREDS_SECRET_NAME}):"
        echo "   oc get secret ${CREDS_SECRET_NAME} -o jsonpath='{.data.postgres-password}' | base64 -d"
        if [[ "${DATASTORE_TYPE}" == "redis" ]]; then
          echo "   oc get secret ${CREDS_SECRET_NAME} -o jsonpath='{.data.redis-password}' | base64 -d"
        else
          echo "   oc get secret ${CREDS_SECRET_NAME} -o jsonpath='{.data.valkey-password}' | base64 -d"
        fi
        if [[ "${HAS_KUBECONFIG_KEY}" == "true" ]]; then
          echo "   oc get secret ${CREDS_SECRET_NAME} -o jsonpath='{.data.kubeconfig}' | base64 -d > kubeconfig.yaml"
        fi
        echo "   oc get secret ${CREDS_SECRET_NAME} -o jsonpath='{.data.postgres-tls-root-cert}' | base64 -d > postgres-tls-root-cert.crt"

        # Switch back to hosted cluster
        export KUBECONFIG="${HOSTED_KUBECONFIG}"
        [[ -f "$(workspaces.source.path)/.kubeconfig-rewrite.sh" ]] && source "$(workspaces.source.path)/.kubeconfig-rewrite.sh" "${HOSTED_KUBECONFIG}"

        # ================== ELM deploy form (per EIC cell) ==================
        # Copy-paste values for ELM "Deploy Solution" of cell N, in the order of
        # the wizard tabs. Cell N names every EIC namespace with the -N suffix
        # (see .tekton/README.md, "Multi-EIC restricted resources").
        if [[ -n "${INSTANCE}" ]]; then
          if [[ "${INSTANCE}" =~ -([0-9]+)$ ]]; then
            NS_SUFFIX="-${BASH_REMATCH[1]}"
          else
            NS_SUFFIX="-${INSTANCE}"
          fi
          NAME_PREFIX="${DEPLOYMENT_NAME_PREFIX:-${HOSTED_CLUSTER_NAME}}"

          echo ""
          echo "=============================================="
          echo "📝 ELM deploy form: ${INSTANCE}"
          echo "=============================================="
          echo "Edge Node: deploy on the Edge Node registered with the restricted kubeconfig"
          echo "  in Secret ${CREDS_SECRET_NAME}, key kubeconfig (\"Restricted Access\" checked)"
          echo ""
          echo "--- Solution Information ---"
          echo "Solution:                        Edge Integration Cell"
          echo "Deployment Name:                 ${NAME_PREFIX}-${INSTANCE}"
          echo "Edge Integration Cell namespace: edge-icell${NS_SUFFIX}"
          echo "Edge Security Artifact Secrets:  edge-icell-secrets${NS_SUFFIX}"
          echo "Edge Local Authorization:        edge-icell-ela${NS_SUFFIX}"
          echo "Default Virtual Host:            ${INSTANCE}.${INGRESS_DOMAIN}"
          echo "Default Virtual Host Key Alias:  slv-ic"
          echo "Checkboxes:                      all unchecked; SAP Monitoring Integration: None"
          echo ""
          echo "--- Edge Integration Cell Services ---"
          echo "Deployment Name:                 ${NAME_PREFIX}-${INSTANCE}-services"
          echo "Namespace:                       edge-icell-services${NS_SUFFIX}"
          echo "Database Type:                   External"
          echo "  External DB Hostname:          ${PG_HOST:-N/A}"
          echo "  External DB Port:              ${PG_PORT:-N/A}"
          echo "  External DB Name:              ${PG_DBNAME:-N/A}"
          echo "  External DB Username:          ${PG_USER:-N/A}"
          echo "  External DB Password:          ${PG_PASSWORD:-N/A}"
          echo "  External DB TLS Root Cert:     printed above (Secret key postgres-tls-root-cert)"
          echo "Datastore Type:                  External"
          if [[ "${DATASTORE_TYPE}" == "redis" ]]; then
            echo "  External Redis Addresses:      ${REDIS_SERVICE_FQDN:-N/A}:${REDIS_PORT:-N/A}"
            echo "  External Redis Mode:           standalone"
            echo "  External Redis Username:       [leave blank]"
            echo "  External Redis Password:       ${REDIS_PASSWORD:-N/A}"
            echo "  Sentinel Username/Password:    [leave blank]"
            echo "  External Redis Server Name:    ${REDIS_SERVER_NAME:-N/A}"
            echo "  External Redis TLS Cert:       printed above (Secret key redis-tls-cert)"
          else
            if [[ "${VALKEY_MODE:-}" == "standalone" ]]; then
              VALKEY_ADDRESSES="${VALKEY_HOST:-N/A}:${VALKEY_PORT:-N/A}"
            else
              VALKEY_ADDRESSES="${VALKEY_HOST:-N/A}"
            fi
            echo "  External Redis Addresses:      ${VALKEY_ADDRESSES}"
            echo "  External Redis Mode:           ${VALKEY_MODE:-N/A}"
            echo "  External Redis Username:       [leave blank]"
            echo "  External Redis Password:       ${VALKEY_PASSWORD:-N/A}"
            echo "  Sentinel Username/Password:    [leave blank]"
            echo "  External Redis Server Name:    ${VALKEY_SERVER_NAME:-N/A}"
