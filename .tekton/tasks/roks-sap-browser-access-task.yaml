apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: roks-sap-browser-access
spec:
  description: >-
    Grants the browser runner ServiceAccount get access to the current run's
    three Secrets (eic-credentials-roks-<clusterName>,
    eic-registry-roks-<clusterName>, edgelm-kubeconfig-generated-<clusterName>)
    on the pipeline cluster via a per-run Role and RoleBinding named
    roks-sap-browser-<clusterName>. Also reads the Edge Node ID label
    (edgelm.sap.com/edge-node-id) from the edgelm namespace on the ROKS cluster
    and returns it as a result (empty string if the namespace or label is
    absent).
  params:
    - name: clusterName
      type: string
      description: "ROKS cluster name"
    - name: runnerServiceAccount
      type: string
      description: "ServiceAccount for the browser task"
      default: "roks-sap-browser-runner"
  workspaces:
    - name: source
      description: "Workspace with kubeconfig (token kubeconfig from roks-validate-and-get-access)"
  results:
    - name: clusterEdgeNodeId
      description: "Edge Node ID label from the edgelm namespace on the ROKS cluster (empty if absent)"
  steps:
    - name: grant-access-and-read-edge-node-id
      image: registry.access.redhat.com/ubi9/ubi
      workingDir: $(workspaces.source.path)
      env:
        - name: CLUSTER_NAME
          value: "$(params.clusterName)"
        - name: RUNNER_SERVICE_ACCOUNT
          value: "$(params.runnerServiceAccount)"
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        WORKSPACE_DIR="$(workspaces.source.path)"
        WORKSPACE_KUBECONFIG="${WORKSPACE_DIR}/kubeconfig"
        ROLE_NAME="roks-sap-browser-${CLUSTER_NAME}"

        # Pipeline cluster calls use the in-cluster ServiceAccount
        unset KUBECONFIG
        TMP_DIR=$(mktemp -d)
        trap 'rm -rf "${TMP_DIR}"' EXIT

        fail() {
          echo "❌ $*" >&2
          exit 1
        }

        echo "✅ Granting browser access for ROKS cluster ${CLUSTER_NAME}"
        echo "=============================================="

        [[ "${CLUSTER_NAME}" =~ ^[a-z0-9]([a-z0-9-]*[a-z0-9])?$ ]] || fail "Invalid clusterName '${CLUSTER_NAME}': lowercase letters, digits and hyphens only"
        [[ -s "${WORKSPACE_KUBECONFIG}" ]] || fail "${WORKSPACE_KUBECONFIG} not found or empty; roks-validate-and-get-access writes it"

        # Install tools (jq, oc)
        echo "📦 Installing required packages..."
        dnf install -y jq tar gzip
        echo "📦 Installing OpenShift CLI..."
        curl -fsSL -o "${TMP_DIR}/oc.tar.gz" https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz
        tar xzf "${TMP_DIR}/oc.tar.gz" -C "${TMP_DIR}" oc
        mv "${TMP_DIR}/oc" /usr/local/bin/oc
        rm -f "${TMP_DIR}/oc.tar.gz"
        oc version --client
        echo "✅ Tools installed"

        CLUSTER_OC=(oc --kubeconfig "${WORKSPACE_KUBECONFIG}")

        # --- Grant access to this run's Secrets via a per-run Role + RoleBinding ---
        echo ""
        echo "📝 Creating Role and RoleBinding '${ROLE_NAME}' on the pipeline cluster..."

        RBAC_ERROR=""
        set +e
        oc apply -f - <<EOF 2>"${TMP_DIR}/rbac-error.log"
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: ${ROLE_NAME}
        rules:
          - apiGroups: [""]
            resources: [secrets]
            verbs: [get]
            resourceNames:
              - eic-credentials-roks-${CLUSTER_NAME}
              - eic-registry-roks-${CLUSTER_NAME}
              - edgelm-kubeconfig-generated-${CLUSTER_NAME}
        EOF
        ROLE_RC=$?
        set -e
        if [[ "${ROLE_RC}" -ne 0 ]]; then
          RBAC_ERROR="Role"
        fi

        if [[ -z "${RBAC_ERROR}" ]]; then
          set +e
          oc apply -f - <<EOF 2>"${TMP_DIR}/rbac-error.log"
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: ${ROLE_NAME}
        subjects:
          - kind: ServiceAccount
            name: ${RUNNER_SERVICE_ACCOUNT}
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: ${ROLE_NAME}
        EOF
          BINDING_RC=$?
          set -e
          if [[ "${BINDING_RC}" -ne 0 ]]; then
            RBAC_ERROR="RoleBinding"
          fi
        fi

        if [[ -n "${RBAC_ERROR}" ]]; then
          echo "❌ Failed to create ${RBAC_ERROR} ${ROLE_NAME}: the browser will not be able to read this run's Secrets"
          echo "   Likely cause: the pipeline ServiceAccount lacks rbac.authorization.k8s.io role/rolebinding create rights,"
          echo "   or does not itself hold 'get' on the three Secrets (Kubernetes RBAC escalation check)"
          echo "   See hack/sap-browser/roks-runner-rbac.yaml for the required pipeline SA permissions"
        else
          echo "✅ Role and RoleBinding created"
        fi

        # --- Read Edge Node ID from the ROKS cluster ---
        echo ""
        echo "📋 Reading Edge Node ID from ROKS cluster..."
        EDGE_NODE_ID=""
        set +e
        NS_OUTPUT=$("${CLUSTER_OC[@]}" get ns edgelm --ignore-not-found -o json 2>&1)
        NS_RC=$?
        set -e
        if [[ "${NS_RC}" -eq 0 ]]; then
          if [[ -z "${NS_OUTPUT}" ]]; then
            echo "ℹ️  Namespace edgelm not found"
          else
            EDGE_NODE_ID=$(jq -r '.metadata.labels["edgelm.sap.com/edge-node-id"] // ""' <<< "${NS_OUTPUT}" 2>/dev/null || true)
            if [[ -n "${EDGE_NODE_ID}" ]]; then
              echo "✅ Edge Node ID: ${EDGE_NODE_ID}"
            else
              echo "ℹ️  Edge Node ID label not found"
            fi
          fi
        else
          EDGE_NODE_ID="unknown"
          # Extract error category (Unauthorized, Forbidden, connection refused, etc.)
          ERROR_CATEGORY=$(echo "${NS_OUTPUT}" | grep -oE "(Unauthorized|Forbidden|connection refused|unable to connect|timeout)" || echo "read error")
          echo "⚠️  Could not read namespace edgelm (${ERROR_CATEGORY}); Edge Node ID set to 'unknown'"
        fi

        echo -n "${EDGE_NODE_ID}" > "$(results.clusterEdgeNodeId.path)"

        echo ""
        echo "=============================================="
        echo "✅ Browser access granted"
        echo "  Cluster:         ${CLUSTER_NAME}"
        echo "  Role/Binding:    ${ROLE_NAME}"
        echo "  ServiceAccount:  ${RUNNER_SERVICE_ACCOUNT}"
        echo "  Edge Node ID:    ${EDGE_NODE_ID:-<not set>}"
        echo "=============================================="
