apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: roks-sap-browser
spec:
  description: >-
    Optional Playwright browser session for the SAP ELM steps of a ROKS
    PipelineRun (phase deploy or teardown). Chromium runs on a virtual display
    in the task pod; the user reaches it through a per-run Route behind the
    OpenShift OAuth proxy (only users allowed to create pods/portforward in the
    pipeline namespace get through) and logs in to OpenShift and SAP. The Route
    link is printed in the log. The step always exits 0: its result outcome
    tells what happened, and after any failure inside the browser the run
    continues on the manual path (pod-level failures, such as a wrong image
    or a missing ServiceAccount, still fail the task). Needs the
    ServiceAccount roks-sap-browser-runner
    (hack/sap-browser/roks-runner-rbac.yaml) via taskRunSpecs.
  params:
    - name: mode
      type: string
      description: inspect or auto
    - name: phase
      type: string
      description: deploy (add the Edge Node, upload the zips, deploy EIC) or teardown (delete the Edge Node)
    - name: runnerImage
      type: string
      description: Image built with hack/sap-browser/Containerfile
    - name: oauthProxyImage
      type: string
      description: OpenShift OAuth proxy image in front of the noVNC page
      default: image-registry.openshift-image-registry.svc:5000/openshift/oauth-proxy:v4.4
    - name: elmUrl
      type: string
      description: Direct SAP Edge Lifecycle Management HTTPS URL
    - name: pipelineRun
      type: string
    - name: pipelineRunUID
      type: string
    - name: clusterName
      type: string
      description: ROKS cluster name (also the Edge Node name)
    - name: obcName
      type: string
      description: ObjectBucketClaim whose Secret and ConfigMap give the bucket for the restricted-resources zips and the elm CLI
    - name: roksCredentialsSecretName
      type: string
      description: Secret with the key POSTGRES_ADMIN_PASSWORD (read into the step env only, optional)
    - name: hubKubeconfigSecretName
      type: string
      description: Hub mode is not supported; when set, the task stops at once with outcome skipped-hub
    - name: clusterEdgeNodeId
      type: string
      default: ''
      description: Edge Node ID label of the cluster's edgelm namespace before this run ('' none, 'unknown' unreadable)
    - name: runnerServiceAccount
      type: string
      default: roks-sap-browser-runner
      description: ServiceAccount the TaskRun runs as (taskRunSpecs); also the OAuth client of the proxy
    - name: sessionMinutes
      type: string
      default: '180'
    - name: loginMinutes
      type: string
      default: '30'
  results:
    - name: outcome
      description: >-
        deployed, inspection-finished, edge-node-deleted, nothing-to-delete,
        handed-over, skipped-hub or failed
  workspaces:
    - name: source
      description: >-
        The checkout's hack/sap-browser folder (bind with subPath:
        hack/sap-browser), so no other workspace file reaches the pod
      readOnly: true
      optional: true
  volumes:
    - name: browser-runtime
      emptyDir:
        medium: Memory
        sizeLimit: 1Gi
    - name: browser-shm
      emptyDir:
        medium: Memory
        sizeLimit: 512Mi
    - name: oauth-proxy-cookie
      emptyDir:
        medium: Memory
        sizeLimit: 1Mi
  sidecars:
    # Listens on :4180 for the per-run Route (created by the browser step) and
    # forwards authenticated requests to noVNC on 127.0.0.1:6080. The cookie
    # secret is new for every pod and stays in memory. oauth-proxy runs as a
    # child and the sidecar always exits 0: with restartPolicy Never a sidecar
    # exiting non-zero can turn the pod, and so the TaskRun, Failed. Without
    # oauth-proxy the user cannot log in and the session ends as failed.
    - name: oauth-proxy
      image: $(params.oauthProxyImage)
      command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail
          umask 077
          if ! head -c 24 /dev/urandom | base64 | tr -d '\n' > /run/oauth-proxy/cookie-secret; then
            echo "oauth-proxy not started: cannot write the cookie secret" >&2
            exit 0
          fi
          status=0
          oauth-proxy "$@" || status=$?
          echo "oauth-proxy exited with status ${status}" >&2
          exit 0
        - oauth-proxy
      args:
        - --provider=openshift
        - --http-address=:4180
        - --https-address=
        - --upstream=http://127.0.0.1:6080
        - --openshift-service-account=$(params.runnerServiceAccount)
        - --cookie-secret-file=/run/oauth-proxy/cookie-secret
        - --cookie-secure=true
        - --skip-provider-button
        - --pass-access-token=false
        - --email-domain=*
        - '--openshift-sar={"namespace":"$(context.taskRun.namespace)","resource":"pods","subresource":"portforward","verb":"create"}'
      computeResources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 128Mi
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      volumeMounts:
        - name: oauth-proxy-cookie
          mountPath: /run/oauth-proxy
  steps:
    - name: browser
      image: $(params.runnerImage)
      computeResources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          cpu: '2'
          memory: 4Gi
      securityContext:
        runAsNonRoot: true
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
        seccompProfile:
          type: RuntimeDefault
      env:
        - name: SAP_BROWSER_ACCESS
          value: route
        - name: SAP_BROWSER_ENTRY
          value: roks-pipeline.mjs
        - name: SAP_BROWSER_SOURCE_BOUND
          value: $(workspaces.source.bound)
        - name: SAP_BROWSER_SOURCE
          value: $(workspaces.source.path)
        - name: SAP_BROWSER_MODE
          value: $(params.mode)
        - name: SAP_BROWSER_PHASE
          value: $(params.phase)
        - name: SAP_ELM_URL
          value: $(params.elmUrl)
        - name: PIPELINE_NAMESPACE
          value: $(context.taskRun.namespace)
        - name: PIPELINE_RUN
          value: $(params.pipelineRun)
        - name: PIPELINE_RUN_UID
          value: $(params.pipelineRunUID)
        - name: CLUSTER_NAME
          value: $(params.clusterName)
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_UID
          valueFrom:
            fieldRef:
              fieldPath: metadata.uid
        - name: TASKRUN_NAME
          value: $(context.taskRun.name)
        - name: RUNNER_SERVICE_ACCOUNT
          value: $(params.runnerServiceAccount)
        - name: S3_PREFIX
          value: restricted-resources/$(params.clusterName)/
        - name: BUCKET_HOST
          valueFrom:
            configMapKeyRef:
              name: $(params.obcName)
              key: BUCKET_HOST
        - name: BUCKET_PORT
          valueFrom:
            configMapKeyRef:
              name: $(params.obcName)
              key: BUCKET_PORT
        - name: BUCKET_NAME
          valueFrom:
            configMapKeyRef:
              name: $(params.obcName)
              key: BUCKET_NAME
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: $(params.obcName)
              key: AWS_ACCESS_KEY_ID
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: $(params.obcName)
              key: AWS_SECRET_ACCESS_KEY
        # Only this key of the ROKS credentials Secret (it also holds the IBM
        # Cloud API key); optional because it exists only with deployPostgres
        - name: POSTGRES_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: $(params.roksCredentialsSecretName)
              key: POSTGRES_ADMIN_PASSWORD
              optional: true
        - name: CLUSTER_EDGE_NODE_ID
          value: $(params.clusterEdgeNodeId)
        - name: HUB_KUBECONFIG_SECRET_NAME
          value: $(params.hubKubeconfigSecretName)
        - name: SAP_BROWSER_SESSION_MINUTES
          value: $(params.sessionMinutes)
        - name: SAP_BROWSER_LOGIN_MINUTES
          value: $(params.loginMinutes)
        - name: SAP_BROWSER_RESULT_PATH
          value: $(results.outcome.path)
      volumeMounts:
        - name: browser-runtime
          mountPath: /tmp
        - name: browser-shm
          mountPath: /dev/shm
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        # roks-pipeline.mjs writes the outcome and never fails. Whatever else
        # goes wrong (display crash, missing entry point, killed browser), this
        # step still exits 0: a failed task would stop the PipelineRun and
        # block the manual path and teardown-roks.
        dumb-init -- bash "${SAP_BROWSER_ENTRYPOINT:-/opt/sap-browser/entrypoint.sh}" || true

        if [[ ! -s "$(results.outcome.path)" ]]; then
          echo "SAP browser task reported no outcome: failed. The pipeline run continues on the manual path."
          printf 'failed' > "$(results.outcome.path)"
        fi
        exit 0
