apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: ossm3-prepare-namespaces-dedicated
spec:
  description: >-
    Configure the SAP namespaces created by the restricted-resources bundles
    (discovered via edgelm.sap.com/product=edgelm, any number of EIC cells
    named <role>-N) for the dedicated service mesh. Replaces the bundles'
    istio-injection label with revision-based injection (istio.io/rev) to
    target the dedicated SAP mesh control plane, and applies SCC security
    annotations per namespace role.
  params:
    - name: hostedClusterName
      type: string
      description: "Name of the hosted cluster"
    - name: hostedClusterNamespace
      type: string
      description: "Namespace for HostedCluster resources"
      default: "clusters"
    - name: hubKubeconfigSecretName
      type: string
      description: "Name of the Secret containing kubeconfig for hub cluster (optional, uses in-cluster config if empty)"
      default: ""
  workspaces:
    - name: source
  steps:
    - name: prepare-namespaces
      image: registry.access.redhat.com/ubi9/ubi
      timeout: "336h"
      workingDir: $(workspaces.source.path)
      script: |
        #!/usr/bin/env bash
        set -euo pipefail

        CLUSTER_NAME="$(params.hostedClusterName)"
        CLUSTER_NS="$(params.hostedClusterNamespace)"
        HUB_KUBECONFIG_SECRET="$(params.hubKubeconfigSecretName)"

        MESH_NAME="sap-mesh-istio"
        DISCOVERY_LABEL="sap-edge-mesh"

        echo "=========================================="
        echo "OSSM3 Prepare Namespaces (Dedicated Mesh)"
        echo "=========================================="
        echo "Hosted Cluster: ${CLUSTER_NAME}"
        echo "Cluster Namespace: ${CLUSTER_NS}"
        echo "Mesh revision: ${MESH_NAME}"
        echo "Discovery label: istio-discovery=${DISCOVERY_LABEL}"
        echo "=========================================="

        # Install required tools
        echo "📦 Installing OpenShift CLI..."
        curl -sL https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz -o /tmp/oc.tar.gz
        tar xzf /tmp/oc.tar.gz -C /tmp
        mv /tmp/oc /usr/local/bin/
        cp /usr/local/bin/oc /usr/local/bin/kubectl
        rm -f /tmp/oc.tar.gz
        oc version --client

        # Configure hub cluster kubeconfig if provided
        if [[ -n "${HUB_KUBECONFIG_SECRET}" ]]; then
          echo "🔐 Extracting hub cluster kubeconfig from secret: ${HUB_KUBECONFIG_SECRET}..."
          HUB_KUBECONFIG="/tmp/hub-kubeconfig"
          if kubectl get secret "${HUB_KUBECONFIG_SECRET}" -o jsonpath='{.data.kubeconfig}' 2>/dev/null | base64 -d > "${HUB_KUBECONFIG}" 2>/dev/null && [[ -s "${HUB_KUBECONFIG}" ]]; then
            echo "✅ Kubeconfig extracted (key: kubeconfig)"
          elif kubectl get secret "${HUB_KUBECONFIG_SECRET}" -o jsonpath='{.data.config}' 2>/dev/null | base64 -d > "${HUB_KUBECONFIG}" 2>/dev/null && [[ -s "${HUB_KUBECONFIG}" ]]; then
            echo "✅ Kubeconfig extracted (key: config)"
          elif kubectl get secret "${HUB_KUBECONFIG_SECRET}" -o jsonpath='{.data.value}' 2>/dev/null | base64 -d > "${HUB_KUBECONFIG}" 2>/dev/null && [[ -s "${HUB_KUBECONFIG}" ]]; then
            echo "✅ Kubeconfig extracted (key: value)"
          else
            echo "❌ Failed to extract kubeconfig from secret '${HUB_KUBECONFIG_SECRET}'"
            echo "   Secret should have kubeconfig data under key 'kubeconfig', 'config', or 'value'"
            exit 1
          fi
          chmod 600 "${HUB_KUBECONFIG}"
          export KUBECONFIG="${HUB_KUBECONFIG}"
          echo "✅ Using hub kubeconfig for cluster operations"
          oc whoami
        else
          echo "ℹ️  No hub kubeconfig secret provided, using in-cluster service account"
        fi

        # Extract kubeconfig for hosted cluster
        echo "🔐 Extracting kubeconfig for hosted cluster..."
        KUBECONFIG_SECRET="${CLUSTER_NAME}-admin-kubeconfig"

        if ! oc get secret "${KUBECONFIG_SECRET}" -n "${CLUSTER_NS}" > /dev/null 2>&1; then
          echo "❌ Kubeconfig secret '${KUBECONFIG_SECRET}' not found in namespace '${CLUSTER_NS}'"
          exit 1
        fi

        HOSTED_KUBECONFIG="/tmp/hosted-kubeconfig"
        oc get secret "${KUBECONFIG_SECRET}" -n "${CLUSTER_NS}" \
          -o jsonpath='{.data.kubeconfig}' | base64 -d > "${HOSTED_KUBECONFIG}"
        chmod 600 "${HOSTED_KUBECONFIG}"

        export KUBECONFIG="${HOSTED_KUBECONFIG}"
        [[ -f "$(workspaces.source.path)/.kubeconfig-rewrite.sh" ]] && source "$(workspaces.source.path)/.kubeconfig-rewrite.sh" "${HOSTED_KUBECONFIG}"

        echo "🔍 Verifying access to hosted cluster..."
        oc get nodes
        echo "✅ Successfully connected to hosted cluster"

        # --- Discover the SAP namespaces created by the restricted-resources bundles ---
        # The bundles (applied by ossm3-download-and-apply-rbac) create every
        # namespace with edgelm.sap.com/product=edgelm. With multiple cells the
        # names carry a trailing -N index (edge-icell-1, edge-icell-secrets-2, …),
        # see .tekton/README.md, "Multi-EIC restricted resources".
        echo ""
        echo "🔍 Discovering SAP namespaces (edgelm.sap.com/product=edgelm)..."
        NAMESPACES=()
        while IFS= read -r NS; do
          [[ -n "${NS}" ]] && NAMESPACES+=("${NS}")
        done < <(oc get namespace -l edgelm.sap.com/product=edgelm -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | sort -V)

        if [[ ${#NAMESPACES[@]} -eq 0 ]]; then
          echo "❌ No namespaces labeled edgelm.sap.com/product=edgelm found"
          echo "   They are created by the restricted-resources bundles (apply-rbac task)."
          exit 1
        fi
        printf '   %s\n' "${NAMESPACES[@]}"

        # --- Label namespaces for dedicated mesh (revision-based injection) ---
        # The bundles mark mesh namespaces with istio-injection=enabled (all but
        # the secrets namespace). The dedicated mesh needs istio.io/rev instead.
        # Namespaces already on the revision count too, so a re-run is idempotent.
        echo ""
        echo "🏷️ Labeling namespaces for dedicated mesh (revision-based injection)..."
        for NS in "${NAMESPACES[@]}"; do
          LABELS=$(oc get namespace "${NS}" -o jsonpath='{.metadata.labels.istio-injection}/{.metadata.labels.istio\.io/rev}')
          if [[ "${LABELS}" == "enabled/"* || "${LABELS}" == */"${MESH_NAME}" ]]; then
            echo "   ${NS}: istio.io/rev=${MESH_NAME}"
            oc label namespace "${NS}" istio.io/rev="${MESH_NAME}" --overwrite
          else
            echo "   ${NS}: no sidecar injection"
          fi
          # Remove istio-injection label to avoid conflicts with revision-based injection
          oc label namespace "${NS}" istio-injection- 2>/dev/null || true
        done

        echo "✅ Namespace labels applied"

        # --- Apply the necessary security annotations for SCCs ---
        # Role = namespace name with the trailing -N cell index stripped; every
        # cell gets the same values.
        echo ""
        echo "🔐 Applying SCC security annotations..."
        for NS in "${NAMESPACES[@]}"; do
          ROLE=$(sed -E 's/-[0-9]+$//' <<< "${NS}")
          case "${ROLE}" in
            edgelm)              UID_RANGE="";              SUPPLEMENTAL_GROUPS="67000/1000" ;;
            edge-icell)          UID_RANGE="10000/100";     SUPPLEMENTAL_GROUPS="1000/100" ;;
            edge-icell-ela)      UID_RANGE="100000/1000";   SUPPLEMENTAL_GROUPS="100002/1000" ;;
            edge-icell-services) UID_RANGE="1000000/1000";  SUPPLEMENTAL_GROUPS="1000002/1000" ;;
            edge-icell-secrets|istio-gateways)
              echo "   ${NS}: none (role ${ROLE})"
              continue ;;
            *)
              echo "   ⚠️ ${NS}: unknown role '${ROLE}', skipping SCC annotations"
              continue ;;
          esac
          echo "   ${NS}: uid-range=${UID_RANGE:-<unset>}, supplemental-groups=${SUPPLEMENTAL_GROUPS}"
          if [[ -n "${UID_RANGE}" ]]; then
            oc annotate namespace "${NS}" openshift.io/sa.scc.uid-range="${UID_RANGE}" --overwrite
          fi
          oc annotate namespace "${NS}" openshift.io/sa.scc.supplemental-groups="${SUPPLEMENTAL_GROUPS}" --overwrite
        done

        echo "✅ SCC annotations applied"

        # --- Verify all namespaces are Active ---
        echo ""
        echo "🔍 Verifying namespace status..."
        ALL_ACTIVE=true
        for NS in "${NAMESPACES[@]}"; do
          STATUS=$(oc get namespace "${NS}" -o jsonpath='{.status.phase}')
          if [[ "${STATUS}" == "Active" ]]; then
            echo "   ✅ ${NS}: ${STATUS}"
          else
            echo "   ❌ ${NS}: ${STATUS}"
            ALL_ACTIVE=false
          fi
        done

        if [[ "${ALL_ACTIVE}" != "true" ]]; then
          echo "❌ Not all namespaces are in Active state"
          exit 1
        fi

        echo ""
        echo "=========================================="
        echo "✅ Namespace preparation completed (dedicated mesh)"
        echo "   Configured ${#NAMESPACES[@]} namespaces"
        echo "   Sidecar injection via: istio.io/rev=${MESH_NAME}"
        echo "=========================================="
