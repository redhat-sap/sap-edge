apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: aro-eic-ossm3-pipeline
  annotations:
    description: "Complete SAP Edge Integration Cell validation pipeline: deploys ARO with Azure services (PostgreSQL, Redis, Quay Storage via Bicep), Quay registry operator, applies the OSSM3 restricted-resources in two passes (ELM bundle first, EIC bundle after the Edge Node is registered), runs comprehensive endpoint tests, and tears down infrastructure"
spec:
  params:
    - name: repoUrl
      type: string
    - name: revision
      type: string
    - name: pullRequestNumber
      type: string
      description: "Pull request number"
      default: ""
    - name: aroLocation
      type: string
      description: "ARO location"
      default: "northeurope"
    - name: aroClusterName
      type: string
      description: "ARO cluster name"
    - name: aroVersion
      type: string
      description: "ARO version"
      default: "4.15.35"
    - name: azureSecretName
      type: string
      description: "Name of the Kubernetes Secret containing Azure service principal credentials, ARO resource group, and ARO domain"
      default: "azure-sp-secret"
    - name: pullSecretName
      type: string
      description: "Name of the Kubernetes Secret containing Red Hat pull secret"
      default: "redhat-pull-secret"
    - name: eicAuthSecretName
      type: string
      description: "EIC authentication secret name"
    - name: postgresAdminPasswordSecretName
      type: string
      description: "Name of the Kubernetes Secret containing PostgreSQL admin password"
      default: "azure-postgres-admin-password"
    - name: quayAdminPasswordSecretName
      type: string
      description: "Name of the Kubernetes Secret containing Quay admin password and email"
      default: "quay-admin-secret"
    - name: deployPostgres
      type: string
      description: "Whether to deploy PostgreSQL (true/false)"
      default: "false"
    - name: deployRedis
      type: string
      description: "Whether to deploy Redis (true/false)"
      default: "false"
    - name: deployQuay
      type: string
      description: "Whether to deploy Quay storage (true/false)"
      default: "true"
    - name: publicDNS
      type: string
      description: "Use public DNS"
      default: "false"
    - name: jiraSecretName
      type: string
      description: "Name of the Kubernetes Secret containing Jira credentials"
    - name: jiraIssueKey
      type: string
      description: "Jira issue key to update with test results"
    - name: skipEicValidation
      type: string
      description: "Skip EIC validation and endpoint tests (true/false). When true, skips directly to teardown approval."
      default: "false"
    - name: skipAutomatedTests
      type: string
      description: "Skip automated endpoint tests for manual execution: httpbinipfilter, slvredis, ratelimit-slvredis (true/false)"
      default: "false"
    - name: hubClusterName
      type: string
      description: "Name of the hub cluster (used to derive kubeconfig secret name: {hubClusterName}-kubeconfig)"
    # --- OSSM3 parameters ---
    - name: ossm3Channel
      type: string
      description: "OLM subscription channel for the OSSM3 operator"
      default: "stable-3.2"
    - name: obcName
      type: string
      description: "Name of the ObjectBucketClaim (OBC) for downloading restricted-access RBAC resources from S3"
      default: "sap-eic-restricted-cluster-config-resources"
    - name: s3Prefix
      type: string
      description: "S3 key prefix of this deployment's restricted-resources folders (e.g. restricted-resources/<aroClusterName>/)"
      default: "restricted-resources/"
    - name: elmZipFolders
      type: string
      description: "ELM zip folder under s3Prefix. The pipeline creates it, waits until it holds a zip (wait-elm-zip) and applies only it in the first pass (apply-elm-resources)."
      default: "elm"
    - name: eicZipFolders
      type: string
      description: "EIC zip folder under s3Prefix (uploaded after the Edge Node is registered and EIC is deployed in ELM). The pipeline creates it, waits until it holds a zip (wait-eic-zip) and applies only it in the second pass (apply-eic-resources)."
      default: "edge-icell"
    - name: enableMasterScheduling
      type: string
      description: "Whether to make master nodes schedulable (true) or leave them unschedulable (false). Set to false when worker nodes provide enough capacity."
      default: "true"
  results:
    - name: cluster-summary
      description: "Brief cluster and services validation summary"
      value: $(tasks.validate-and-get-access.results.cluster-summary)
  workspaces:
    - name: source
  tasks:
    - name: fetch-repository
      taskRef: { name: git-clone }
      params:
        - name: url
          value: $(params.repoUrl)
        - name: revision
          value: $(params.revision)
        - name: depth
          value: "0"  # Full clone to ensure all refs are available
      workspaces:
        - name: output
          workspace: source

    - name: deploy-aro
      runAfter: [fetch-repository]
      taskRef: { name: aro-deploy-with-eic-services }
      params:
        - name: aroLocation
          value: $(params.aroLocation)
        - name: aroClusterName
          value: $(params.aroClusterName)
        - name: aroVersion
          value: $(params.aroVersion)
        - name: azureSecretName
          value: $(params.azureSecretName)
        - name: pullSecretName
          value: $(params.pullSecretName)
        - name: postgresAdminPasswordSecretName
          value: $(params.postgresAdminPasswordSecretName)
        - name: deployPostgres
          value: $(params.deployPostgres)
        - name: deployRedis
          value: $(params.deployRedis)
        - name: deployQuay
          value: $(params.deployQuay)
      workspaces:
        - name: source
          workspace: source

    - name: validate-and-get-access
      runAfter: [deploy-aro]
      taskRef: { name: aro-validate-and-get-access }
      params:
        - name: aroClusterName
          value: $(params.aroClusterName)
        - name: azureSecretName
          value: $(params.azureSecretName)
        - name: postgresAdminPasswordSecretName
          value: $(params.postgresAdminPasswordSecretName)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: enableMasterScheduling
          value: $(params.enableMasterScheduling)
      workspaces:
        - name: source
          workspace: source

    - name: deploy-quay
      runAfter: [validate-and-get-access]
      when:
        - input: $(params.deployQuay)
          operator: in
          values: ["true"]
      taskRef: { name: aro-quay-deploy }
      params:
        - name: aroClusterName
          value: $(params.aroClusterName)
        - name: azureSecretName
          value: $(params.azureSecretName)
        - name: quayAdminPasswordSecretName
          value: $(params.quayAdminPasswordSecretName)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # =============================================
    # OSSM3 Restricted-Access Setup
    # =============================================

    # Pre-flight validation (runs in parallel with fetch-repository)
    - name: preflight-check
      taskRef: { name: ossm3-preflight-check }
      params:
        - name: obcName
          value: $(params.obcName)
        - name: pullSecretName
          value: $(params.pullSecretName)

    # Create the S3 folders elm/ and edge-icell/ under s3Prefix and render the
    # upload instructions (parallel with the cluster deployment). Earlier zips
    # stay (no archive): a re-run reuses them, the latest version per folder wins.
    - name: prepare-restricted-resources-prefix
      runAfter: [preflight-check]
      taskRef: { name: ossm3-prepare-restricted-resources-prefix }
      params:
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: components
          value: "$(params.elmZipFolders) $(params.eicZipFolders)"

    # Wait for the ELM zip (first pass; the EIC zip can only be downloaded after
    # the Edge Node is registered with the restricted kubeconfig, see
    # wait-eic-zip). The log shows the upload plan.
    - name: wait-elm-zip
      runAfter: [prepare-restricted-resources-prefix]
      taskRef: { name: ossm3-wait-for-restricted-resources }
      params:
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: components
          value: $(params.elmZipFolders)
        - name: instructions
          value: |
            ARO cluster $(params.aroClusterName), first pass: in Edge Lifecycle Management, add the Edge Node
            with restricted access and upload its ELM restricted-resources zip as downloaded to the elm/
            folder (latest version wins). The EIC zip (edge-icell/) comes later, after the Edge Node is
            registered (wait-eic-zip); a zip already in that folder is applied in the second pass.
            $(tasks.prepare-restricted-resources-prefix.results.uploadPlan)

    # Install Service Mesh 3.x operator on target cluster
    - name: verify-operators
      runAfter: [validate-and-get-access]
      taskRef: { name: ossm3-verify-operators }
      params:
        - name: hostedClusterName
          value: $(params.aroClusterName)
        - name: ossm3Channel
          value: $(params.ossm3Channel)
        - name: useWorkspaceKubeconfig
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # Download and apply the ELM restricted-access resources (first pass); the
    # EIC bundle follows in apply-eic-resources
    - name: apply-elm-resources
      runAfter: [verify-operators, wait-elm-zip]
      taskRef: { name: ossm3-download-and-apply-rbac }
      params:
        - name: hostedClusterName
          value: $(params.aroClusterName)
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: requiredComponents
          value: $(params.elmZipFolders)
        - name: useWorkspaceKubeconfig
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # Prepare namespaces with labels and SCC annotations (first pass: edgelm;
    # the EIC namespaces follow in prepare-namespaces-eic)
    - name: prepare-namespaces
      runAfter: [apply-elm-resources]
      taskRef: { name: ossm3-prepare-namespaces }
      params:
        - name: hostedClusterName
          value: $(params.aroClusterName)
        - name: useWorkspaceKubeconfig
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # Configure OpenShift Service Mesh 3.x
    - name: configure-mesh
      runAfter: [prepare-namespaces]
      taskRef: { name: ossm3-configure-mesh }
      params:
        - name: hostedClusterName
          value: $(params.aroClusterName)
        - name: useWorkspaceKubeconfig
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # Generate SA-based restricted kubeconfig for ELM registration
    - name: generate-sa-based-kubeconfig
      runAfter: [configure-mesh]
      taskRef: { name: ossm3-generate-sa-based-kubeconfig }
      params:
        - name: hostedClusterName
          value: $(params.aroClusterName)
        - name: useWorkspaceKubeconfig
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # Second pass (EIC). Every task carries the skipEicValidation gate: a task
    # skipped by its own `when` does not block the tasks that run after it, so
    # apply-eic-resources would otherwise run without a zip.
    # Wait for the EIC zip (log: what to do in ELM and the upload plan); after
    # the registry, which ELM needs for the Edge Node.
    - name: wait-eic-zip
      runAfter: [generate-sa-based-kubeconfig, deploy-quay]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
      taskRef: { name: ossm3-wait-for-restricted-resources }
      params:
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: components
          value: $(params.eicZipFolders)
        - name: instructions
          value: |
            ARO cluster $(params.aroClusterName), second pass: the ELM resources are applied and the mesh is
            running; the Azure PostgreSQL/Redis connection data is in the validate-and-get-access log.
            1. Register the cluster in ELM with the restricted kubeconfig in Secret
               edgelm-kubeconfig-generated-$(params.aroClusterName) (check "Restricted Access").
            2. Deploy Edge Integration Cell (EIC) on that Edge Node.
            3. Upload the EIC restricted-resources zip as downloaded to the edge-icell/ folder.
            Confirm the EIC resources as applied in ELM only once approval-elm-eic-iflow-deployed is
            waiting: apply-eic-resources, prepare-namespaces-eic and configure-mesh-eic run first, so the
            EIC pods start with their sidecars.
            $(tasks.prepare-restricted-resources-prefix.results.uploadPlan)

    # Download and apply the EIC restricted-access resources (second pass)
    - name: apply-eic-resources
      runAfter: [wait-eic-zip]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
      taskRef: { name: ossm3-download-and-apply-rbac }
      params:
        - name: hostedClusterName
          value: $(params.aroClusterName)
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: requiredComponents
          value: $(params.eicZipFolders)
        - name: useWorkspaceKubeconfig
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # Labels and SCC annotations for the EIC namespaces
    - name: prepare-namespaces-eic
      runAfter: [apply-eic-resources]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
      taskRef: { name: ossm3-prepare-namespaces }
      params:
        - name: hostedClusterName
          value: $(params.aroClusterName)
        - name: useWorkspaceKubeconfig
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # The EIC namespaces join the mesh
    - name: configure-mesh-eic
      runAfter: [prepare-namespaces-eic]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
      taskRef: { name: ossm3-configure-mesh }
      params:
        - name: hostedClusterName
          value: $(params.aroClusterName)
        - name: useWorkspaceKubeconfig
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # Manual approval gate after OSSM3 setup (both passes) and Quay deployment
    - name: approval-elm-eic-iflow-deployed
      runAfter: [deploy-quay, configure-mesh-eic]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
      taskRef:
        apiVersion: openshift-pipelines.org/v1alpha1
        kind: ApprovalTask
      params:
        - name: approvers
          value:
            - mjiao
            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            ARO cluster, Azure services (PostgreSQL/Redis), Quay registry, and OSSM3 restricted-access setup are complete.

            Restricted kubeconfig stored as Secret 'edgelm-kubeconfig-generated-$(params.aroClusterName)'.

            The restricted resources were applied in two passes (ELM first, then EIC after the Edge Node
            was registered; registration, EIC deployment and the EIC zip upload happened before this gate,
            see wait-eic-zip).

            🔧 Please complete the following manually:
            1. In ELM, confirm the EIC restricted resources as applied and wait until EIC is deployed
            2. Deploy iFlows for testing

            After deployment is complete and istio-ingressgateway has a LoadBalancer IP:
            ✅ APPROVE: Continue to create ConfigMap and run endpoint tests
            ❌ REJECT: Skip tests and proceed to teardown
        - name: numberOfApprovalsRequired
          value: '1'
        - name: timeout
          value: '336h'

    # Create ConfigMap with istio-ingressgateway LoadBalancer IP (after ELM/EIC/iFlow deployment)
    - name: validate-and-create-configmap
      runAfter: [approval-elm-eic-iflow-deployed]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
      taskRef: { name: aro-validate-and-create-configmap }
      params:
        - name: aroClusterName
          value: $(params.aroClusterName)
        - name: azureSecretName
          value: $(params.azureSecretName)
      workspaces:
        - name: source
          workspace: source

    # Endpoint tests run after ConfigMap creation
    # NOTE: httpbinipfilter has an IP filter policy. The cluster pod CIDR
    # must be whitelisted in the iFlow's IP filter settings.
    - name: test-httpbinipfilter
      runAfter: [validate-and-create-configmap]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
        - input: $(params.skipAutomatedTests)
          operator: in
          values: ["false"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /httpbinipfilter
        - name: clusterConfigMapName
          value: "cluster-info-aro-$(params.aroClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-http-test1
      runAfter: [validate-and-create-configmap]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/test1
        - name: clusterConfigMapName
          value: "cluster-info-aro-$(params.aroClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-http-testelster
      runAfter: [validate-and-create-configmap]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/testelster
        - name: clusterConfigMapName
          value: "cluster-info-aro-$(params.aroClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-slvredis
      runAfter: [validate-and-create-configmap]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
        - input: $(params.skipAutomatedTests)
          operator: in
          values: ["false"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-aro-$(params.aroClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-ratelimit-slvredis
      runAfter: [test-slvredis]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
        - input: $(params.skipAutomatedTests)
          operator: in
          values: ["false"]
      taskRef: { name: rate-limit-test }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-aro-$(params.aroClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    # Manual approval before second round of tests
    - name: approval-second-test-round
      runAfter:
        - test-httpbinipfilter
        - test-http-test1
        - test-http-testelster
        - test-slvredis
        - test-ratelimit-slvredis
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
      taskRef:
        apiVersion: openshift-pipelines.org/v1alpha1
        kind: ApprovalTask
      params:
        - name: approvers
          value:
            - mjiao
            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            First round of endpoint tests completed successfully.

            Cluster: $(params.aroClusterName)

            ✅ APPROVE: Run second round of endpoint tests
            ❌ REJECT: Skip second round and proceed
        - name: numberOfApprovalsRequired
          value: '1'
        - name: timeout
          value: '336h'

    # Second round of endpoint tests
    - name: test-httpbinipfilter-round2
      runAfter: [approval-second-test-round]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
        - input: $(params.skipAutomatedTests)
          operator: in
          values: ["false"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /httpbinipfilter
        - name: clusterConfigMapName
          value: "cluster-info-aro-$(params.aroClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-http-test1-round2
      runAfter: [approval-second-test-round]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/test1
        - name: clusterConfigMapName
          value: "cluster-info-aro-$(params.aroClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-http-testelster-round2
      runAfter: [approval-second-test-round]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/testelster
        - name: clusterConfigMapName
          value: "cluster-info-aro-$(params.aroClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-slvredis-round2
      runAfter: [approval-second-test-round]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
        - input: $(params.skipAutomatedTests)
          operator: in
          values: ["false"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-aro-$(params.aroClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-ratelimit-slvredis-round2
      runAfter: [test-slvredis-round2]
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
        - input: $(params.skipAutomatedTests)
          operator: in
          values: ["false"]
      taskRef: { name: rate-limit-test }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-aro-$(params.aroClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: update-jira-ticket
      runAfter:
        - test-httpbinipfilter-round2
        - test-http-test1-round2
        - test-http-testelster-round2
        - test-slvredis-round2
        - test-ratelimit-slvredis-round2
      when:
        - input: $(params.skipEicValidation)
          operator: in
          values: ["false"]
      taskRef:
        name: jira-add-comment-custom
      params:
        - name: jiraSecretName
          value: $(params.jiraSecretName)
        - name: jiraIssueKey
          value: $(params.jiraIssueKey)
        - name: comment
          value: |
            h2. ✅ Complete EIC Validation Pipeline Completed

            ARO cluster with full EIC infrastructure and all automated endpoint tests completed successfully.

            *Infrastructure Configuration:*
            * *Cluster Name:* $(params.aroClusterName)
            * *Location:* $(params.aroLocation)
            * *ARO Version:* $(params.aroVersion)
            * *PostgreSQL:* $(params.deployPostgres) (VNet integrated, Bicep-managed)
            * *Redis:* $(params.deployRedis) (Private endpoint, Bicep-managed)
            * *Quay Storage:* $(params.deployQuay) (Azure Storage, Bicep-managed)
            * *Quay Registry:* ✅ Deployed

            *Pipeline Status:*
            * Repository cloned: ✅
            * ARO deployment with Azure services: ✅ Completed
            * Quay registry deployment: ✅ Completed
            * Validation and access setup: ✅ Completed
            * Endpoint tests (2 rounds): ✅ All Passed

            *Pipeline Details:*
            * *Repository:* $(params.repoUrl)
            * *Pull Request:* $(params.repoUrl)/pull/$(params.pullRequestNumber)
            * *Revision:* $(params.revision)
            * *Public DNS:* $(params.publicDNS)

            *Executed Tests (Round 1):*
            * test-httpbinipfilter ✅
            * test-http-test1 ✅
            * test-http-testelster ✅
            * test-slvredis ✅
            * test-ratelimit-slvredis ✅

            *Executed Tests (Round 2):*
            * test-httpbinipfilter-round2 ✅
            * test-http-test1-round2 ✅
            * test-http-testelster-round2 ✅
            * test-slvredis-round2 ✅
            * test-ratelimit-slvredis-round2 ✅

            *Infrastructure Components:*
            * ARO OpenShift cluster ✅
            * Azure PostgreSQL (VNet integrated) ✅
            * Azure Redis (Private endpoint) ✅
            * Quay container registry ✅
            * All EIC endpoints validated ✅

            *Security:*
            * PostgreSQL: Private connectivity via delegated subnet (Bicep-managed)
            * Redis: Private endpoint with private DNS (Bicep-managed)
            * Quay Storage: Azure Storage Account with private access (Bicep-managed)
            * Quay: Certificate trust configured for OpenShift integration

            Ready for manual teardown approval. The complete EIC infrastructure will be destroyed once approved.

    # Manual approval step before teardown - this will pause the pipeline
    - name: approval-teardown
      runAfter:
        - update-jira-ticket
      taskRef:
        apiVersion: openshift-pipelines.org/v1alpha1
        kind: ApprovalTask
      params:
        - name: approvers
          value:
            - mjiao
            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            All endpoint tests completed. Please review results.
            
            ✅ APPROVE: Tear down ARO cluster and Azure resources
            ❌ REJECT: Keep cluster running (will timeout after 336h and teardown anyway)
        - name: numberOfApprovalsRequired
          value: '1'
        - name: timeout
          value: '336h'

    # Teardown after approval
    - name: teardown-aro
      runAfter: [approval-teardown]
      taskRef: { name: aro-teardown }
      params:
        - name: aroClusterName
          value: $(params.aroClusterName)
        - name: azureSecretName
          value: $(params.azureSecretName)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source
