    - name: cell1-test-slvredis-round2
      runAfter: [approval-second-test-round]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    - name: cell1-test-ratelimit-slvredis-round2
      runAfter: [cell1-test-slvredis-round2]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskRef: { name: rate-limit-test }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
