          workspace: source

    - name: cell2-test-ratelimit-slvredis
      runAfter: [cell2-test-slvredis]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskRef: { name: rate-limit-test }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-2"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Cooldown after cell 2's rate-limit test to let the rate limiter window recover
    - name: cell2-cooldown-after-round1
      runAfter: [cell2-test-ratelimit-slvredis]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskSpec:
        steps:
          - name: cooldown
            image: registry.access.redhat.com/ubi9/ubi-minimal
            script: |
              echo "⏳ Cooling down for 30s to let rate limiter recover..."
              sleep 30
              echo "✅ Cooldown complete."

    # Step 18: Manual approval before second round of tests (waits for both cells)
    - name: approval-second-test-round
      runAfter:
        - cell1-test-httpbinipfilter
        - cell1-test-http-test1
        - cell1-test-http-testelster
        - cell1-test-slvredis
        - cell1-cooldown-after-round1
        - cell2-test-httpbinipfilter
        - cell2-test-http-test1
        - cell2-test-http-testelster
