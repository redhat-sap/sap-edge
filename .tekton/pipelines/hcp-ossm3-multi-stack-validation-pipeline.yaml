        - name: publicDNS
          value: "true"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: startDelay
          value: "4"
      workspaces:
        - name: source
          workspace: source

    - name: cell1-test-http-testelster-route
      runAfter: [approval-route-test-round]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/testelster
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
