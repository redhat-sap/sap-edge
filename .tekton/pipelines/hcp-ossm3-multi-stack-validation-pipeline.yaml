               its Redis/Valkey (namespace suffix -eic-1) and the shared PostgreSQL
            4. Deploy EIC 2 on Edge Node 2 with host eic-2.<ingress domain> (gateway istio-gateways-2),
               its Redis/Valkey (namespace suffix -eic-2) and the shared PostgreSQL
            5. Deploy iFlows for testing on each EIC cell
