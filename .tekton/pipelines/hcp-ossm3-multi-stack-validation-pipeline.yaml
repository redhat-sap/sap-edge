      taskRef:
        apiVersion: openshift-pipelines.org/v1alpha1
        kind: ApprovalTask
      params:
        - name: approvers
          value:
            - mjiao
            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            Second round of endpoint tests completed successfully for every EIC cell.
            Now ready to run Route-based endpoint tests (round 3).

            Route-based tests will send traffic through the OpenShift Router
            (HAProxy passthrough) instead of directly to the LoadBalancer IP.

            Cluster: $(params.hostedClusterName)
            Mesh: multi-stack (2 Edge Nodes, dedicated mesh each):
              istio-system-sap-edge-1/sap-mesh-istio-1, istio-system-sap-edge-2/sap-mesh-istio-2
            Edge Node 1, cell 1 (edge-icell-1): Route eic-1.<ingress domain> in istio-gateways-1, ConfigMap route-info-hcp-$(params.hostedClusterName)-1
            Edge Node 2, cell 2 (edge-icell-2): Route eic-2.<ingress domain> in istio-gateways-2, ConfigMap route-info-hcp-$(params.hostedClusterName)-2

            ✅ APPROVE: Run Route-based endpoint tests (both cells)
            ❌ REJECT: Skip Route tests and proceed
        - name: numberOfApprovalsRequired
          value: '1'
        - name: timeout
          value: '336h'

