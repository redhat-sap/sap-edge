            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            First round of endpoint tests completed successfully for every EIC cell.

            Cluster: $(params.hostedClusterName)
            Mesh: multi-stack (2 Edge Nodes, dedicated mesh each):
              istio-system-sap-edge-1/sap-mesh-istio-1, istio-system-sap-edge-2/sap-mesh-istio-2
            Edge Node 1, cell 1 (edge-icell-1): eic-1 via istio-gateways-1, ConfigMap cluster-info-hcp-$(params.hostedClusterName)-1
            Edge Node 2, cell 2 (edge-icell-2): eic-2 via istio-gateways-2, ConfigMap cluster-info-hcp-$(params.hostedClusterName)-2

