apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: hcp-ossm3-multi-stack-validation-pipeline
  annotations:
    description: "Complete SAP Edge validation pipeline for HCP KubeVirt, multi-stack (2 Edge Nodes, dedicated mesh each; multi-EIC topology B): creates hosted cluster, applies the restricted-resources in two passes (ELM bundles first, EIC bundles after the Edge Nodes are registered), deploys one OSSM3 control plane per Edge Node (istio-system-sap-edge-N / sap-mesh-istio-N) and assigns each stack's namespaces to it with revision-based injection, generates one restricted kubeconfig per Edge Node (edgelm-N), deploys a shared PostgreSQL and one Redis/Valkey per EIC cell, runs per-cell endpoint tests, and tears down infrastructure"
spec:
  params:
    # --- Git parameters ---
    - name: repoUrl
      type: string
      description: "Git repository URL"
    - name: revision
      type: string
      description: "Git revision (branch/tag/commit)"
      default: "main"
    - name: pullRequestNumber
      type: string
      description: "Pull request number"
      default: ""

    # --- HCP cluster parameters ---
    - name: hostedClusterName
      type: string
      description: "Name of the hosted cluster"
    - name: hostedClusterNamespace
      type: string
      description: "Namespace for HostedCluster resources"
      default: "clusters"
    - name: releaseImage
      type: string
      description: "OCP release image for the hosted cluster"
      default: "quay.io/openshift-release-dev/ocp-release:4.15.0-x86_64"
    - name: nodePoolReplicas
      type: string
      description: "Number of worker nodes"
      default: "3"
    - name: nodePoolCpuCores
      type: string
      description: "vCPU cores per worker node"
      default: "16"
    - name: nodePoolMemoryGB
      type: string
      description: "RAM in GB per worker node"
      default: "32"
    - name: rootDiskSizeGB
      type: string
      description: "Root disk size in GB per worker node"
      default: "120"
    - name: pullSecretName
      type: string
      description: "Name of the Kubernetes Secret containing Red Hat pull secret"
      default: "redhat-pull-secret"
    - name: etcdStorageClass
      type: string
      description: "Storage class for etcd PVCs (leave empty for default)"
      default: ""
    - name: hubClusterName
      type: string
      description: "Name of the hub cluster (used to derive kubeconfig secret name: {hubClusterName}-kubeconfig)"
    - name: nfsPersistenceSize
      type: string
      description: "NFS server provisioner PVC pool size"
      default: "20Gi"

    # --- OSSM3 parameters ---
    - name: ossm3Channel
      type: string
      description: "OLM subscription channel for the OSSM3 operator"
      default: "stable-3.2"
    - name: obcName
      type: string
      description: "Name of the ObjectBucketClaim (OBC) for downloading restricted-access RBAC resources from S3"
      default: "sap-eic-restricted-cluster-config-resources"
    - name: s3Prefix
      type: string
      description: "S3 key prefix of this deployment's restricted-resources bundles (e.g. restricted-resources/pr123-multi-stack/)"
      default: "restricted-resources/"
    - name: elmRestrictedResourcesComponents
      type: string
      description: "Space-separated ELM component folders under s3Prefix (one per Edge Node; the pipeline is fixed at two stacks). The pipeline creates them, waits until each holds a zip (wait-elm-zips) and applies only them in the first pass (apply-rbac-elm)."
      default: "elm-1 elm-2"
    - name: eicRestrictedResourcesComponents
      type: string
      description: "Space-separated EIC component folders under s3Prefix (one per Edge Node, uploaded after the Edge Nodes are registered and EIC is deployed in ELM). The pipeline creates them, waits until each holds a zip (wait-eic-zips) and applies only them in the second pass (apply-rbac-eic)."
      default: "edge-icell-1 edge-icell-2"
    # --- Corporate proxy parameters ---
    # Proxy config is read from a Secret named {hubClusterName}-proxy-config
    # containing keys: PROXY_HOST, PROXY_PORT, PROXY_IP

    # --- EIC services parameters ---
    - name: postgresVersion
      type: string
      description: "PostgreSQL version (v15/v16/v17)"
      default: "v15"
    - name: postgresHA
      type: string
      description: "Deploy PostgreSQL in HA mode (3 replicas with anti-affinity)"
      default: "true"
    - name: datastoreType
      type: string
      description: "Datastore type: redis, valkey-standalone, or valkey-cluster"
      default: "redis"
    - name: redisClusterType
      type: string
      description: "Redis cluster type (standard/ha) - only used when datastoreType=redis"
      default: "standard"

    # --- Endpoint test parameters ---
    - name: eicAuthSecretName
      type: string
      description: "EIC authentication secret name for endpoint tests"
    - name: publicDNS
      type: string
      description: "Use public DNS for endpoint tests"
      default: "false"
    - name: testHttpbinipfilter
      type: string
      description: "Run httpbinipfilter endpoint tests (set false to skip)"
      default: "true"
    - name: testSlvredis
      type: string
      description: "Run slvredis endpoint and rate-limit tests (set false to skip)"
      default: "true"

    # --- Jira parameters ---
    - name: jiraSecretName
      type: string
      description: "Name of the Kubernetes Secret containing Jira credentials"
      default: ""
    - name: jiraIssueKey
      type: string
      description: "Jira issue key to update with deployment results"
      default: ""

    # --- Pipeline control ---
    - name: skipTeardown
      type: string
      description: "Skip the teardown step at the end"
      default: "false"
  workspaces:
    - name: source

  tasks:
    # =============================================
    # Phase 1: Create HCP KubeVirt Cluster
    # =============================================

    # Step 0: Pre-flight validation (runs in parallel with fetch-repository)
    - name: preflight-check
      taskRef: { name: ossm3-preflight-check }
      params:
        - name: obcName
          value: $(params.obcName)
        - name: pullSecretName
          value: $(params.pullSecretName)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig

    # Step 0.1: Create the per-component S3 folders (elm-N/, edge-icell-N/ per
    #           Edge Node) under s3Prefix and render upload instructions. Runs
    #           in parallel with cluster creation so the upload overlaps the
    #           cluster build. Earlier zips stay (no archive): a re-run of the
    #           same PR reuses them, the latest version per folder wins.
    - name: prepare-restricted-resources-prefix
      runAfter: [preflight-check]
      taskRef: { name: ossm3-prepare-restricted-resources-prefix }
      params:
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: components
          value: "$(params.elmRestrictedResourcesComponents) $(params.eicRestrictedResourcesComponents)"

    # Step 0.2: Wait for the ELM zip of each Edge Node (first pass; the EIC zips
    #           can only be downloaded after the Edge Nodes are registered with
    #           the kubeconfigs of Step 8, see wait-eic-zips). The log shows the
    #           upload plan of prepare-restricted-resources-prefix.
    - name: wait-elm-zips
      runAfter: [prepare-restricted-resources-prefix]
      taskRef: { name: ossm3-wait-for-restricted-resources }
      params:
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: components
          value: $(params.elmRestrictedResourcesComponents)
        - name: instructions
          value: |
            Multi-stack (2 Edge Nodes, dedicated mesh each), cluster $(params.hostedClusterName), first pass:
            in Edge Lifecycle Management, add both Edge Nodes with restricted access and upload each ELM
            restricted-resources zip as downloaded, one per folder (latest version per folder wins):
              Edge Node 1: elm-1/ (ELM namespace edgelm-1)
              Edge Node 2: elm-2/ (ELM namespace edgelm-2)
            Minimum releases (KBA 7149262, multiple Edge Nodes on one cluster): ELM 1.64, EIC 8.48.
            Every SAP namespace of Edge Node N must be named with the -N suffix in ELM.
            The EIC zips (edge-icell-1/, edge-icell-2/) come later, after both Edge Nodes are
            registered (wait-eic-zips); zips already in those folders are applied in the second pass.
            $(tasks.prepare-restricted-resources-prefix.results.uploadPlan)

    # Step 1: Clone repository
    - name: fetch-repository
      taskRef: { name: git-clone }
      params:
        - name: url
          value: $(params.repoUrl)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source

    # Step 2: Create HostedCluster and NodePool
    - name: create-hosted-cluster
      runAfter: [fetch-repository, preflight-check]
      taskRef: { name: hcp-create-hosted-cluster }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: releaseImage
          value: $(params.releaseImage)
        - name: nodePoolReplicas
          value: $(params.nodePoolReplicas)
        - name: nodePoolCpuCores
          value: $(params.nodePoolCpuCores)
        - name: nodePoolMemoryGB
          value: $(params.nodePoolMemoryGB)
        - name: rootDiskSizeGB
          value: $(params.rootDiskSizeGB)
        - name: pullSecretName
          value: $(params.pullSecretName)
        - name: etcdStorageClass
          value: $(params.etcdStorageClass)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 3: Wait for cluster to be ready
    - name: wait-cluster-ready
      runAfter: [create-hosted-cluster]
      taskRef: { name: hcp-wait-cluster-ready }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: timeoutMinutes
          value: "90"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 3.5: Create NFS StorageClass (nfs-rwx) on the hosted cluster
    - name: create-nfs-storageclass
      runAfter: [wait-cluster-ready]
      taskRef: { name: hcp-create-nfs-storageclass }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: nfsPersistenceSize
          value: $(params.nfsPersistenceSize)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # =============================================
    # Phase 2: OSSM3 Multi-Stack Mesh Setup (one control plane per Edge Node)
    # =============================================

    # Step 4: Verify Service Mesh 3.x operators on hosted cluster
    - name: verify-operators
      runAfter: [create-nfs-storageclass]
      taskRef: { name: ossm3-verify-operators }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: ossm3Channel
          value: $(params.ossm3Channel)
      workspaces:
        - name: source
          workspace: source

    # Step 5: Download and apply the ELM restricted-access resources of both Edge
    #         Nodes (first pass): creates edgelm-N and applies CRDs, ClusterRoles,
    #         RoleBindings, etc. The EIC bundles follow in apply-rbac-eic.
    - name: apply-rbac-elm
      runAfter: [verify-operators, wait-elm-zips]
      taskRef: { name: ossm3-download-and-apply-rbac }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: requiredComponents
          value: $(params.elmRestrictedResourcesComponents)
      workspaces:
        - name: source
          workspace: source

    # Step 6: Configure one dedicated SAP Service Mesh per Edge Node stack
    #         Discovers and validates the stacks (SAP namespaces ending in -N, one
    #         edgelm-N and one edgelm.sap.com/edge-node-id per stack; after the
    #         first pass only edgelm-N exists), checks that
    #         no existing Istio already selects a planned discovery value, creates
    #         IstioCNI once and, per stack N, istio-system-sap-edge-N with Istio
    #         sap-mesh-istio-N (discoverySelectors istio-discovery=sap-edge-mesh-N)
    #         and the proxy ServiceEntry in edgelm-N, then waits until each is Ready.
    #         Mesh before namespace labels (reverse of the dedicated pipeline):
    #         the injection revision is read from the running control plane.
    - name: configure-multi-stack-mesh
      runAfter: [apply-rbac-elm]
      taskRef: { name: ossm3-configure-multi-stack-mesh }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: proxySecretName
          value: $(params.hubClusterName)-proxy-config
      workspaces:
        - name: source
          workspace: source

    # Step 7: Assign each stack's SAP namespaces to its own mesh, with SCC annotations
    #         Per stack N: istio-discovery=sap-edge-mesh-N on every namespace (secrets
    #         included), istio.io/rev=<active revision of mesh N> on workload
    #         namespaces (never on secrets), istio-injection removed, SCC per role.
    #         Prints the KBA 7149262 verification view (edge-node-id, discovery, rev).
    #         First pass: edgelm-N only, before ELM starts its pods; the EIC
    #         namespaces follow in prepare-namespaces-multi-stack-eic.
    - name: prepare-namespaces-multi-stack
      runAfter: [configure-multi-stack-mesh]
      taskRef: { name: ossm3-prepare-namespaces-multi-stack }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 8: Generate one SA-based restricted kubeconfig per Edge Node for ELM
    #         registration (parallel; SA taken from the bundle's RBAC in edgelm-N,
    #         Secret edgelm-kubeconfig-generated-<cluster>-N, workspace file
    #         edgelm-N-kubeconfig)
    # --- Stack 1 (Edge Node 1, edgelm-1) ---
    - name: stack1-generate-sa-based-kubeconfig
      runAfter: [prepare-namespaces-multi-stack]
      taskRef: { name: ossm3-generate-sa-based-kubeconfig }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: elmNamespace
          value: edgelm-1
        - name: generatedSecretName
          value: "edgelm-kubeconfig-generated-$(params.hostedClusterName)-1"
      workspaces:
        - name: source
          workspace: source

    # --- Stack 2 (Edge Node 2, edgelm-2) ---
    - name: stack2-generate-sa-based-kubeconfig
      runAfter: [prepare-namespaces-multi-stack]
      taskRef: { name: ossm3-generate-sa-based-kubeconfig }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: elmNamespace
          value: edgelm-2
        - name: generatedSecretName
          value: "edgelm-kubeconfig-generated-$(params.hostedClusterName)-2"
      workspaces:
        - name: source
          workspace: source

    # =============================================
    # Phase 3: Deploy EIC Services (after both per-stack kubeconfigs)
    #   Shared PostgreSQL for all cells; one Redis/Valkey per EIC cell
    #   (instance eic-N -> namespace sap-eic-external-<datastore>-eic-N).
    #   Cell N = EIC edge-icell-N on Edge Node N; both cells always run.
    #   Ready before wait-eic-zips: deploying EIC in ELM needs these credentials.
    # =============================================

    # Step 9: Deploy PostgreSQL on hosted cluster (shared by all EIC cells,
    #         parallel with Redis/Valkey)
    - name: deploy-postgres
      runAfter: [stack1-generate-sa-based-kubeconfig, stack2-generate-sa-based-kubeconfig]
      taskRef: { name: hcp-deploy-postgres }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: postgresVersion
          value: $(params.postgresVersion)
        - name: postgresHA
          value: $(params.postgresHA)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 9a: Deploy Redis per EIC cell (instance eic-N -> sap-eic-external-redis-eic-N;
    #           parallel with PostgreSQL, when datastoreType=redis)
    - name: cell1-deploy-redis
      runAfter: [stack1-generate-sa-based-kubeconfig, stack2-generate-sa-based-kubeconfig]
      when:
        - input: "$(params.datastoreType)"
          operator: in
          values: ["redis"]
      taskRef: { name: hcp-deploy-redis }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: redisClusterType
          value: $(params.redisClusterType)
        - name: instance
          value: eic-1
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # cell2-deploy-redis also waits for cell1-deploy-redis: both apply the same
    # cluster-scoped Redis Enterprise SCC, and two concurrent creates can fail
    # with AlreadyExists. Valkey installs only namespaced objects and stays parallel.
    - name: cell2-deploy-redis
      runAfter:
        - stack1-generate-sa-based-kubeconfig
        - stack2-generate-sa-based-kubeconfig
        - cell1-deploy-redis
      when:
        - input: "$(params.datastoreType)"
          operator: in
          values: ["redis"]
      taskRef: { name: hcp-deploy-redis }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: redisClusterType
          value: $(params.redisClusterType)
        - name: instance
          value: eic-2
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 9b: Deploy Valkey per EIC cell (instance eic-N -> sap-eic-external-valkey[-cluster]-eic-N;
    #           parallel with PostgreSQL, when datastoreType=valkey-*)
    - name: cell1-deploy-valkey
      runAfter: [stack1-generate-sa-based-kubeconfig, stack2-generate-sa-based-kubeconfig]
      when:
        - input: "$(params.datastoreType)"
          operator: in
          values: ["valkey-standalone", "valkey-cluster"]
      taskRef: { name: hcp-deploy-valkey }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: datastoreType
          value: $(params.datastoreType)
        - name: instance
          value: eic-1
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    - name: cell2-deploy-valkey
      runAfter: [stack1-generate-sa-based-kubeconfig, stack2-generate-sa-based-kubeconfig]
      when:
        - input: "$(params.datastoreType)"
          operator: in
          values: ["valkey-standalone", "valkey-cluster"]
      taskRef: { name: hcp-deploy-valkey }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: datastoreType
          value: $(params.datastoreType)
        - name: instance
          value: eic-2
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 10: Get all credentials per EIC cell and display them
    #          (shared PostgreSQL + the cell's own Redis/Valkey). Each cell stores
    #          them in Secret eic-credentials-hcp-<cluster>-eic-N together with
    #          the restricted kubeconfig of its own Edge Node (edgelm-N-kubeconfig).
    - name: cell1-get-all-accesses
      runAfter: [deploy-postgres, cell1-deploy-redis, cell1-deploy-valkey]
      taskRef: { name: hcp-get-all-accesses }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: datastoreType
          value: $(params.datastoreType)
        - name: instance
          value: eic-1
        - name: elmKubeconfigFile
          value: edgelm-1-kubeconfig
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    - name: cell2-get-all-accesses
      runAfter: [deploy-postgres, cell2-deploy-redis, cell2-deploy-valkey]
      taskRef: { name: hcp-get-all-accesses }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: datastoreType
          value: $(params.datastoreType)
        - name: instance
          value: eic-2
        - name: elmKubeconfigFile
          value: edgelm-2-kubeconfig
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # =============================================
    # Phase 3b: EIC restricted resources (second pass)
    #   Register both Edge Nodes with their kubeconfigs, deploy EIC in ELM,
    #   upload the EIC zips; the pipeline applies them and puts the EIC
    #   namespaces on their stack's mesh.
    # =============================================

    # Step 11: Wait for the EIC zip of each Edge Node (log: what to do in ELM
    #          and the upload plan). After the credentials, which deploying
    #          EIC in ELM needs.
    - name: wait-eic-zips
      runAfter: [cell1-get-all-accesses, cell2-get-all-accesses]
      taskRef: { name: ossm3-wait-for-restricted-resources }
      params:
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: components
          value: $(params.eicRestrictedResourcesComponents)
        - name: instructions
          value: |
            Multi-stack (2 Edge Nodes, dedicated mesh each), cluster $(params.hostedClusterName), second pass:
            the ELM resources of both Edge Nodes are applied, both meshes are running, and PostgreSQL
            and the per-cell Redis/Valkey are deployed. Kubeconfig and credential Secrets are in the
            pipeline namespace.
            1. Register each Edge Node in ELM with its own restricted kubeconfig (check "Restricted Access";
               never register both with the same one):
                 Edge Node 1: Secret edgelm-kubeconfig-generated-$(params.hostedClusterName)-1
                 Edge Node 2: Secret edgelm-kubeconfig-generated-$(params.hostedClusterName)-2
               With a proxy, select "Enable HTTP Proxy" and use the $(params.hubClusterName)-proxy-config Secret.
            2. Deploy EIC N on Edge Node N: host eic-N.<ingress domain of the hosted cluster>, gateway
               istio-gateways-N, the shared PostgreSQL and the cell's own Redis/Valkey (credentials in the
               cellN-get-all-accesses logs and Secret eic-credentials-hcp-$(params.hostedClusterName)-eic-N).
            3. Upload each EIC restricted-resources zip as downloaded, one per folder:
                 Edge Node 1: edge-icell-1/ (edge-icell-1, edge-icell-secrets-1, edge-icell-ela-1,
                                             edge-icell-services-1, istio-gateways-1)
                 Edge Node 2: edge-icell-2/ (edge-icell-2, edge-icell-secrets-2, edge-icell-ela-2,
                                             edge-icell-services-2, istio-gateways-2)
            Confirm the EIC resources as applied in ELM only once approval-elm-eic-iflow-deployed is
            waiting: apply-rbac-eic and prepare-namespaces-multi-stack-eic run first, so the EIC pods
            start with their sidecars.
            $(tasks.prepare-restricted-resources-prefix.results.uploadPlan)

    # Step 11a: Download and apply the EIC restricted-access resources of both
    #           Edge Nodes (second pass: edge-icell-N, ..., istio-gateways-N)
    - name: apply-rbac-eic
      runAfter: [wait-eic-zips]
      taskRef: { name: ossm3-download-and-apply-rbac }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: requiredComponents
          value: $(params.eicRestrictedResourcesComponents)
      workspaces:
        - name: source
          workspace: source

    # Step 11b: Assign the new EIC namespaces to their stack's mesh (same task as
    #           Step 7; re-checks that each stack's namespaces share one
    #           edgelm.sap.com/edge-node-id, relabels edgelm-N unchanged)
    - name: prepare-namespaces-multi-stack-eic
      runAfter: [apply-rbac-eic]
      taskRef: { name: ossm3-prepare-namespaces-multi-stack }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 11c: Enable User Workload Monitoring once all SAP namespaces exist
    #           discoverNamespaces: find the EIC and ELM namespaces of both stacks
    #           by label (the NetworkPolicies go only into existing namespaces)
    - name: enable-monitoring
      runAfter: [prepare-namespaces-multi-stack-eic]
      taskRef: { name: hcp-enable-monitoring }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: discoverNamespaces
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # =============================================
    # Phase 4: Manual ELM/EIC Deployment + Tests (per EIC cell)
    # =============================================

    # Step 12: Manual approval after confirming the EIC resources in ELM and
    #          deploying iFlows on each EIC cell (both cells)
    - name: approval-elm-eic-iflow-deployed
      runAfter: [prepare-namespaces-multi-stack-eic, enable-monitoring]
      taskRef:
        apiVersion: openshift-pipelines.org/v1alpha1
        kind: ApprovalTask
      params:
        - name: approvers
          value:
            - mjiao
            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            Multi-stack (2 Edge Nodes, dedicated mesh each): one OSSM3 mesh per Edge Node, one restricted
            kubeconfig per Edge Node, shared PostgreSQL and per-cell Redis/Valkey deployed successfully.
            The restricted resources were applied in two passes (ELM first, then EIC after the Edge Nodes
            were registered) and every SAP namespace is assigned to its Edge Node's mesh.
            Credentials have been displayed (cell1-/cell2-get-all-accesses logs) and stored per cell in
            Secrets 'eic-credentials-hcp-$(params.hostedClusterName)-eic-1' and
            'eic-credentials-hcp-$(params.hostedClusterName)-eic-2' (pipeline namespace).

            Cluster: $(params.hostedClusterName)
            Namespace: $(params.hostedClusterNamespace)
            Workers: $(params.nodePoolReplicas) x ($(params.nodePoolCpuCores) vCPU, $(params.nodePoolMemoryGB)GB RAM)
            Proxy: see $(params.hubClusterName)-proxy-config secret
            Datastore: $(params.datastoreType)

            Per-Edge-Node targets (<ingress domain> = ingress domain of the hosted cluster;
            kubeconfig Secrets are in the pipeline namespace):
            Edge Node 1 (stack 1):
              - ELM namespace: edgelm-1
              - Restricted kubeconfig: Secret 'edgelm-kubeconfig-generated-$(params.hostedClusterName)-1'
              - Mesh: istio-system-sap-edge-1/sap-mesh-istio-1 (discovery istio-discovery=sap-edge-mesh-1)
              - EIC 1 (edge-icell-1) host: eic-1.<ingress domain>
              - Gateway namespace: istio-gateways-1 (istio-ingressgateway)
              - Redis/Valkey namespace: sap-eic-external-redis-eic-1 (redis),
                sap-eic-external-valkey-eic-1 (valkey-standalone) or
                sap-eic-external-valkey-cluster-eic-1 (valkey-cluster)
              - PostgreSQL: shared instance (same for both Edge Nodes)
            Edge Node 2 (stack 2):
              - ELM namespace: edgelm-2
              - Restricted kubeconfig: Secret 'edgelm-kubeconfig-generated-$(params.hostedClusterName)-2'
              - Mesh: istio-system-sap-edge-2/sap-mesh-istio-2 (discovery istio-discovery=sap-edge-mesh-2)
              - EIC 2 (edge-icell-2) host: eic-2.<ingress domain>
              - Gateway namespace: istio-gateways-2 (istio-ingressgateway)
              - Redis/Valkey namespace: sap-eic-external-redis-eic-2 (redis),
                sap-eic-external-valkey-eic-2 (valkey-standalone) or
                sap-eic-external-valkey-cluster-eic-2 (valkey-cluster)
              - PostgreSQL: shared instance (same for both Edge Nodes)

            Please complete the following manually (Edge Node registration, EIC deployment and the EIC
            zip upload happened before this gate, see wait-eic-zips):
            1. In ELM, confirm the EIC restricted resources of both Edge Nodes as applied (apply-rbac-eic
               applied them, prepare-namespaces-multi-stack-eic put the EIC namespaces on their meshes)
               and wait until EIC 1 and EIC 2 are deployed
            2. Deploy iFlows for testing on each EIC cell
            3. After each resource download, re-run label cleanup for that Edge Node only
               (<id> = its edgelm.sap.com/edge-node-id, shown by
               oc get namespace edgelm-1 edgelm-2 -L edgelm.sap.com/edge-node-id):
                 oc label namespace -l edgelm.sap.com/edge-node-id=<id> istio-injection-
               Do not select by edgelm.sap.com/product=edgelm here: it spans both Edge Nodes.

            After deployment is complete and istio-ingressgateway in each istio-gateways-N has a LoadBalancer IP:
            APPROVE: Continue with per-cell ConfigMap creation and endpoint tests
            REJECT: Skip tests and proceed to teardown
        - name: numberOfApprovalsRequired
          value: '1'
        - name: timeout
          value: '336h'

    # Step 13: Verify monitoring (ServiceMonitors and Prometheus targets, all cells)
    - name: verify-monitoring
      runAfter: [approval-elm-eic-iflow-deployed]
      taskRef: { name: hcp-verify-monitoring }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: discoverNamespaces
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # Step 14-16 (per cell): ConfigMap -> EndpointSlice fix -> Route
    #   14: Validate and create ConfigMap cluster-info-hcp-<cluster>-N (host eic-N.<domain>)
    #   15: Fix EndpointSlice for Hypershift KubeVirt OCP 4.21 bug on the cell's
    #       gateway service (service-sync may fail to create EndpointSlices for
    #       LoadBalancer services, breaking MetalLB routing)
    #   16: Create OpenShift Route for the cell's EIC (passthrough TLS) and
    #       ConfigMap route-info-hcp-<cluster>-N

    # --- Cell 1 (Edge Node 1: edge-icell-1, istio-gateways-1) ---
    - name: cell1-validate-and-create-configmap
      runAfter: [approval-elm-eic-iflow-deployed]
      taskRef: { name: hcp-validate-and-create-configmap }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: gatewayNamespace
          value: istio-gateways-1
        - name: hostPrefix
          value: eic-1
        - name: configMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-1"
      workspaces:
        - name: source
          workspace: source

    - name: cell1-fix-endpointslice
      runAfter: [cell1-validate-and-create-configmap, verify-monitoring]
      taskRef: { name: hcp-fix-endpointslice }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: guestServiceNamespace
          value: istio-gateways-1
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    - name: cell1-create-eic-route
      runAfter: [cell1-fix-endpointslice]
      taskRef: { name: hcp-create-eic-route }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: gatewayNamespace
          value: istio-gateways-1
        - name: hostPrefix
          value: eic-1
        - name: routeConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)-1"
      workspaces:
        - name: source
          workspace: source

    # --- Cell 2 (Edge Node 2: edge-icell-2, istio-gateways-2) ---
    - name: cell2-validate-and-create-configmap
      runAfter: [approval-elm-eic-iflow-deployed]
      taskRef: { name: hcp-validate-and-create-configmap }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: gatewayNamespace
          value: istio-gateways-2
        - name: hostPrefix
          value: eic-2
        - name: configMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-2"
      workspaces:
        - name: source
          workspace: source

    - name: cell2-fix-endpointslice
      runAfter: [cell2-validate-and-create-configmap, verify-monitoring]
      taskRef: { name: hcp-fix-endpointslice }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: guestServiceNamespace
          value: istio-gateways-2
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    - name: cell2-create-eic-route
      runAfter: [cell2-fix-endpointslice]
      taskRef: { name: hcp-create-eic-route }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: gatewayNamespace
          value: istio-gateways-2
        - name: hostPrefix
          value: eic-2
        - name: routeConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)-2"
      workspaces:
        - name: source
          workspace: source

    # Step 17: Endpoint Tests round 1, per cell (parallel, staggered start delays)
    # NOTE: httpbinipfilter has an IP filter policy. The hub and managed cluster
    # pod CIDRs must be whitelisted in the iFlow's IP filter settings (each cell).
    # --- Round 1, cell 1 (cluster-info-hcp-<cluster>-1) ---
    - name: cell1-test-httpbinipfilter
      runAfter: [cell1-fix-endpointslice, cell1-create-eic-route]
      when:
        - input: "$(params.testHttpbinipfilter)"
          operator: in
          values: ["true"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /httpbinipfilter
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: startDelay
          value: "2"
      workspaces:
        - name: source
          workspace: source

    - name: cell1-test-http-test1
      runAfter: [cell1-fix-endpointslice, cell1-create-eic-route]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/test1
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: startDelay
          value: "4"
      workspaces:
        - name: source
          workspace: source

    - name: cell1-test-http-testelster
      runAfter: [cell1-fix-endpointslice, cell1-create-eic-route]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/testelster
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: startDelay
          value: "6"
      workspaces:
        - name: source
          workspace: source

    - name: cell1-test-slvredis
      runAfter: [cell1-fix-endpointslice, cell1-create-eic-route]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    - name: cell1-test-ratelimit-slvredis
      runAfter: [cell1-test-slvredis]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskRef: { name: rate-limit-test }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Cooldown after cell 1's rate-limit test to let the rate limiter window recover
    - name: cell1-cooldown-after-round1
      runAfter: [cell1-test-ratelimit-slvredis]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskSpec:
        steps:
          - name: cooldown
            image: registry.access.redhat.com/ubi9/ubi-minimal
            script: |
              echo "⏳ Cooling down for 30s to let rate limiter recover..."
              sleep 30
              echo "✅ Cooldown complete."

    # --- Round 1, cell 2 (cluster-info-hcp-<cluster>-2) ---
    - name: cell2-test-httpbinipfilter
      runAfter: [cell2-fix-endpointslice, cell2-create-eic-route]
      when:
        - input: "$(params.testHttpbinipfilter)"
          operator: in
          values: ["true"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /httpbinipfilter
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-2"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: startDelay
          value: "2"
      workspaces:
        - name: source
          workspace: source

    - name: cell2-test-http-test1
      runAfter: [cell2-fix-endpointslice, cell2-create-eic-route]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/test1
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-2"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: startDelay
          value: "4"
      workspaces:
        - name: source
          workspace: source

    - name: cell2-test-http-testelster
      runAfter: [cell2-fix-endpointslice, cell2-create-eic-route]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/testelster
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-2"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: startDelay
          value: "6"
      workspaces:
        - name: source
          workspace: source

    - name: cell2-test-slvredis
      runAfter: [cell2-fix-endpointslice, cell2-create-eic-route]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-2"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
