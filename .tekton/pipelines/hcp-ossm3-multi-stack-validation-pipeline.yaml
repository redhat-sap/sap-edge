              echo "⏳ Cooling down for 30s to let rate limiter recover..."
              sleep 30
              echo "✅ Cooldown complete."

    # Step 20: Manual approval before Route-based tests (round 3, waits for both cells)
    - name: approval-route-test-round
      runAfter:
        - cell1-test-httpbinipfilter-round2
        - cell1-test-http-test1-round2
        - cell1-test-http-testelster-round2
        - cell1-test-slvredis-round2
        - cell1-cooldown-after-round2
        - cell2-test-httpbinipfilter-round2
        - cell2-test-http-test1-round2
        - cell2-test-http-testelster-round2
        - cell2-test-slvredis-round2
        - cell2-cooldown-after-round2
      taskRef:
        apiVersion: openshift-pipelines.org/v1alpha1
        kind: ApprovalTask
      params:
        - name: approvers
          value:
            - mjiao
            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            Second round of endpoint tests completed successfully for every EIC cell.
            Now ready to run Route-based endpoint tests (round 3).

            Route-based tests will send traffic through the OpenShift Router
            (HAProxy passthrough) instead of directly to the LoadBalancer IP.

            Cluster: $(params.hostedClusterName)
            Mesh: multi-stack (2 Edge Nodes, dedicated mesh each):
              istio-system-sap-edge-1/sap-mesh-istio-1, istio-system-sap-edge-2/sap-mesh-istio-2
            Edge Node 1, cell 1 (edge-icell-1): Route eic-1.<ingress domain> in istio-gateways-1, ConfigMap route-info-hcp-$(params.hostedClusterName)-1
            Edge Node 2, cell 2 (edge-icell-2): Route eic-2.<ingress domain> in istio-gateways-2, ConfigMap route-info-hcp-$(params.hostedClusterName)-2

            ✅ APPROVE: Run Route-based endpoint tests (both cells)
            ❌ REJECT: Skip Route tests and proceed
        - name: numberOfApprovalsRequired
          value: '1'
        - name: timeout
          value: '336h'

    # Step 21: Route-based Endpoint Tests (round 3, via OpenShift Route, per cell, staggered)
    # --- Round 3 (Route), cell 1 (route-info-hcp-<cluster>-1) ---
    - name: cell1-test-httpbinipfilter-route
      runAfter: [approval-route-test-round]
      when:
        - input: "$(params.testHttpbinipfilter)"
          operator: in
          values: ["true"]
      taskRef: { name: endpoint-tests-expected-status }
      params:
        - name: endpointPath
          value: /httpbinipfilter
        - name: expectedStatus
          value: "200"
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: startDelay
          value: "2"
      workspaces:
        - name: source
          workspace: source

    - name: cell1-test-http-test1-route
      runAfter: [approval-route-test-round]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/test1
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: startDelay
          value: "4"
      workspaces:
        - name: source
          workspace: source

    - name: cell1-test-http-testelster-route
      runAfter: [approval-route-test-round]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/testelster
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: startDelay
          value: "6"
      workspaces:
        - name: source
          workspace: source

    - name: cell1-test-slvredis-route
      runAfter: [approval-route-test-round]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    - name: cell1-test-ratelimit-slvredis-route
      runAfter: [cell1-test-slvredis-route]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskRef: { name: rate-limit-test }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # --- Round 3 (Route), cell 2 (route-info-hcp-<cluster>-2) ---
    - name: cell2-test-httpbinipfilter-route
      runAfter: [approval-route-test-round]
      when:
        - input: "$(params.testHttpbinipfilter)"
          operator: in
          values: ["true"]
      taskRef: { name: endpoint-tests-expected-status }
      params:
        - name: endpointPath
          value: /httpbinipfilter
        - name: expectedStatus
          value: "200"
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)-2"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: startDelay
          value: "2"
      workspaces:
        - name: source
          workspace: source

    - name: cell2-test-http-test1-route
      runAfter: [approval-route-test-round]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/test1
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)-2"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: startDelay
          value: "4"
      workspaces:
        - name: source
          workspace: source

    - name: cell2-test-http-testelster-route
      runAfter: [approval-route-test-round]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/testelster
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)-2"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: startDelay
          value: "6"
      workspaces:
        - name: source
          workspace: source

    - name: cell2-test-slvredis-route
      runAfter: [approval-route-test-round]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)-2"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    - name: cell2-test-ratelimit-slvredis-route
      runAfter: [cell2-test-slvredis-route]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskRef: { name: rate-limit-test }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)-2"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 22: Update Jira with test results (after both cells' Route-round tests)
    - name: update-jira-test-results
      runAfter:
        - cell1-test-httpbinipfilter-route
        - cell1-test-http-test1-route
        - cell1-test-http-testelster-route
        - cell1-test-slvredis-route
        - cell1-test-ratelimit-slvredis-route
        - cell2-test-httpbinipfilter-route
        - cell2-test-http-test1-route
        - cell2-test-http-testelster-route
        - cell2-test-slvredis-route
        - cell2-test-ratelimit-slvredis-route
      when:
        - input: "$(params.jiraIssueKey)"
          operator: notin
          values: [""]
      taskRef:
        name: jira-add-comment-custom
      params:
        - name: jiraSecretName
          value: $(params.jiraSecretName)
        - name: jiraIssueKey
          value: $(params.jiraIssueKey)
        - name: comment
          value: |
            h2. Complete EIC Validation Pipeline Completed (HCP KubeVirt + OSSM3, multi-stack (2 Edge Nodes, dedicated mesh each))

            HCP KubeVirt cluster, multi-stack (2 Edge Nodes, dedicated mesh each): two Edge Nodes, each with its own ELM, its own Edge Integration Cell and its own OSSM3 control plane, full EIC infrastructure and all automated endpoint tests completed successfully.

            *Infrastructure Configuration:*
            * *Cluster Name:* $(params.hostedClusterName)
            * *Namespace:* $(params.hostedClusterNamespace)
            * *Release Image:* $(params.releaseImage)
            * *Worker Nodes:* $(params.nodePoolReplicas) x ($(params.nodePoolCpuCores) vCPU, $(params.nodePoolMemoryGB)GB RAM)
            * *Service Mesh:* multi-stack (2 Edge Nodes, dedicated mesh each): istio-system-sap-edge-1 / sap-mesh-istio-1, istio-system-sap-edge-2 / sap-mesh-istio-2
            * *Corporate Proxy:* see $(params.hubClusterName)-proxy-config secret
            * *PostgreSQL:* $(params.postgresVersion) (Crunchy Operator, shared by all cells)
            * *Datastore:* $(params.datastoreType) (one instance per cell)

            *Edge Nodes:*
            * *Edge Node 1:* ELM namespace edgelm-1, mesh istio-system-sap-edge-1 / sap-mesh-istio-1, kubeconfig Secret edgelm-kubeconfig-generated-$(params.hostedClusterName)-1; cell 1 (edge-icell-1): host eic-1.<ingress domain>, gateway istio-gateways-1, datastore instance eic-1, ConfigMaps cluster-info-hcp-$(params.hostedClusterName)-1 / route-info-hcp-$(params.hostedClusterName)-1
            * *Edge Node 2:* ELM namespace edgelm-2, mesh istio-system-sap-edge-2 / sap-mesh-istio-2, kubeconfig Secret edgelm-kubeconfig-generated-$(params.hostedClusterName)-2; cell 2 (edge-icell-2): host eic-2.<ingress domain>, gateway istio-gateways-2, datastore instance eic-2, ConfigMaps cluster-info-hcp-$(params.hostedClusterName)-2 / route-info-hcp-$(params.hostedClusterName)-2

            *Pipeline Status:*
            * Repository cloned: Completed
            * HostedCluster deployment: Completed
            * OSSM3 operator verification: Completed
            * RBAC permissions: Completed
            * Service Mesh configuration (one control plane per Edge Node): Completed
            * Namespace preparation (per Edge Node mesh): Completed
            * Restricted kubeconfigs (one per Edge Node): Generated
            * PostgreSQL deployment (shared): Completed
            * Redis/Valkey deployment (per cell): Completed
            * Validation, ConfigMap and Route setup (per cell): Completed
            * Endpoint tests (3 rounds, per cell): All Passed

            *Executed Tests (Round 1 - LoadBalancer):*
            * Cell 1: cell1-test-httpbinipfilter, cell1-test-http-test1, cell1-test-http-testelster, cell1-test-slvredis, cell1-test-ratelimit-slvredis
            * Cell 2: cell2-test-httpbinipfilter, cell2-test-http-test1, cell2-test-http-testelster, cell2-test-slvredis, cell2-test-ratelimit-slvredis

            *Executed Tests (Round 2 - LoadBalancer):*
            * Cell 1: cell1-test-httpbinipfilter-round2, cell1-test-http-test1-round2, cell1-test-http-testelster-round2, cell1-test-slvredis-round2, cell1-test-ratelimit-slvredis-round2
            * Cell 2: cell2-test-httpbinipfilter-round2, cell2-test-http-test1-round2, cell2-test-http-testelster-round2, cell2-test-slvredis-round2, cell2-test-ratelimit-slvredis-round2

            *Executed Tests (Round 3 - OpenShift Route):*
            * Cell 1: cell1-test-httpbinipfilter-route, cell1-test-http-test1-route, cell1-test-http-testelster-route, cell1-test-slvredis-route, cell1-test-ratelimit-slvredis-route
            * Cell 2: cell2-test-httpbinipfilter-route, cell2-test-http-test1-route, cell2-test-http-testelster-route, cell2-test-slvredis-route, cell2-test-ratelimit-slvredis-route

            *Pipeline Details:*
            * *Repository:* $(params.repoUrl)
            * *Pull Request:* $(params.repoUrl)/pull/$(params.pullRequestNumber)
            * *Revision:* $(params.revision)
            * *Public DNS:* $(params.publicDNS)

            Ready for manual teardown approval.

    # =============================================
    # Phase 5: Teardown
    # =============================================

    # Step 23: Manual approval before teardown
    - name: approval-teardown
      runAfter:
        - update-jira-test-results
      taskRef:
        apiVersion: openshift-pipelines.org/v1alpha1
        kind: ApprovalTask
      params:
        - name: approvers
          value:
            - mjiao
            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            All endpoint tests completed. Please review results.

            Cluster: $(params.hostedClusterName)
            Mesh: multi-stack (2 Edge Nodes, dedicated mesh each):
              istio-system-sap-edge-1/sap-mesh-istio-1, istio-system-sap-edge-2/sap-mesh-istio-2

            APPROVE: Tear down HCP cluster and all resources
            REJECT: Keep cluster running (will timeout after 336h and teardown anyway)
        - name: numberOfApprovalsRequired
          value: '1'
        - name: timeout
          value: '336h'

    # Step 24: Teardown hosted cluster
    - name: teardown-hosted-cluster
      runAfter: [approval-teardown]
      when:
        - input: "$(params.skipTeardown)"
          operator: in
          values: ["false"]
      taskRef: { name: hcp-teardown }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: waitForDeletion
          value: "true"
        - name: timeoutMinutes
          value: "30"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source
