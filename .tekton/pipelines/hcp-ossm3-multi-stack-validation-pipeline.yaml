    # Step 22: Update Jira with test results (after both cells' Route-round tests)
    - name: update-jira-test-results
      runAfter:
        - cell1-test-httpbinipfilter-route
        - cell1-test-http-test1-route
        - cell1-test-http-testelster-route
        - cell1-test-slvredis-route
        - cell1-test-ratelimit-slvredis-route
        - cell2-test-httpbinipfilter-route
        - cell2-test-http-test1-route
        - cell2-test-http-testelster-route
        - cell2-test-slvredis-route
        - cell2-test-ratelimit-slvredis-route
      when:
        - input: "$(params.jiraIssueKey)"
          operator: notin
          values: [""]
