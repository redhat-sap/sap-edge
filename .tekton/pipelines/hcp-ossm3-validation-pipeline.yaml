apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: hcp-ossm3-validation-pipeline
  annotations:
    description: "Complete SAP Edge validation pipeline for HCP KubeVirt with OSSM3 restricted-access setup: creates hosted cluster, configures Service Mesh 3.x, applies the restricted-resources in two passes (ELM bundle first, EIC bundle after the Edge Node is registered), generates restricted kubeconfig, deploys PostgreSQL and Redis, runs endpoint tests, and tears down infrastructure"
spec:
  params:
    # --- Git parameters ---
    - name: repoUrl
      type: string
      description: "Git repository URL"
    - name: revision
      type: string
      description: "Git revision (branch/tag/commit)"
      default: "main"
    - name: pullRequestNumber
      type: string
      description: "Pull request number"
      default: ""

    # --- HCP cluster parameters ---
    - name: hostedClusterName
      type: string
      description: "Name of the hosted cluster"
    - name: hostedClusterNamespace
      type: string
      description: "Namespace for HostedCluster resources"
      default: "clusters"
    - name: releaseImage
      type: string
      description: "OCP release image for the hosted cluster"
      default: "quay.io/openshift-release-dev/ocp-release:4.15.0-x86_64"
    - name: nodePoolReplicas
      type: string
      description: "Number of worker nodes"
      default: "3"
    - name: nodePoolCpuCores
      type: string
      description: "vCPU cores per worker node"
      default: "16"
    - name: nodePoolMemoryGB
      type: string
      description: "RAM in GB per worker node"
      default: "32"
    - name: rootDiskSizeGB
      type: string
      description: "Root disk size in GB per worker node"
      default: "120"
    - name: pullSecretName
      type: string
      description: "Name of the Kubernetes Secret containing Red Hat pull secret"
      default: "redhat-pull-secret"
    - name: etcdStorageClass
      type: string
      description: "Storage class for etcd PVCs (leave empty for default)"
      default: ""
    - name: hubClusterName
      type: string
      description: "Name of the hub cluster (used to derive kubeconfig secret name: {hubClusterName}-kubeconfig)"
    - name: nfsPersistenceSize
      type: string
      description: "NFS server provisioner PVC pool size"
      default: "20Gi"

    # --- OSSM3 parameters ---
    - name: ossm3Channel
      type: string
      description: "OLM subscription channel for the OSSM3 operator"
      default: "stable-3.2"
    - name: obcName
      type: string
      description: "Name of the ObjectBucketClaim (OBC) for downloading restricted-access RBAC resources from S3"
      default: "sap-eic-restricted-cluster-config-resources"
    - name: s3Prefix
      type: string
      description: "S3 key prefix of this deployment's restricted-resources folders (e.g. restricted-resources/<hostedClusterName>/)"
      default: "restricted-resources/"
    - name: elmZipFolders
      type: string
      description: "ELM zip folder under s3Prefix. The pipeline creates it, waits until it holds a zip (wait-elm-zip) and applies only it in the first pass (apply-elm-resources)."
      default: "elm"
    - name: eicZipFolders
      type: string
      description: "EIC zip folder under s3Prefix (uploaded after the Edge Node is registered and EIC is deployed in ELM). The pipeline creates it, waits until it holds a zip (wait-eic-zip) and applies only it in the second pass (apply-eic-resources)."
      default: "edge-icell"
    # --- EIC services parameters ---
    - name: postgresVersion
      type: string
      description: "PostgreSQL version (v15/v16/v17)"
      default: "v15"
    - name: postgresHA
      type: string
      description: "Deploy PostgreSQL in HA mode (3 replicas with anti-affinity)"
      default: "true"
    - name: datastoreType
      type: string
      description: "Datastore type: redis, valkey-standalone, or valkey-cluster"
      default: "redis"
    - name: redisClusterType
      type: string
      description: "Redis cluster type (standard/ha) - only used when datastoreType=redis"
      default: "standard"

    # --- Endpoint test parameters ---
    - name: eicAuthSecretName
      type: string
      description: "EIC authentication secret name for endpoint tests"
    - name: publicDNS
      type: string
      description: "Use public DNS for endpoint tests"
      default: "false"

    # --- Jira parameters ---
    - name: jiraSecretName
      type: string
      description: "Name of the Kubernetes Secret containing Jira credentials"
      default: ""
    - name: jiraIssueKey
      type: string
      description: "Jira issue key to update with deployment results"
      default: ""

    # --- Logging parameters ---
    - name: lokiSize
      type: string
      description: "LokiStack size (1x.extra-small for test/validation, 1x.small for production)"
      default: "1x.extra-small"

    # --- Tracing parameters ---
    - name: istioNamespace
      type: string
      description: "Namespace where Istio control plane is deployed"
      default: "istio-system"
    - name: istioCRName
      type: string
      description: "Name of the Istio CR to patch with tracing extension providers"
      default: "default"

    # --- Pipeline control ---
    - name: sapBrowserMode
      type: string
      description: "disabled, review-registration, inspect, or run; manual approval is always retained"
      default: "disabled"
    - name: sapBrowserImage
      type: string
      description: "Set to the built SAP browser runner image before enabling sapBrowserMode"
      default: "sap-browser:dev"
    - name: sapElmUrl
      type: string
      description: "Direct SAP Edge Lifecycle Management HTTPS URL"
      default: ""
    - name: sapBrowserHA
      type: string
      description: "ELM high availability for registration review (independent of PostgreSQL HA)"
      default: "false"
    - name: sapBrowserFlow
      type: string
      description: "Reviewed .mjs flow path relative to hack/sap-browser, required for run mode"
      default: ""
    - name: sapBrowserSessionMinutes
      type: string
      description: "Total browser session deadline, including login and inspection (1-120 minutes)"
      default: "120"
    - name: sapBrowserLoginMinutes
      type: string
      description: "Interactive login deadline within the browser session"
      default: "30"
    - name: skipTeardown
      type: string
      description: "Skip the teardown step at the end"
      default: "false"
  workspaces:
    - name: source

  tasks:
    # =============================================
    # Phase 1: Create HCP KubeVirt Cluster
    # =============================================

    # Step 0: Pre-flight validation (runs in parallel with fetch-repository)
    - name: preflight-check
      taskRef: { name: ossm3-preflight-check }
      params:
        - name: obcName
          value: $(params.obcName)
        - name: pullSecretName
          value: $(params.pullSecretName)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig

    # Step 0.1: Create the S3 folders elm/ and edge-icell/ under s3Prefix and
    #           render upload instructions. Runs in parallel with cluster
    #           creation so the upload overlaps the cluster build. Earlier zips
    #           stay (no archive): a re-run reuses them, the latest version per
    #           folder wins.
    - name: prepare-restricted-resources-prefix
      runAfter: [preflight-check]
      taskRef: { name: ossm3-prepare-restricted-resources-prefix }
      params:
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: components
          value: "$(params.elmZipFolders) $(params.eicZipFolders)"

    # Step 0.2: Wait for the ELM zip (first pass; the EIC zip can only be
    #           downloaded after the Edge Node is registered with the kubeconfig
    #           of Step 8, see wait-eic-zip). The log shows the upload plan.
    - name: wait-elm-zip
      runAfter: [prepare-restricted-resources-prefix]
      taskRef: { name: ossm3-wait-for-restricted-resources }
      params:
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: components
          value: $(params.elmZipFolders)
        - name: instructions
          value: |
            Cluster $(params.hostedClusterName), first pass: in Edge Lifecycle Management, add the Edge Node
            with restricted access and upload its ELM restricted-resources zip as downloaded to the elm/
            folder (latest version wins). The EIC zip (edge-icell/) comes later, after the Edge Node is
            registered (wait-eic-zip); a zip already in that folder is applied in the second pass.
            $(tasks.prepare-restricted-resources-prefix.results.uploadPlan)

    # Step 1: Clone repository
    - name: fetch-repository
      taskRef: { name: git-clone }
      params:
        - name: url
          value: $(params.repoUrl)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source

    # Step 2: Create HostedCluster and NodePool
    - name: create-hosted-cluster
      runAfter: [fetch-repository, preflight-check]
      taskRef: { name: hcp-create-hosted-cluster }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: releaseImage
          value: $(params.releaseImage)
        - name: nodePoolReplicas
          value: $(params.nodePoolReplicas)
        - name: nodePoolCpuCores
          value: $(params.nodePoolCpuCores)
        - name: nodePoolMemoryGB
          value: $(params.nodePoolMemoryGB)
        - name: rootDiskSizeGB
          value: $(params.rootDiskSizeGB)
        - name: pullSecretName
          value: $(params.pullSecretName)
        - name: etcdStorageClass
          value: $(params.etcdStorageClass)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 3: Wait for cluster to be ready
    - name: wait-cluster-ready
      runAfter: [create-hosted-cluster]
      taskRef: { name: hcp-wait-cluster-ready }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: timeoutMinutes
          value: "90"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 3.5: Create NFS StorageClass (nfs-rwx) on the hosted cluster
    - name: create-nfs-storageclass
      runAfter: [wait-cluster-ready]
      taskRef: { name: hcp-create-nfs-storageclass }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: nfsPersistenceSize
          value: $(params.nfsPersistenceSize)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # =============================================
    # Phase 2: OSSM3 Restricted-Access Setup
    # =============================================

    # Step 4: Verify Service Mesh 3.x operators on hosted cluster
    - name: verify-operators
      runAfter: [create-nfs-storageclass]
      taskRef: { name: ossm3-verify-operators }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: ossm3Channel
          value: $(params.ossm3Channel)
      workspaces:
        - name: source
          workspace: source

    # Step 5: Download and apply the ELM restricted-access resources (first
    #         pass): creates edgelm and applies CRDs, ClusterRoles, RoleBindings,
    #         etc. The EIC bundle follows in apply-eic-resources.
    - name: apply-elm-resources
      runAfter: [verify-operators, wait-elm-zip]
      taskRef: { name: ossm3-download-and-apply-rbac }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: requiredComponents
          value: $(params.elmZipFolders)
      workspaces:
        - name: source
          workspace: source

    # Step 6: Prepare namespaces with labels and SCC annotations
    #         Runs after apply-elm-resources to re-apply correct annotations that may
    #         have been overridden by namespace definitions in the zip files.
    #         First pass: edgelm only; the EIC namespaces follow in prepare-namespaces-eic.
    - name: prepare-namespaces
      runAfter: [apply-elm-resources]
      taskRef: { name: ossm3-prepare-namespaces }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 7: Configure OpenShift Service Mesh 3.x (first pass: control plane,
    #         and edgelm joins the mesh before ELM starts its pods; the EIC
    #         namespaces follow in configure-mesh-eic)
    - name: configure-mesh
      runAfter: [prepare-namespaces]
      taskRef: { name: ossm3-configure-mesh }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 8: Generate SA-based restricted kubeconfig for ELM registration
    - name: generate-sa-based-kubeconfig
      runAfter: [configure-mesh]
      taskRef: { name: ossm3-generate-sa-based-kubeconfig }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # =============================================
    # Phase 3: Deploy EIC Services
    #   Ready before wait-eic-zip: deploying EIC in ELM needs these credentials.
    # =============================================

    # Step 10: Deploy PostgreSQL on hosted cluster (parallel with Redis)
    - name: deploy-postgres
      runAfter: [generate-sa-based-kubeconfig]
      taskRef: { name: hcp-deploy-postgres }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: postgresVersion
          value: $(params.postgresVersion)
        - name: postgresHA
          value: $(params.postgresHA)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 11a: Deploy Redis on hosted cluster (parallel with PostgreSQL, when datastoreType=redis)
    - name: deploy-redis
      runAfter: [generate-sa-based-kubeconfig]
      when:
        - input: "$(params.datastoreType)"
          operator: in
          values: ["redis"]
      taskRef: { name: hcp-deploy-redis }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: redisClusterType
          value: $(params.redisClusterType)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 11b: Deploy Valkey on hosted cluster (parallel with PostgreSQL, when datastoreType=valkey-*)
    - name: deploy-valkey
      runAfter: [generate-sa-based-kubeconfig]
      when:
        - input: "$(params.datastoreType)"
          operator: in
          values: ["valkey-standalone", "valkey-cluster"]
      taskRef: { name: hcp-deploy-valkey }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: datastoreType
          value: $(params.datastoreType)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 12a: Deploy LokiStack logging on hosted cluster (parallel with DB deployment)
    - name: deploy-logging
      runAfter: [generate-sa-based-kubeconfig]
      taskRef: { name: hcp-deploy-logging }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: lokiSize
          value: $(params.lokiSize)
      workspaces:
        - name: source
          workspace: source

    # Step 12b: Deploy distributed tracing on hosted cluster (parallel with DB deployment)
    - name: deploy-tracing
      runAfter: [generate-sa-based-kubeconfig]
      taskRef: { name: hcp-deploy-tracing }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: istioNamespace
          value: $(params.istioNamespace)
        - name: istioCRName
          value: $(params.istioCRName)
      workspaces:
        - name: source
          workspace: source

    # Step 12c: Deploy Perses dashboards on hosted cluster (parallel with DB deployment)
    - name: deploy-dashboards
      runAfter: [generate-sa-based-kubeconfig]
      taskRef: { name: hcp-deploy-dashboards }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 13: Get all credentials and display them
    - name: get-all-accesses
      runAfter: [deploy-postgres, deploy-redis, deploy-valkey, deploy-logging, deploy-tracing, deploy-dashboards]
      taskRef: { name: hcp-get-all-accesses }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: datastoreType
          value: $(params.datastoreType)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # =============================================
    # Phase 4: Manual ELM/EIC Deployment + Tests
    # =============================================

    # Optional browser session; a skipped task does not skip its runAfter dependents.
    # No retries: replaying a browser flow might duplicate SAP-side operations.
    - name: sap-browser
      runAfter: [get-all-accesses]
      when:
        - input: $(params.sapBrowserMode)
          operator: notin
          values: [disabled]
      timeout: "3h"
      taskRef: { name: hcp-sap-browser }
      params:
        - name: runnerImage
          value: $(params.sapBrowserImage)
        - name: mode
          value: $(params.sapBrowserMode)
        - name: elmUrl
          value: $(params.sapElmUrl)
        - name: pipelineRun
          value: $(context.pipelineRun.name)
        - name: pipelineRunUID
          value: $(context.pipelineRun.uid)
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: highAvailability
          value: $(params.sapBrowserHA)
        - name: flow
          value: $(params.sapBrowserFlow)
        - name: sessionMinutes
          value: $(params.sapBrowserSessionMinutes)
        - name: loginMinutes
          value: $(params.sapBrowserLoginMinutes)
      workspaces:
        - name: source
          workspace: source

    # Step 13a: Wait for the EIC zip (second pass; log: what to do in ELM and
    #           the upload plan). After the credentials, which deploying EIC in
    #           ELM needs, and after the optional browser session (skipped when
    #           disabled, which does not block).
    - name: wait-eic-zip
      runAfter: [get-all-accesses, sap-browser]
      taskRef: { name: ossm3-wait-for-restricted-resources }
      params:
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: components
          value: $(params.eicZipFolders)
        - name: instructions
          value: |
            Cluster $(params.hostedClusterName), second pass: the ELM resources are applied, the mesh is
            running, and PostgreSQL and Redis/Valkey are deployed (credentials in the get-all-accesses log).
            1. Register the cluster in ELM with the restricted kubeconfig in Secret
               edgelm-kubeconfig-generated-$(params.hostedClusterName) (pipeline namespace; check
               "Restricted Access").
            2. Deploy Edge Integration Cell (EIC) on that Edge Node.
            3. Upload the EIC restricted-resources zip as downloaded to the edge-icell/ folder.
            Confirm the EIC resources as applied in ELM only once approval-elm-eic-iflow-deployed is
            waiting: apply-eic-resources, prepare-namespaces-eic and configure-mesh-eic run first, so the
            EIC pods start with their sidecars.
            $(tasks.prepare-restricted-resources-prefix.results.uploadPlan)

    # Step 13b: Download and apply the EIC restricted-access resources (second pass)
    - name: apply-eic-resources
      runAfter: [wait-eic-zip]
      taskRef: { name: ossm3-download-and-apply-rbac }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: requiredComponents
          value: $(params.eicZipFolders)
      workspaces:
        - name: source
          workspace: source

    # Step 13c: Labels and SCC annotations for the EIC namespaces (same task as Step 6)
    - name: prepare-namespaces-eic
      runAfter: [apply-eic-resources]
      taskRef: { name: ossm3-prepare-namespaces }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 13d: The EIC namespaces join the mesh (same task as Step 7)
    - name: configure-mesh-eic
      runAfter: [prepare-namespaces-eic]
      taskRef: { name: ossm3-configure-mesh }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 13e: Enable User Workload Monitoring once the EIC namespaces exist
    #           (the NetworkPolicies go only into existing namespaces)
    - name: enable-monitoring
      runAfter: [configure-mesh-eic]
      taskRef: { name: hcp-enable-monitoring }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 13: Manual approval after confirming the EIC resources in ELM and
    #          deploying iFlows
    - name: approval-elm-eic-iflow-deployed
      runAfter: [configure-mesh-eic, enable-monitoring]
      taskRef:
        apiVersion: openshift-pipelines.org/v1alpha1
        kind: ApprovalTask
      params:
        - name: approvers
          value:
            - mjiao
            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            OSSM3 restricted-access setup, PostgreSQL and Redis deployed successfully.
            Credentials have been displayed. Restricted kubeconfig generated.
            The restricted resources were applied in two passes (ELM first, then EIC after the Edge Node
            was registered) and the EIC namespaces are on the mesh.

            Cluster: $(params.hostedClusterName)
            Namespace: $(params.hostedClusterNamespace)
            Workers: $(params.nodePoolReplicas) x ($(params.nodePoolCpuCores) vCPU, $(params.nodePoolMemoryGB)GB RAM)

            Restricted kubeconfig stored as Secret 'edgelm-kubeconfig-generated-$(params.hostedClusterName)'.

            Optional SAP browser mode: $(params.sapBrowserMode).
            Registration review and inspection modes do not verify deployment readiness.
            Confirm the following are complete (finish any remaining steps manually; registration,
            EIC deployment and the EIC zip upload happened before this gate, see wait-eic-zip):
            1. In ELM, confirm the EIC restricted resources as applied and wait until EIC is deployed
            2. Deploy iFlows for testing

            After deployment is complete and istio-ingressgateway has a LoadBalancer IP:
            APPROVE: Continue with ConfigMap creation and endpoint tests
            REJECT: Skip tests and proceed to teardown
        - name: numberOfApprovalsRequired
          value: '1'
        - name: timeout
          value: '336h'

    # Step 14: Verify monitoring (ServiceMonitors and Prometheus targets)
    - name: verify-monitoring
      runAfter: [approval-elm-eic-iflow-deployed]
      taskRef: { name: hcp-verify-monitoring }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 15: Validate and create ConfigMap for endpoint tests
    - name: validate-and-create-configmap
      runAfter: [approval-elm-eic-iflow-deployed]
      taskRef: { name: hcp-validate-and-create-configmap }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 16: Fix EndpointSlice for OCPBUGS-95615 (HyperShift KubeVirt)
    #          control-plane-operator puts both VMI IPs per endpoint; kube-proxy
    #          load-balances to the unreachable guest-cluster IP ~50% of the time.
    #          Must run before each LoadBalancer test round (CPO reconciles it back
    #          during long approval gates). Round 3 (Route-based) is unaffected.
    - name: fix-endpointslice
      runAfter: [validate-and-create-configmap]
      taskRef: { name: hcp-fix-endpointslice }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 17: Create OpenShift Route for EIC (passthrough TLS)
    - name: create-eic-route
      runAfter: [fix-endpointslice]
      taskRef: { name: hcp-create-eic-route }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 18: Endpoint Tests (sequential to avoid MetalLB flakiness on bare-metal KubeVirt)
    # NOTE: httpbinipfilter has an IP filter policy. The hub and managed cluster
    # pod CIDRs must be whitelisted in the iFlow's IP filter settings.
    - name: test-httpbinipfilter
      runAfter: [test-http-testelster]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /httpbinipfilter
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-http-test1
      runAfter: [fix-endpointslice, create-eic-route]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/test1
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-http-testelster
      runAfter: [test-http-test1]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/testelster
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-slvredis
      runAfter: [test-httpbinipfilter]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-ratelimit-slvredis
      runAfter: [test-slvredis]
      taskRef: { name: rate-limit-test }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    # Step 19: Manual approval before second round of tests
    - name: approval-second-test-round
      runAfter: [test-ratelimit-slvredis]
      taskRef:
        apiVersion: openshift-pipelines.org/v1alpha1
        kind: ApprovalTask
      params:
        - name: approvers
          value:
            - mjiao
            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            First round of endpoint tests completed successfully.

            Cluster: $(params.hostedClusterName)

            ✅ APPROVE: Run second round of endpoint tests
            ❌ REJECT: Skip second round and proceed
        - name: numberOfApprovalsRequired
          value: '1'
        - name: timeout
          value: '336h'

    # Step 20: Re-apply EndpointSlice fix before Round 2 (CPO may have reconciled
    #          dual IPs back during the approval gate — OCPBUGS-95615)
    - name: fix-endpointslice-round2
      runAfter: [approval-second-test-round]
      taskRef: { name: hcp-fix-endpointslice }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Second round of endpoint tests (LoadBalancer)
    - name: test-httpbinipfilter-round2
      runAfter: [test-http-testelster-round2]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /httpbinipfilter
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-http-test1-round2
      runAfter: [fix-endpointslice-round2]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/test1
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-http-testelster-round2
      runAfter: [test-http-test1-round2]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/testelster
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-slvredis-round2
      runAfter: [test-httpbinipfilter-round2]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    - name: test-ratelimit-slvredis-round2
      runAfter: [test-slvredis-round2]
      taskRef: { name: rate-limit-test }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
      workspaces:
        - name: source
          workspace: source

    # Step 21: Manual approval before Route-based tests (round 3)
    - name: approval-route-test-round
      runAfter: [test-ratelimit-slvredis-round2]
      taskRef:
        apiVersion: openshift-pipelines.org/v1alpha1
        kind: ApprovalTask
      params:
        - name: approvers
          value:
            - mjiao
            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            Second round of endpoint tests completed successfully.
            Now ready to run Route-based endpoint tests (round 3).

            Route-based tests will send traffic through the OpenShift Router
            (HAProxy passthrough) instead of directly to the LoadBalancer IP.

            Cluster: $(params.hostedClusterName)

            ✅ APPROVE: Run Route-based endpoint tests
            ❌ REJECT: Skip Route tests and proceed
        - name: numberOfApprovalsRequired
          value: '1'
        - name: timeout
          value: '336h'

    # Step 22: Route-based Endpoint Tests (round 3, via OpenShift Route)
    - name: test-httpbinipfilter-route
      runAfter: [test-http-testelster-route]
      taskRef: { name: endpoint-tests-expected-status }
      params:
        - name: endpointPath
          value: /httpbinipfilter
        - name: expectedStatus
          value: "200"
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
      workspaces:
        - name: source
          workspace: source

    - name: test-http-test1-route
      runAfter: [approval-route-test-round]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/test1
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
      workspaces:
        - name: source
          workspace: source

    - name: test-http-testelster-route
      runAfter: [test-http-test1-route]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /http/testelster
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
      workspaces:
        - name: source
          workspace: source

    - name: test-slvredis-route
      runAfter: [test-httpbinipfilter-route]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
      workspaces:
        - name: source
          workspace: source

    - name: test-ratelimit-slvredis-route
      runAfter: [test-slvredis-route]
      taskRef: { name: rate-limit-test }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "route-info-hcp-$(params.hostedClusterName)"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # Step 23: Update Jira with test results
    - name: update-jira-test-results
      runAfter: [test-ratelimit-slvredis-route]
      when:
        - input: "$(params.jiraIssueKey)"
          operator: notin
          values: [""]
      taskRef:
        name: jira-add-comment-custom
      params:
        - name: jiraSecretName
          value: $(params.jiraSecretName)
        - name: jiraIssueKey
          value: $(params.jiraIssueKey)
        - name: comment
          value: |
            h2. Complete EIC Validation Pipeline Completed (HCP KubeVirt + OSSM3)

            HCP KubeVirt cluster with OSSM3 restricted-access setup, full EIC infrastructure and all automated endpoint tests completed successfully.

            *Infrastructure Configuration:*
            * *Cluster Name:* $(params.hostedClusterName)
            * *Namespace:* $(params.hostedClusterNamespace)
            * *Release Image:* $(params.releaseImage)
            * *Worker Nodes:* $(params.nodePoolReplicas) x ($(params.nodePoolCpuCores) vCPU, $(params.nodePoolMemoryGB)GB RAM)
            * *PostgreSQL:* $(params.postgresVersion) (Crunchy Operator)
            * *Datastore:* $(params.datastoreType)

            *Pipeline Status:*
            * Repository cloned: Completed
            * HostedCluster deployment: Completed
            * OSSM3 operator verification: Completed
            * Namespace preparation: Completed
            * Service Mesh 3.x configuration: Completed
            * RBAC permissions (ELM bundle, then EIC bundle): Completed
            * Restricted kubeconfig: Generated
            * PostgreSQL deployment: Completed
            * Redis deployment: Completed
            * Validation and ConfigMap setup: Completed
            * Endpoint tests (3 rounds): All Passed

            *Executed Tests (Round 1 - LoadBalancer):*
            * test-httpbinipfilter
            * test-http-test1
            * test-http-testelster
            * test-slvredis
            * test-ratelimit-slvredis

            *Executed Tests (Round 2 - LoadBalancer):*
            * test-httpbinipfilter-round2
            * test-http-test1-round2
            * test-http-testelster-round2
            * test-slvredis-round2
            * test-ratelimit-slvredis-round2

            *Executed Tests (Round 3 - OpenShift Route):*
            * test-httpbinipfilter-route
            * test-http-test1-route
            * test-http-testelster-route
            * test-slvredis-route
            * test-ratelimit-slvredis-route

            *Pipeline Details:*
            * *Repository:* $(params.repoUrl)
            * *Pull Request:* $(params.repoUrl)/pull/$(params.pullRequestNumber)
            * *Revision:* $(params.revision)
            * *Public DNS:* $(params.publicDNS)

            Ready for manual teardown approval.

    # =============================================
    # Phase 5: Teardown
    # =============================================

    # Step 24: Manual approval before teardown
    - name: approval-teardown
      runAfter:
        - update-jira-test-results
      taskRef:
        apiVersion: openshift-pipelines.org/v1alpha1
        kind: ApprovalTask
      params:
        - name: approvers
          value:
            - mjiao
            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            All endpoint tests completed. Please review results.

            Cluster: $(params.hostedClusterName)

            APPROVE: Tear down HCP cluster and all resources
            REJECT: Keep cluster running (will timeout after 336h and teardown anyway)
        - name: numberOfApprovalsRequired
          value: '1'
        - name: timeout
          value: '336h'

    # Step 25: Teardown hosted cluster
    - name: teardown-hosted-cluster
      runAfter: [approval-teardown]
      when:
        - input: "$(params.skipTeardown)"
          operator: in
          values: ["false"]
      taskRef: { name: hcp-teardown }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: waitForDeletion
          value: "true"
        - name: timeoutMinutes
          value: "30"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source
