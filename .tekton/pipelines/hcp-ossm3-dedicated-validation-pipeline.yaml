    - name: cell2-test-ratelimit-slvredis-round2
      runAfter: [cell2-test-slvredis-round2]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
        - input: "$(params.cellCount)"
          operator: in
          values: ["2"]
      taskRef: { name: rate-limit-test }
      params:
        - name: endpointPath
