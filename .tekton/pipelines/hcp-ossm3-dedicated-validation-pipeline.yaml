    - name: cell2-test-slvredis
      runAfter: [cell2-fix-endpointslice, cell2-create-eic-route]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
        - input: "$(params.cellCount)"
          operator: in
          values: ["2"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-2"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
