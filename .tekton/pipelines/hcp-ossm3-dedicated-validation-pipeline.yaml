apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: hcp-ossm3-dedicated-validation-pipeline
  annotations:
    description: "Complete SAP Edge validation pipeline for HCP KubeVirt with a dedicated OSSM3 service mesh: creates hosted cluster, deploys an independent SAP mesh control plane (istio-system-sap-edge) with revision-based injection, applies RBAC, generates restricted kubeconfig, deploys a shared PostgreSQL and one Redis/Valkey per EIC cell (cellCount 1 or 2), runs per-cell endpoint tests, and tears down infrastructure"
spec:
  params:
    # --- Git parameters ---
    - name: repoUrl
      type: string
      description: "Git repository URL"
    - name: revision
      type: string
      description: "Git revision (branch/tag/commit)"
      default: "main"
    - name: pullRequestNumber
      type: string
      description: "Pull request number"
      default: ""

    # --- HCP cluster parameters ---
    - name: hostedClusterName
      type: string
      description: "Name of the hosted cluster"
    - name: hostedClusterNamespace
      type: string
      description: "Namespace for HostedCluster resources"
      default: "clusters"
    - name: releaseImage
      type: string
      description: "OCP release image for the hosted cluster"
      default: "quay.io/openshift-release-dev/ocp-release:4.15.0-x86_64"
    - name: nodePoolReplicas
      type: string
      description: "Number of worker nodes"
      default: "3"
    - name: nodePoolCpuCores
      type: string
      description: "vCPU cores per worker node"
      default: "16"
    - name: nodePoolMemoryGB
      type: string
      description: "RAM in GB per worker node"
      default: "32"
    - name: rootDiskSizeGB
      type: string
      description: "Root disk size in GB per worker node"
      default: "120"
    - name: pullSecretName
      type: string
      description: "Name of the Kubernetes Secret containing Red Hat pull secret"
      default: "redhat-pull-secret"
    - name: etcdStorageClass
      type: string
      description: "Storage class for etcd PVCs (leave empty for default)"
      default: ""
    - name: hubClusterName
      type: string
      description: "Name of the hub cluster (used to derive kubeconfig secret name: {hubClusterName}-kubeconfig)"
    - name: nfsPersistenceSize
      type: string
      description: "NFS server provisioner PVC pool size"
      default: "20Gi"

    # --- OSSM3 parameters ---
    - name: ossm3Channel
      type: string
      description: "OLM subscription channel for the OSSM3 operator"
      default: "stable-3.2"
    - name: obcName
      type: string
      description: "Name of the ObjectBucketClaim (OBC) for downloading restricted-access RBAC resources from S3"
      default: "sap-eic-restricted-cluster-config-resources"
    - name: s3Prefix
      type: string
      description: "S3 key prefix of this deployment's restricted-resources bundles (e.g. restricted-resources/multi-eic/)"
      default: "restricted-resources/"
    - name: restrictedResourcesComponents
      type: string
      description: "Space-separated component folders under s3Prefix, created by the pipeline and required to hold a zip before apply-rbac (e.g. 'elm edge-icell-1 edge-icell-2'). Empty = flat prefix."
      default: ""
    - name: cellCount
      type: string
      description: "Number of EIC cells to validate (2 = edge-icell-1 and edge-icell-2; 1 skips every cell2-* task)"
      default: "2"
    # --- Corporate proxy parameters ---
    # Proxy config is read from a Secret named {hubClusterName}-proxy-config
    # containing keys: PROXY_HOST, PROXY_PORT, PROXY_IP

    # --- EIC services parameters ---
    - name: postgresVersion
      type: string
      description: "PostgreSQL version (v15/v16/v17)"
      default: "v15"
    - name: postgresHA
      type: string
      description: "Deploy PostgreSQL in HA mode (3 replicas with anti-affinity)"
      default: "true"
    - name: datastoreType
      type: string
      description: "Datastore type: redis, valkey-standalone, or valkey-cluster"
      default: "redis"
    - name: redisClusterType
      type: string
      description: "Redis cluster type (standard/ha) - only used when datastoreType=redis"
      default: "standard"

    # --- Endpoint test parameters ---
    - name: eicAuthSecretName
      type: string
      description: "EIC authentication secret name for endpoint tests"
    - name: publicDNS
      type: string
      description: "Use public DNS for endpoint tests"
      default: "false"
    - name: testHttpbinipfilter
      type: string
      description: "Run httpbinipfilter endpoint tests (set false to skip)"
      default: "true"
    - name: testSlvredis
      type: string
      description: "Run slvredis endpoint and rate-limit tests (set false to skip)"
      default: "true"

    # --- Jira parameters ---
    - name: jiraSecretName
      type: string
      description: "Name of the Kubernetes Secret containing Jira credentials"
      default: ""
    - name: jiraIssueKey
      type: string
      description: "Jira issue key to update with deployment results"
      default: ""

    # --- Pipeline control ---
    - name: skipTeardown
      type: string
      description: "Skip the teardown step at the end"
      default: "false"
  workspaces:
    - name: source

  tasks:
    # =============================================
    # Phase 1: Create HCP KubeVirt Cluster
    # =============================================

    # Step 0: Pre-flight validation (runs in parallel with fetch-repository)
    - name: preflight-check
      taskRef: { name: ossm3-preflight-check }
      params:
        - name: obcName
          value: $(params.obcName)
        - name: pullSecretName
          value: $(params.pullSecretName)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig

    # Step 0.1: Create the per-component S3 folders (elm/, edge-icell-N/) under
    #           s3Prefix and render upload instructions. Runs in parallel with
    #           cluster creation so the upload overlaps the cluster build.
    - name: prepare-restricted-resources-prefix
      runAfter: [preflight-check]
      taskRef: { name: ossm3-prepare-restricted-resources-prefix }
      params:
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: components
          value: $(params.restrictedResourcesComponents)

    # Step 0.2: Manual approval once the restricted-resources bundles are uploaded
    #           (apply-rbac waits for this gate and for verify-operators)
    - name: approval-upload-restricted-resources
      runAfter: [prepare-restricted-resources-prefix]
      taskRef:
        apiVersion: openshift-pipelines.org/v1alpha1
        kind: ApprovalTask
      params:
        - name: approvers
          value:
            - mjiao
            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            Upload the restricted-resources zips for cluster $(params.hostedClusterName),
            one zip per folder as downloaded from SAP; apply-rbac unzips each one and
            runs its apply-restricted-resources.sh (latest version per folder wins).

            $(tasks.prepare-restricted-resources-prefix.results.uploadPlan)

            APPROVE: bundles uploaded; apply-rbac continues once the cluster is ready
                     (it fails if a folder is still empty)
            REJECT: abort the pipeline (the hosted cluster is NOT torn down automatically)
        - name: numberOfApprovalsRequired
          value: '1'
        - name: timeout
          value: '336h'

    # Step 1: Clone repository
    - name: fetch-repository
      taskRef: { name: git-clone }
      params:
        - name: url
          value: $(params.repoUrl)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: output
          workspace: source

    # Step 2: Create HostedCluster and NodePool
    - name: create-hosted-cluster
      runAfter: [fetch-repository, preflight-check]
      taskRef: { name: hcp-create-hosted-cluster }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: releaseImage
          value: $(params.releaseImage)
        - name: nodePoolReplicas
          value: $(params.nodePoolReplicas)
        - name: nodePoolCpuCores
          value: $(params.nodePoolCpuCores)
        - name: nodePoolMemoryGB
          value: $(params.nodePoolMemoryGB)
        - name: rootDiskSizeGB
          value: $(params.rootDiskSizeGB)
        - name: pullSecretName
          value: $(params.pullSecretName)
        - name: etcdStorageClass
          value: $(params.etcdStorageClass)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 3: Wait for cluster to be ready
    - name: wait-cluster-ready
      runAfter: [create-hosted-cluster]
      taskRef: { name: hcp-wait-cluster-ready }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: timeoutMinutes
          value: "90"
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 3.5: Create NFS StorageClass (nfs-rwx) on the hosted cluster
    - name: create-nfs-storageclass
      runAfter: [wait-cluster-ready]
      taskRef: { name: hcp-create-nfs-storageclass }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: nfsPersistenceSize
          value: $(params.nfsPersistenceSize)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # =============================================
    # Phase 2: OSSM3 Dedicated Mesh Setup
    # =============================================

    # Step 4: Verify Service Mesh 3.x operators on hosted cluster
    - name: verify-operators
      runAfter: [create-nfs-storageclass]
      taskRef: { name: ossm3-verify-operators }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: ossm3Channel
          value: $(params.ossm3Channel)
      workspaces:
        - name: source
          workspace: source

    # Step 5: Download and apply RBAC permissions from S3 (restricted-access resources)
    #         This creates namespaces and applies CRDs, ClusterRoles, RoleBindings, etc.
    - name: apply-rbac
      runAfter: [verify-operators, approval-upload-restricted-resources]
      taskRef: { name: ossm3-download-and-apply-rbac }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: obcName
          value: $(params.obcName)
        - name: s3Prefix
          value: $(params.s3Prefix)
        - name: requiredComponents
          value: $(params.restrictedResourcesComponents)
      workspaces:
        - name: source
          workspace: source

    # Step 6: Prepare namespaces with labels and SCC annotations (dedicated mesh variant)
    #         Uses istio.io/rev=sap-mesh-istio for revision-based sidecar injection
    #         instead of istio-injection=enabled. Also removes istio-injection labels
    #         that may have been added by the RBAC resource zip files.
    - name: prepare-namespaces
      runAfter: [apply-rbac]
      taskRef: { name: ossm3-prepare-namespaces-dedicated }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 7: Configure dedicated SAP Service Mesh (istio-system-sap-edge)
    #         Creates an independent Istio control plane with revision-based
    #         injection, isolated from any shared mesh on the cluster.
    - name: configure-mesh
      runAfter: [prepare-namespaces]
      taskRef: { name: ossm3-configure-dedicated-mesh }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: proxySecretName
          value: $(params.hubClusterName)-proxy-config
      workspaces:
        - name: source
          workspace: source

    # Step 8: Generate SA-based restricted kubeconfig for ELM registration
    - name: generate-sa-based-kubeconfig
      runAfter: [configure-mesh]
      taskRef: { name: ossm3-generate-sa-based-kubeconfig }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # =============================================
    # Phase 3: Deploy EIC Services
    #   Shared PostgreSQL for all cells; one Redis/Valkey per EIC cell
    #   (instance eic-N -> namespace sap-eic-external-<datastore>-eic-N).
    #   Every cell2-* task is skipped when cellCount=1.
    # =============================================

    # Step 9: Enable User Workload Monitoring (parallel with DB deployment)
    #         discoverNamespaces: find the EIC namespaces of every cell by label
    - name: enable-monitoring
      runAfter: [generate-sa-based-kubeconfig]
      taskRef: { name: hcp-enable-monitoring }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: discoverNamespaces
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # Step 10: Deploy PostgreSQL on hosted cluster (shared by all EIC cells,
    #          parallel with Redis/Valkey and monitoring)
    - name: deploy-postgres
      runAfter: [generate-sa-based-kubeconfig]
      taskRef: { name: hcp-deploy-postgres }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: postgresVersion
          value: $(params.postgresVersion)
        - name: postgresHA
          value: $(params.postgresHA)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 10a: Deploy Redis per EIC cell (instance eic-N -> sap-eic-external-redis-eic-N;
    #           parallel with PostgreSQL, when datastoreType=redis)
    - name: cell1-deploy-redis
      runAfter: [generate-sa-based-kubeconfig]
      when:
        - input: "$(params.datastoreType)"
          operator: in
          values: ["redis"]
      taskRef: { name: hcp-deploy-redis }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: redisClusterType
          value: $(params.redisClusterType)
        - name: instance
          value: eic-1
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    - name: cell2-deploy-redis
      runAfter: [generate-sa-based-kubeconfig]
      when:
        - input: "$(params.datastoreType)"
          operator: in
          values: ["redis"]
        - input: "$(params.cellCount)"
          operator: in
          values: ["2"]
      taskRef: { name: hcp-deploy-redis }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: redisClusterType
          value: $(params.redisClusterType)
        - name: instance
          value: eic-2
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 10b: Deploy Valkey per EIC cell (instance eic-N -> sap-eic-external-valkey[-cluster]-eic-N;
    #           parallel with PostgreSQL, when datastoreType=valkey-*)
    - name: cell1-deploy-valkey
      runAfter: [generate-sa-based-kubeconfig]
      when:
        - input: "$(params.datastoreType)"
          operator: in
          values: ["valkey-standalone", "valkey-cluster"]
      taskRef: { name: hcp-deploy-valkey }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: datastoreType
          value: $(params.datastoreType)
        - name: instance
          value: eic-1
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    - name: cell2-deploy-valkey
      runAfter: [generate-sa-based-kubeconfig]
      when:
        - input: "$(params.datastoreType)"
          operator: in
          values: ["valkey-standalone", "valkey-cluster"]
        - input: "$(params.cellCount)"
          operator: in
          values: ["2"]
      taskRef: { name: hcp-deploy-valkey }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: datastoreType
          value: $(params.datastoreType)
        - name: instance
          value: eic-2
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Step 11: Get all credentials per EIC cell and display them
    #          (shared PostgreSQL + the cell's own Redis/Valkey)
    - name: cell1-get-all-accesses
      runAfter: [deploy-postgres, cell1-deploy-redis, cell1-deploy-valkey, enable-monitoring]
      taskRef: { name: hcp-get-all-accesses }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: datastoreType
          value: $(params.datastoreType)
        - name: instance
          value: eic-1
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    - name: cell2-get-all-accesses
      runAfter: [deploy-postgres, cell2-deploy-redis, cell2-deploy-valkey, enable-monitoring]
      when:
        - input: "$(params.cellCount)"
          operator: in
          values: ["2"]
      taskRef: { name: hcp-get-all-accesses }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: datastoreType
          value: $(params.datastoreType)
        - name: instance
          value: eic-2
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # =============================================
    # Phase 4: Manual ELM/EIC Deployment + Tests (per EIC cell)
    # =============================================

    # Step 12: Manual approval after ELM/EIC and iFlow deployment (both cells)
    - name: approval-elm-eic-iflow-deployed
      runAfter: [cell1-get-all-accesses, cell2-get-all-accesses, enable-monitoring]
      taskRef:
        apiVersion: openshift-pipelines.org/v1alpha1
        kind: ApprovalTask
      params:
        - name: approvers
          value:
            - mjiao
            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            Dedicated OSSM3 mesh setup, shared PostgreSQL and per-cell Redis/Valkey deployed successfully.
            Credentials have been displayed (cell1-/cell2-get-all-accesses logs). Restricted kubeconfig generated.

            Cluster: $(params.hostedClusterName)
            Namespace: $(params.hostedClusterNamespace)
            Workers: $(params.nodePoolReplicas) x ($(params.nodePoolCpuCores) vCPU, $(params.nodePoolMemoryGB)GB RAM)
            Mesh: Dedicated SAP mesh (istio-system-sap-edge / sap-mesh-istio)
            Proxy: see $(params.hubClusterName)-proxy-config secret
            Datastore: $(params.datastoreType)
            EIC cells: $(params.cellCount) (1 = cell 1 only)

            Per-cell targets (<ingress domain> = ingress domain of the hosted cluster):
            Cell 1 (edge-icell-1):
              - EIC host: eic-1.<ingress domain>
              - Gateway namespace: istio-gateways-1 (istio-ingressgateway)
              - Redis/Valkey namespace: sap-eic-external-redis-eic-1 (redis),
                sap-eic-external-valkey-eic-1 (valkey-standalone) or
                sap-eic-external-valkey-cluster-eic-1 (valkey-cluster)
              - PostgreSQL: shared instance (same for every cell)
            Cell 2 (edge-icell-2) (skipped when cellCount=1):
              - EIC host: eic-2.<ingress domain>
              - Gateway namespace: istio-gateways-2 (istio-ingressgateway)
              - Redis/Valkey namespace: sap-eic-external-redis-eic-2 (redis),
                sap-eic-external-valkey-eic-2 (valkey-standalone) or
                sap-eic-external-valkey-cluster-eic-2 (valkey-cluster)
              - PostgreSQL: shared instance (same for every cell)

            Restricted kubeconfig stored as Secret 'edgelm-kubeconfig-generated-$(params.hostedClusterName)'.

            Please complete the following manually:
            1. Register the cluster in ELM as ONE Edge Node (use restricted kubeconfig, check "Restricted Access")
               - If proxy is configured, select "Enable HTTP Proxy" and set proxy from $(params.hubClusterName)-proxy-config secret
            2. Deploy EIC 1 on that Edge Node with host eic-1.<ingress domain> (gateway istio-gateways-1),
               its Redis/Valkey (namespace suffix -eic-1) and the shared PostgreSQL
            3. Deploy EIC 2 on the same Edge Node with host eic-2.<ingress domain> (gateway istio-gateways-2),
               its Redis/Valkey (namespace suffix -eic-2) and the shared PostgreSQL (skip when cellCount=1)
            4. Deploy iFlows for testing on each EIC cell
            5. After each resource download, re-run label cleanup:
               oc label namespace -l edgelm.sap.com/product=edgelm istio-injection-

            After deployment is complete and istio-ingressgateway in each istio-gateways-N has a LoadBalancer IP:
            APPROVE: Continue with per-cell ConfigMap creation and endpoint tests
            REJECT: Skip tests and proceed to teardown
        - name: numberOfApprovalsRequired
          value: '1'
        - name: timeout
          value: '336h'

    # Step 13: Verify monitoring (ServiceMonitors and Prometheus targets, all cells)
    - name: verify-monitoring
      runAfter: [approval-elm-eic-iflow-deployed]
      taskRef: { name: hcp-verify-monitoring }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: discoverNamespaces
          value: "true"
      workspaces:
        - name: source
          workspace: source

    # Step 14-16 (per cell): ConfigMap -> EndpointSlice fix -> Route
    #   14: Validate and create ConfigMap cluster-info-hcp-<cluster>-N (host eic-N.<domain>)
    #   15: Fix EndpointSlice for Hypershift KubeVirt OCP 4.21 bug on the cell's
    #       gateway service (service-sync may fail to create EndpointSlices for
    #       LoadBalancer services, breaking MetalLB routing)
    #   16: Create OpenShift Route for the cell's EIC (passthrough TLS) and
    #       ConfigMap route-info-hcp-<cluster>-N

    # --- Cell 1 (edge-icell-1, istio-gateways-1) ---
    - name: cell1-validate-and-create-configmap
      runAfter: [approval-elm-eic-iflow-deployed]
      taskRef: { name: hcp-validate-and-create-configmap }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: gatewayNamespace
          value: istio-gateways-1
        - name: hostPrefix
          value: eic-1
        - name: configMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-1"
      workspaces:
        - name: source
          workspace: source

    - name: cell1-fix-endpointslice
      runAfter: [cell1-validate-and-create-configmap, verify-monitoring]
      taskRef: { name: hcp-fix-endpointslice }
      params:
        - name: hostedClusterName
          value: $(params.hostedClusterName)
        - name: hostedClusterNamespace
          value: $(params.hostedClusterNamespace)
        - name: guestServiceNamespace
          value: istio-gateways-1
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    - name: cell1-create-eic-route
      runAfter: [cell1-fix-endpointslice]
      taskRef: { name: hcp-create-eic-route }
      params:
        - name: hostedClusterName
