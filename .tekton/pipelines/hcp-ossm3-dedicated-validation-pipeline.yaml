    - name: cell2-test-slvredis-route
      runAfter: [approval-route-test-round]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
        - input: "$(params.cellCount)"
          operator: in
          values: ["2"]
      taskRef: { name: endpoint-tests }
      params:
