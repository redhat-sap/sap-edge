    # --- Round 2, cell 2 (cluster-info-hcp-<cluster>-2) ---
    - name: cell2-test-httpbinipfilter-round2
      runAfter: [approval-second-test-round]
      when:
        - input: "$(params.testHttpbinipfilter)"
          operator: in
          values: ["true"]
        - input: "$(params.cellCount)"
          operator: in
          values: ["2"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /httpbinipfilter
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-2"
        - name: eicAuthSecretName
