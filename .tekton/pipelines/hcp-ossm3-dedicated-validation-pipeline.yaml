            script: |
              echo "⏳ Cooling down for 30s to let rate limiter recover..."
              sleep 30
              echo "✅ Cooldown complete."

    # Step 18: Manual approval before second round of tests (waits for both cells)
    - name: approval-second-test-round
      runAfter:
        - cell1-test-httpbinipfilter
        - cell1-test-http-test1
        - cell1-test-http-testelster
        - cell1-test-slvredis
        - cell1-cooldown-after-round1
        - cell2-test-httpbinipfilter
        - cell2-test-http-test1
        - cell2-test-http-testelster
        - cell2-test-slvredis
        - cell2-cooldown-after-round1
      taskRef:
        apiVersion: openshift-pipelines.org/v1alpha1
        kind: ApprovalTask
      params:
        - name: approvers
          value:
            - mjiao
            - rbhandar
            - ksatarin
            - kubeadmin
            - kube:admin
            - system:admin
        - name: description
          value: |
            First round of endpoint tests completed successfully for every enabled EIC cell.

            Cluster: $(params.hostedClusterName)
            Mesh: Dedicated SAP mesh (istio-system-sap-edge)
            EIC cells: $(params.cellCount)
            Cell 1 (edge-icell-1): eic-1 via istio-gateways-1, ConfigMap cluster-info-hcp-$(params.hostedClusterName)-1
            Cell 2 (edge-icell-2): eic-2 via istio-gateways-2, ConfigMap cluster-info-hcp-$(params.hostedClusterName)-2 (skipped when cellCount=1)

            ✅ APPROVE: Run second round of endpoint tests (both cells)
            ❌ REJECT: Skip second round and proceed
        - name: numberOfApprovalsRequired
          value: '1'
        - name: timeout
          value: '336h'

    # Step 19: Second round of endpoint tests, per cell (staggered)
    # --- Round 2, cell 1 (cluster-info-hcp-<cluster>-1) ---
    - name: cell1-test-httpbinipfilter-round2
      runAfter: [approval-second-test-round]
      when:
        - input: "$(params.testHttpbinipfilter)"
          operator: in
