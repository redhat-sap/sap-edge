        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
        - name: startDelay
          value: "6"
      workspaces:
        - name: source
          workspace: source

    - name: cell1-test-slvredis-round2
      runAfter: [approval-second-test-round]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskRef: { name: endpoint-tests }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    - name: cell1-test-ratelimit-slvredis-round2
      runAfter: [cell1-test-slvredis-round2]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskRef: { name: rate-limit-test }
      params:
        - name: endpointPath
          value: /slvredis
        - name: clusterConfigMapName
          value: "cluster-info-hcp-$(params.hostedClusterName)-1"
        - name: eicAuthSecretName
          value: $(params.eicAuthSecretName)
        - name: publicDNS
          value: $(params.publicDNS)
        - name: hubKubeconfigSecretName
          value: $(params.hubClusterName)-kubeconfig
      workspaces:
        - name: source
          workspace: source

    # Cooldown after cell 1's rate-limit test to let the rate limiter window recover
    - name: cell1-cooldown-after-round2
      runAfter: [cell1-test-ratelimit-slvredis-round2]
      when:
        - input: "$(params.testSlvredis)"
          operator: in
          values: ["true"]
      taskSpec:
        steps:
          - name: cooldown
            image: registry.access.redhat.com/ubi9/ubi-minimal
            script: |
              echo "⏳ Cooling down for 30s to let rate limiter recover..."
