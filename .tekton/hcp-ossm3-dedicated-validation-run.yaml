# Prerequisites:
# 1. Ensure the ObjectBucketClaim (OBC) 'sap-eic-restricted-cluster-config-resources'
#    is created and bound in the pipeline namespace. The pipeline creates the
#    folders elm/, edge-icell-1/, edge-icell-2/ under 'restricted-resources/pr<N>/' (one set per PR)
#    and waits for the bundles in two passes: wait-elm-zip (elm/), then, after the
#    Edge Node is registered and the EIC cells are deployed in ELM, wait-eic-zips
#    (edge-icell-N/).
#
# 2. Ensure the Service Mesh 3.x operator is installed on the target cluster
#    (via OperatorHub or CLI before running this pipeline)
#
# Scenario: Dedicated SAP service mesh (istio-system-sap-edge) without proxy,
#   two Edge Integration Cells sharing one edgelm (multi-EIC topology A, see
#   .tekton/README.md, "Multi-EIC restricted resources")
#   - Deploys an independent Istio control plane 'sap-mesh-istio'
#   - Uses revision-based sidecar injection (istio.io/rev=sap-mesh-istio)
#   - Isolated from any shared mesh on the same cluster

---
apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: hcp-ossm3-dedicated-pr{{ pull_request_number }}-
  annotations:
    pipelinesascode.tekton.dev/on-event: "[pull_request]"   # only PRs
    pipelinesascode.tekton.dev/on-target-branch: "[main]"
    pipelinesascode.tekton.dev/task: "[./.tekton/tasks/git-clone.yaml]"
    pipelinesascode.tekton.dev/max-keep-runs: "1"
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
spec:
  pipelineRef:
    name: hcp-ossm3-dedicated-validation-pipeline
  timeouts:
    pipeline: "336h"      # Total pipeline timeout (14 days)
    tasks: "335h"         # Individual task timeout (tasks + finally must be <= pipeline)
    finally: "60m"        # Finally tasks timeout
  params:
    # --- Git parameters ---
    - name: repoUrl
      value: "{{ repo_url }}"
    - name: revision
      value: "{{ revision }}"
    - name: pullRequestNumber
      value: "{{ pull_request_number }}"

    # --- HCP cluster parameters ---
    # hostedClusterName: include hubClusterName to avoid collisions across hubs
    # Pattern: {prefix}-{hubClusterName}-pr{number}
    - name: hostedClusterName
      value: "hcp-dedicated-eli-pr{{ pull_request_number }}"
    # hostedClusterName: include hubClusterName to avoid collisions across hubs
    # Pattern: {prefix}-{hubClusterName}-pr{number}
    - name: hostedClusterNamespace
      value: "clusters"
    - name: releaseImage
      value: "quay.io/openshift-release-dev/ocp-release:4.21.7-x86_64"
    - name: nodePoolReplicas
      value: "3"
    - name: nodePoolCpuCores
      value: "16"
    - name: nodePoolMemoryGB
      value: "32"
    - name: rootDiskSizeGB
      value: "120"
    - name: pullSecretName
      value: "mj-pull-secret"
    - name: etcdStorageClass
      value: ""
    # hubClusterName: name of the target hub cluster
    # The pipeline derives the kubeconfig secret as: {hubClusterName}-kubeconfig
    # Ensure a Secret named "{hubClusterName}-kubeconfig" exists with the hub's kubeconfig
    - name: hubClusterName
      value: "eli"

    # --- OSSM3 parameters ---
    - name: ossm3Channel
      value: "stable-3.2"
    - name: obcName
      value: "sap-eic-restricted-cluster-config-resources"
    - name: s3Prefix
      value: "restricted-resources/pr{{ pull_request_number }}/"
    # S3 folders under s3Prefix, one SAP bundle zip each (upload as downloaded):
    #   elm/           ELM bundle of the (single, shared) Edge Node (creates edgelm)
    #   edge-icell-1/  EIC bundle of cell 1 (edge-icell-1, istio-gateways-1, ...)
    #   edge-icell-2/  EIC bundle of cell 2 (edge-icell-2, istio-gateways-2, ...)
    # The pipeline creates these folders and applies them in two passes:
    #   1. wait-elm-zip -> apply-rbac-elm (elm/ only) -> mesh, edgelm labels,
    #      restricted kubeconfig
    #   2. register the Edge Node and deploy the EIC cells in ELM, upload the EIC
    #      zips: wait-eic-zips -> apply-rbac-eic (EIC folders only) -> EIC labels
    # Earlier zips stay in the folders (latest version per folder wins).
    # Same as the pipeline defaults; kept for visibility.
    - name: elmRestrictedResourcesComponents
      value: "elm"
    - name: eicRestrictedResourcesComponents
      value: "edge-icell-1 edge-icell-2"
    # Number of EIC cells to validate. With "1", every cell2-* task is skipped;
    # also drop edge-icell-2 from eicRestrictedResourcesComponents above.
    - name: cellCount
      value: "2"

    # --- EIC services parameters ---
    - name: postgresVersion
      value: "v15"
    - name: postgresHA
      value: "false"
    - name: datastoreType
      value: "redis"
    - name: redisClusterType
      value: "standard"

    # --- Endpoint test parameters ---
    - name: eicAuthSecretName
      value: "eic-auth-secret"
    - name: publicDNS
      value: "false"

    # --- Jira parameters ---
    - name: jiraSecretName
      value: "jira-secret-mj"
    - name: jiraIssueKey
      value: ""

    # --- Pipeline control ---
    - name: skipTeardown
      value: "false"
  workspaces:
    - name: source
      volumeClaimTemplate:
        spec:
          accessModes: [ReadWriteMany]
          storageClassName: ocs-storagecluster-cephfs
          resources:
            requests:
              storage: 2Gi
